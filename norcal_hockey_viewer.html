<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Hockey Stats DB</title>
<style>
  :root {
    --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3352;
    --accent:#4f8ef7;--accent2:#f7934f;--text:#e8eaf6;--muted:#8890b0;
    --green:#4caf7d;--red:#f76f6f;--radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;}
  header h1{font-size:1.15rem;font-weight:700;letter-spacing:.02em;}
  header h1 span{color:var(--accent);}
  .tab-bar{display:flex;gap:4px;margin-left:auto;}
  .tab-btn{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 18px;border-radius:6px;cursor:pointer;font-size:.9rem;font-weight:500;transition:all .15s;}
  .tab-btn:hover{color:var(--text);background:var(--surface2);}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  main{max-width:1200px;margin:0 auto;padding:28px 20px;}
  .view{display:none;}.view.active{display:block;}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
  .panel-title{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:14px;}
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:24px;}
  .global-filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding-bottom:18px;margin-bottom:22px;border-bottom:1px solid var(--border);}
  .global-filters select{min-width:170px;}
  .filter-note{font-size:.78rem;color:var(--muted);margin-left:auto;align-self:center;}
  .derived{border-bottom:1px dotted var(--muted);cursor:help;}
  .alias-note{font-size:.82rem;color:var(--muted);margin:-6px 0 16px;}
  .log-details{margin:10px 0 4px;}
  .log-details summary{cursor:pointer;font-size:.8rem;color:var(--muted);padding:6px 2px;user-select:none;}
  .log-details summary:hover{color:var(--text);}
  .log-details[open] summary{color:var(--text);}
  .log-table td,.log-table th{font-size:.82rem;padding:6px 10px;}
  .log-date{color:var(--muted);white-space:nowrap;}
  .log-class{color:var(--muted);font-size:.75rem;}
  .log-vs{color:var(--muted);}
  .log-loading{font-size:.8rem;color:var(--muted);padding:8px 2px;}
  .res-w{color:var(--green);font-weight:600;}
  .res-l{color:var(--red,#e5484d);font-weight:600;}
  .res-t{color:var(--muted);font-weight:600;}
  .strength-tag{font-size:.68rem;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--muted);}
  /* Team page */
  .team-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px;}
  .team-head h2{font-size:1.35rem;}
  .team-sub{color:var(--muted);font-size:.85rem;margin-bottom:18px;}
  .team-link{cursor:pointer;color:var(--accent);}
  .team-link:hover{text-decoration:underline;}
  .game-link{cursor:pointer;}
  .game-link:hover{background:var(--surface2);}
  .sched{color:var(--muted);font-style:italic;}
  .period-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:8px;}
  .period-cell{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px;text-align:center;}
  .period-cell .pc-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);}
  .period-cell .pc-val{font-size:1.15rem;font-weight:600;margin-top:3px;}
  .period-cell .pc-split{font-size:.72rem;color:var(--muted);margin-top:2px;}
  /* Box score */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:flex;
         align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;}
  .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
              max-width:840px;width:100%;padding:22px;position:relative;}
  .modal-close{position:absolute;top:10px;right:12px;background:transparent;border:none;
               color:var(--muted);font-size:1.5rem;line-height:1;cursor:pointer;}
  .modal-close:hover{color:var(--text);}
  .box-head{text-align:center;margin-bottom:4px;}
  .box-score-line{font-size:1.5rem;font-weight:700;}
  .box-meta{color:var(--muted);font-size:.82rem;text-align:center;margin-bottom:18px;}
  .box-sect{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
            margin:18px 0 8px;}
  .box-side{font-weight:600;}
  .goal-assists{color:var(--muted);font-size:.85rem;}
  /* Linemates */
  .mate-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.88rem;}
  .mate-bar{height:7px;background:var(--accent);border-radius:3px;min-width:2px;}
  .mate-n{color:var(--muted);font-size:.8rem;min-width:46px;}
  label{display:flex;flex-direction:column;gap:5px;font-size:.82rem;color:var(--muted);}
  select,input[type=text]{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:6px;font-size:.92rem;min-width:180px;outline:none;transition:border-color .15s;}
  select:focus,input[type=text]:focus{border-color:var(--accent);}
  select option{background:var(--surface2);}
  .section-heading{display:flex;align-items:baseline;gap:12px;margin-bottom:16px;}
  .section-heading h2{font-size:1.3rem;font-weight:700;}
  .badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;font-size:.78rem;color:var(--muted);}
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;}
  .table-wrap{border-radius:var(--radius);border:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;font-size:.88rem;}
  thead th{background:var(--surface2);color:var(--muted);padding:10px 14px;text-align:left;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;white-space:nowrap;position:sticky;top:var(--header-h,57px);z-index:10;}
  thead th:hover{color:var(--text);}
  thead th.sort-asc::after{content:' ▲';font-size:.65rem;}
  thead th.sort-desc::after{content:' ▼';font-size:.65rem;}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--surface2);}
  tbody td{padding:10px 14px;white-space:nowrap;}
  td.player-link,.player-link{color:var(--accent);cursor:pointer;font-weight:500;}
  td.player-link:hover,.player-link:hover{text-decoration:underline;}
  .team-link{color:var(--accent);cursor:pointer;}
  .team-link:hover{text-decoration:underline;}
  .num{text-align:right;font-variant-numeric:tabular-nums;}
  .pts{color:var(--accent2);font-weight:700;}
  .jersey{color:var(--muted);font-size:.82rem;}
  .goalie-row td:first-child::before{content:'🥅 ';font-size:.8rem;}
  .ph-section-divider td{background:var(--surface2);color:var(--muted);font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:3px 8px;border-top:2px solid var(--border);}
  .ph-goalie-subhdr td{color:var(--muted);font-size:.75rem;font-weight:600;text-align:right;padding:10px 14px;background:var(--surface2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;border-bottom:1px solid var(--border);cursor:pointer;user-select:none;}
  .ph-goalie-subhdr td:nth-child(2),.ph-goalie-subhdr td:nth-child(3){text-align:left;}
  .ph-goalie-subhdr td:hover{color:var(--text);}
  .ph-goalie-subhdr td.sort-asc::after{content:' ▲';font-size:.65rem;}
  .ph-goalie-subhdr td.sort-desc::after{content:' ▼';font-size:.65rem;}
  /* Fixed-layout tables so GP and stat columns stay locked at the same x across all seasons */
  .ph-table{table-layout:fixed;width:100%;}
  .ph-table td:first-child,.ph-table th:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .season-badge{display:inline-block;background:var(--accent);color:#fff;border-radius:4px;padding:1px 7px;font-size:.75rem;font-weight:700;}
  .div-badge{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 7px;font-size:.75rem;color:var(--muted);}
  .search-wrap{position:relative;}
  .autocomplete-list{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-top:none;border-radius:0 0 6px 6px;max-height:260px;overflow-y:auto;z-index:200;}
  .autocomplete-item{padding:9px 14px;cursor:pointer;font-size:.9rem;border-bottom:1px solid var(--border);transition:background .1s;display:flex;justify-content:space-between;align-items:center;}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover,.autocomplete-item.focused{background:var(--surface2);}
  .autocomplete-item .ac-sub{font-size:.75rem;color:var(--muted);}
  .player-history-header{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .player-history-header h2{font-size:1.5rem;font-weight:800;}
  .stat-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:22px;}
  .stat-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:14px 12px;text-align:center;}
  .stat-card .stat-val{font-size:1.6rem;font-weight:800;color:var(--accent);}
  .stat-card .stat-lbl{font-size:.72rem;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.06em;}
  .season-section{margin-bottom:28px;}
  .season-section-header{display:flex;align-items:center;gap:12px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
  .season-section-header h3{font-size:1rem;font-weight:700;}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:.95rem;}
  .empty .icon{font-size:2.5rem;margin-bottom:10px;}

  /* ── Club view styles ── */
  .club-totals-bar{display:flex;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:20px;overflow:hidden;}
  .ctb-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 10px;border-right:1px solid var(--border);}
  .ctb-item:last-child{border-right:none;}
  .ctb-val{font-size:1.8rem;font-weight:800;color:var(--accent);}
  .ctb-lbl{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px;}
  .club-team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-bottom:24px;}
  .club-team-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;cursor:pointer;transition:all .15s;}
  .club-team-card:hover,.club-team-card.active{border-color:var(--accent);background:#1a2240;}
  .club-team-card.active{box-shadow:0 0 0 2px var(--accent);}
  .ctc-name{font-size:1rem;font-weight:700;margin-bottom:6px;}
  .ctc-div{margin-bottom:12px;}
  .ctc-stats{display:flex;gap:16px;}
  .ctc-stat{display:flex;flex-direction:column;align-items:center;}
  .ctc-stat strong{font-size:1.3rem;font-weight:800;color:var(--accent);}
  .pts-stat strong{color:var(--accent2);}
  .ctc-stat small{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  .team-pill{display:inline-block;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-size:.75rem;margin:2px;cursor:pointer;color:var(--accent);transition:background .12s;}
  .team-pill:hover{background:#1a2240;border-color:var(--accent);}
  .birth-yr{display:inline-block;font-size:.68rem;font-weight:600;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:3px;padding:0 4px;margin-left:5px;vertical-align:middle;white-space:nowrap;}

  .load-btn{background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:.82rem;font-weight:500;transition:all .15s;white-space:nowrap;}
  .load-btn:hover{color:var(--text);border-color:var(--accent);}
  .load-status{font-size:.75rem;margin-left:4px;display:none;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  @media(max-width:600px){
    /* Header */
    header{flex-wrap:wrap;padding:10px 14px;gap:10px;}
    header h1{font-size:1rem;}
    .tab-bar{margin-left:0;width:100%;}
    .tab-btn{flex:1;text-align:center;padding:9px 4px;font-size:.78rem;}
    /* Layout */
    main{padding:14px 12px;}
    .panel{padding:14px;}
    /* Controls — stack dropdowns full-width */
    .controls{flex-direction:column;gap:8px;}
    .controls label{width:100%;}
    select,input[type=text]{min-width:unset;width:100%;font-size:1rem;}
    .search-wrap{width:100%;}
    /* Tables — tighter cells, smooth touch scroll */
    main{-webkit-overflow-scrolling:touch;}
    thead th{padding:8px 10px;font-size:.68rem;}
    tbody td{padding:8px 10px;font-size:.82rem;}
    /* Player lookup */
    .player-history-header h2{font-size:1.2rem;}
    .stat-summary{grid-template-columns:repeat(3,1fr);}
    .stat-card{padding:10px 6px;}
    .stat-card .stat-val{font-size:1.25rem;}
    .stat-card .stat-lbl{font-size:.65rem;}
    /* Club view */
    .club-totals-bar{flex-wrap:wrap;}
    .ctb-item{min-width:50%;}
    .ctb-val{font-size:1.4rem;}
    .club-team-grid{grid-template-columns:1fr;}
    /* Misc */
    .empty{padding:40px 16px;}
    .section-heading h2{font-size:1.1rem;}
  }
  /* Player popup for flow view */
  #mig-player-popup{
    position:fixed;z-index:9999;
    background:#1e1e30;border:1px solid #4a4a6a;border-radius:8px;
    box-shadow:0 6px 24px rgba(0,0,0,.7);
    min-width:220px;max-width:380px;max-height:320px;
    display:none;overflow:hidden;
    font-family:'Segoe UI',system-ui,sans-serif;
  }
  .mig-popup-title{
    display:flex;align-items:center;gap:4px;
    padding:8px 10px 6px;
    background:#26263e;
    font-size:.8rem;font-weight:700;color:#c8c8e8;
    border-bottom:1px solid #3a3a5a;
    white-space:normal;overflow:hidden;
  }
  .mig-popup-count{font-weight:400;opacity:.65;font-size:.75rem;}
  .mig-popup-close{
    margin-left:auto;background:none;border:none;cursor:pointer;
    color:#888;font-size:1rem;line-height:1;padding:0 2px;
  }
  .mig-popup-close:hover{color:#fff;}
  .mig-popup-body{
    overflow-y:auto;max-height:264px;padding:4px 0;
  }
  .mig-popup-name{
    padding:3px 10px;font-size:.78rem;color:#d0d0f0;
    border-bottom:1px solid #2a2a42;
  }
  .mig-popup-name:last-child{border-bottom:none;}
  .mig-popup-name:hover{background:#2e2e4a;}
</style>
</head>
<body>
<header>
  <h1>⛸ California Hockey <span>Stats DB</span></h1>
  <div style="display:flex;align-items:center;gap:6px;margin-left:auto;margin-right:16px;">
    <span class="load-status" id="load-status">✓ Loaded</span>
  </div>
  <div class="tab-bar">
    <button class="tab-btn active" onclick="showView('browse',this)">Browse by Season</button>
    <button class="tab-btn" onclick="showView('club',this)">Club View</button>
    <button class="tab-btn" onclick="showView('player',this)">Player Lookup</button>
    <button class="tab-btn" onclick="showView('migration',this);renderMigration()">Player Flow</button>
  </div>
</header>
<main>

<!-- Both of these change what counts as a game in every view below, which is
     why they sit above the tabs instead of inside any one of them. -->
<div class="global-filters">
  <label>League
    <select id="sel-league" onchange="onFilterChange()">
      <option value="">— all leagues —</option>
    </select>
  </label>
  <label>Games counted
    <select id="sel-gameclass" onchange="onFilterChange()"></select>
  </label>
  <span class="filter-note" id="filter-note"></span>
</div>

<!-- VIEW 1: Browse by Season -->
<div class="view active" id="view-browse">
  <div class="controls">
    <label>Season
      <select id="sel-season" onchange="onSeasonChange()">
        <option value="">— select —</option>
      </select>
    </label>

    <label id="lbl-club-browse">Club
      <select id="sel-club-browse" onchange="onClubBrowseChange()">
        <option value="">— all —</option>
      </select>
    </label>
    <label id="lbl-div-browse">Division
      <select id="sel-div-browse" onchange="onBrowseRender()">
        <option value="">— all —</option>
      </select>
    </label>
    <label>Type
      <select id="sel-type" onchange="onBrowseRender()">
        <option value="skater">Skaters</option>
        <option value="goalie">Goalies</option>
        <option value="all" selected>— all —</option>
      </select>
    </label>
    <label>Min GP
      <select id="sel-min-gp" onchange="onBrowseRender()">
        <option value="1">1+</option>
        <option value="2">2+</option>
        <option value="3">3+</option>
        <option value="4">4+</option>
        <option value="5">5+</option>
        <option value="6">6+</option>
        <option value="7">7+</option>
        <option value="8">8+</option>
        <option value="9">9+</option>
      </select>
    </label>
  </div>
  <div id="browse-content">
    <div class="empty"><div class="icon">🏒</div>Select a season above to begin.</div>
  </div>
</div>

<!-- VIEW 2: Club View -->
<div class="view" id="view-club">
  <div class="controls">
    <label>Club
      <select id="sel-club" onchange="onClubChange()">
        <option value="">— select a club —</option>
      </select>
    </label>
    <label>Season
      <select id="sel-club-season" onchange="onClubSeasonChange()">
        <option value="">— all seasons —</option>
      </select>
    </label>
  </div>
  <div id="club-content">
    <div class="empty"><div class="icon">🏒</div>Select a club above to begin.</div>
  </div>
</div>

<!-- VIEW 3: Player Lookup -->
<div class="view" id="view-player">
  <div class="panel">
    <div class="panel-title">Search for a Player</div>
    <div class="search-wrap">
      <input type="text" id="player-search" placeholder="Type a player name…" autocomplete="off"
             oninput="onPlayerSearch()" onkeydown="onSearchKey(event)">
      <div class="autocomplete-list" id="ac-list" style="display:none"></div>
    </div>
  </div>
  <div id="player-content">
    <div class="empty"><div class="icon">👤</div>Search for a player to see their full history.</div>
  </div>
</div>

<!-- VIEW 4: Player Flow / Migration -->
<div class="view" id="view-migration">
  <div class="panel">
    <div class="panel-title">Player Flow Between Clubs — Season to Season</div>
    <div class="controls">
      <label>Season
        <select id="mig-season" onchange="renderMigration()">
          <option value="27">'21-'22</option>
          <option value="28">'22-'23</option>
          <option value="29">'23-'24</option>
          <option value="30">'24-'25</option>
          <option value="31" selected>'25-'26</option>
        </select>
      </label>
      <select id="mig-min-flow" style="display:none"><option value="1" selected>1+</option></select>
      <label>Club
        <select id="mig-focus-club" onchange="onMigFocusChange()">
          <option value="">All clubs</option>
        </select>
      </label>
      <label>Specific Team
        <select id="mig-team-filter" onchange="renderMigration()">
          <option value="">All teams</option>
        </select>
      </label>
    </div>
  </div>
  <div id="migration-content" style="overflow-x:auto;padding:0 4px;"></div>
  <div style="margin-top:12px;padding:0 4px;" id="migration-legend"></div>
</div>

<!-- VIEW 5: a single team. Reached by clicking a team anywhere, not from the
     tab bar: it only means anything once you have picked one. -->
<div class="view" id="view-team">
  <div id="team-content"></div>
</div>

</main>

<!-- The box score opens over whatever you were looking at, because you always
     arrive from a schedule or a game log and want to go back to it. -->
<div id="box-score" class="modal" style="display:none">
  <div class="modal-card">
    <button class="modal-close" onclick="closeBoxScore()">×</button>
    <div id="box-score-body"></div>
  </div>
</div>
<script>
window.onerror = function(msg,src,line,col,err) {
  document.body.insertAdjacentHTML('afterbegin','<div style="position:fixed;top:0;left:0;right:0;background:red;color:white;padding:10px;z-index:9999;font-size:14px">JS ERROR line '+line+': '+msg+'</div>');
};
// ══════════════════════════════════════════════════════════════════════════
// DATA LAYER
// ══════════════════════════════════════════════════════════════════════════
// The collector publishes its dataset split by granularity, not by season:
// core.json carries everything cross-season and aggregate and is enough for
// every view here, while per-game detail is fetched on demand from
// logs/pNN.json (bucketed by player id) and games/sNN.json (by season).
//
// Identity is settled upstream. Players arrive with real ids, birth years and
// aliases already resolved, so nothing in this file tries to work out who is
// who from a name -- the rules for that live in the collector, where they can
// be argued with.

var APP = {
  base: null,              // settled on first fetch, see APP_DATA_SOURCES
  core: null,
  seasons: [],            // season ids, oldest first
  seasonById: {},
  leagues: [],
  leagueById: {},
  divisionById: {},
  teamByKey: {},          // "season:id" -> team
  labelByKey: {},          // "season:id" -> the team's short label
  playerById: {},
  players: [],
  clubByName: {},          // canonical name -> {name, short, kind}
  standingsByKey: {},     // "season:id" -> standings row
  clubs: [],
  logs: {},               // shard index -> {playerId: [game lines]}
  games: {}               // season id -> {gameId: detail}
};

// A team id is only unique inside its season: the collector keys the teams
// table on (team_id, season_id) and the site reuses an id for a club's entry
// in every season it plays. 2,441 team rows share just 885 distinct ids, so
// looking one up by id alone silently fuses six seasons into one.
function teamKey(season, id) { return season + ':' + id; }
function teamFor(season, id) { return APP.teamByKey[teamKey(season, id)] || null; }

// The dataset is published to a branch of its own, but a working copy has it
// under data/app. Try the local one first so a checkout needs no editing, and
// fall back to the published branch so the single file works from anywhere.
// Whichever answers first is remembered, so this costs one request, not two.
var APP_DATA_SOURCES = [
  'data/app/',
  'https://raw.githubusercontent.com/lamfalus/norcal-hockey/data/'
];

function loadJSON(path) {
  if (APP.base) return fetchJSON(APP.base + path, path);
  return APP_DATA_SOURCES.reduce(function(chain, source) {
    return chain.catch(function() {
      return fetchJSON(source + path, path).then(function(payload) {
        APP.base = source;
        return payload;
      });
    });
  }, Promise.reject());
}

function fetchJSON(url, path) {
  return fetch(url).then(function(res) {
    if (!res.ok) throw new Error(path + ' → HTTP ' + res.status);
    return res.json();
  });
}

// ── Season labels ─────────────────────────────────────────────────────────
// The site calls a season by the year it starts in; everyone at the rink calls
// it by the pair of years it spans.
var SEASONS = [];
var SEASON_LABELS = {};

// ── Team naming ───────────────────────────────────────────────────────────
// Recent seasons suffix a team name with its age and tier ("Aliso Viejo
// Avalanche 10B-1"); older ones do not, and every one of a club's teams is
// just the club name -- 184 season/name pairs collide that way. Where the name
// says nothing, the division does, and the club's own numbering separates the
// teams left over.
var TEAM_SUFFIX_RE = /\s(\d{2}[A-Z]*(?:-\d+)?)$/;

function teamLabel(team) {
  if (!team) return '';
  return APP.labelByKey[teamKey(team.season, team.id)] || team.name;
}

// Worked out in two passes, because a label is only ambiguous relative to the
// club's other teams that season. The club's own numbering separates them
// where it can; where it cannot -- one club entering a team in two leagues
// whose divisions share a name, so both are "Girls 12AA" with seq 1 -- the
// league is the only thing left that tells them apart.
function computeTeamLabels(teams) {
  var base = {};
  teams.forEach(function(t) {
    var key = teamKey(t.season, t.id);
    var m = t.name.match(TEAM_SUFFIX_RE);
    var div = APP.divisionById[t.division];
    base[key] = m ? m[1] : (div ? div.name : t.name);
  });

  var groups = {};
  teams.forEach(function(t) {
    var k = t.season + '|' + t.club + '|' + base[teamKey(t.season, t.id)];
    (groups[k] = groups[k] || []).push(t);
  });

  // Whatever tells the teams apart, in order of how much it tells a reader.
  var tiebreakers = [
    function(t, b) { return b + ' #' + t.seq; },
    function(t, b) {
      var league = APP.leagueById[t.league];
      return league ? b + ' (' + league.name + ')' : null;
    },
    function(t, b) {
      var div = APP.divisionById[t.division];
      return div ? b + ' · ' + div.name : null;
    }
  ];

  Object.keys(groups).forEach(function(k) {
    var list = groups[k];
    var keyOf = function(t) { return teamKey(t.season, t.id); };
    if (list.length === 1) {
      APP.labelByKey[keyOf(list[0])] = base[keyOf(list[0])];
      return;
    }
    for (var i = 0; i < tiebreakers.length; i++) {
      var labels = list.map(function(t) { return tiebreakers[i](t, base[keyOf(t)]); });
      var unique = {};
      labels.forEach(function(l) { if (l) unique[l] = true; });
      if (labels.every(Boolean) && Object.keys(unique).length === list.length) {
        list.forEach(function(t, n) { APP.labelByKey[keyOf(t)] = labels[n]; });
        return;
      }
    }
    // Nothing in the data separates them, so fall back to their order.
    list.forEach(function(t, n) { APP.labelByKey[keyOf(t)] = base[keyOf(t)] + ' #' + (n + 1); });
  });
}

// Built from the club's display name rather than the name the site printed, so
// a team reads "SJ Jr. Sharks 10-1" instead of "San Jose Jr Sharks 10-1" -- the
// difference is worth having on a phone at a rink.
function teamName(team) {
  if (!team) return '';
  var club = clubDisplayName(team.club);
  var label = teamLabel(team);
  // A girls club sits in a girls division, so both names carry the word and
  // the team reads "Jr. Sharks Girls Girls 10-U". The club has already said it.
  var tail = club.split(' ').pop().toLowerCase();
  var head = label.split(' ')[0].toLowerCase();
  if (tail && tail === head) label = label.split(' ').slice(1).join(' ');
  return (club + ' ' + label).trim();
}

// The collector settles what a club is called; this is the shorter name it
// keeps for showing. Falls back to the canonical name for anything the
// collector has not classified yet.
function clubDisplayName(c) {
  var club = APP.clubByName[c];
  return club ? club.short : (c || '');
}

// Bracket slots, high schools and teams that only ever visit all keep their
// names -- schedules need them -- but none of them belongs in a list of clubs
// to browse.
function isBrowsableClub(c) {
  var club = APP.clubByName[c];
  return !club || club.kind === 'club';
}

// The newest season anybody has actually played a game in. A season appears on
// the site as soon as its rosters are posted, months before the first puck
// drops, so the newest season is regularly an empty one -- landing a view on it
// shows a page with nothing on it.
function latestSeasonWithData() {
  var played = {};
  APP.players.forEach(function(p) {
    p.seasons.forEach(function(s) { played[s.season] = true; });
  });
  for (var i = SEASONS.length - 1; i >= 0; i--) {
    if (played[SEASONS[i]]) return SEASONS[i];
  }
  return SEASONS[SEASONS.length - 1];
}

// ── Indexing ──────────────────────────────────────────────────────────────
function indexCore(core) {
  APP.core = core;
  APP.players = core.players;

  SEASONS = core.seasons.map(function(s) { return s.id; });
  APP.seasons = SEASONS;
  core.seasons.forEach(function(s) {
    APP.seasonById[s.id] = s;
    var start = String(s.startYear).slice(2);
    var end = String(s.startYear + 1).slice(2);
    SEASON_LABELS[s.id] = "'" + start + "-'" + end;
  });

  APP.leagues = core.leagues;
  core.leagues.forEach(function(l) { APP.leagueById[l.id] = l; });
  core.divisions.forEach(function(d) { APP.divisionById[d.id] = d; });

  core.teams.forEach(function(t) { APP.teamByKey[teamKey(t.season, t.id)] = t; });
  (core.clubs || []).forEach(function(c) { APP.clubByName[c.name] = c; });
  computeTeamLabels(core.teams);
  core.standings.forEach(function(s) {
    APP.standingsByKey[teamKey(s.season, s.team)] = s;
  });
  core.players.forEach(function(p) { APP.playerById[p.id] = p; });

  APP.clubs = (core.clubs || [])
    .filter(function(c) { return c.kind === 'club'; })
    .map(function(c) { return c.name; })
    .sort(function(a, b) {
      return clubDisplayName(a).localeCompare(clubDisplayName(b));
    });
}

// ── Filters ───────────────────────────────────────────────────────────────
// Every stat line is tagged with the class of game it came from. Preseason and
// exhibition games are a third of all lines, so folding them into a season
// total quietly inflates it -- the filter decides what counts, and defaults to
// the games a standings table would count.
var GAME_CLASS_PRESETS = [
  { id: 'league',     label: 'Regular + Playoffs', classes: ['regular', 'playoff'] },
  { id: 'regular',    label: 'Regular season',     classes: ['regular'] },
  { id: 'playoff',    label: 'Playoffs',           classes: ['playoff'] },
  { id: 'preseason',  label: 'Preseason',          classes: ['preseason'] },
  { id: 'exhibition', label: 'Exhibition',         classes: ['exhibition'] },
  { id: 'all',        label: 'All games',          classes: null }
];

var FILTERS = { gameClass: 'league', league: '' };

function classFilter() {
  var preset = GAME_CLASS_PRESETS.filter(function(p) { return p.id === FILTERS.gameClass; })[0];
  if (!preset || !preset.classes) return null;
  var set = {};
  preset.classes.forEach(function(c) { set[c] = true; });
  return set;
}

// ── Entries ───────────────────────────────────────────────────────────────
// One row per player, season, team and role, which is the grain every table in
// the app reads. Rebuilt whenever a filter changes: 37,000 splits collapse in
// a few milliseconds, which is cheaper than keeping a filtered copy of each.
var ALL_ENTRIES = [];

function buildEntries() {
  var classes = classFilter();
  var league = FILTERS.league ? parseInt(FILTERS.league) : null;
  var rows = [];
  var byKey = {};

  APP.players.forEach(function(p) {
    var goalieSeasons = {};
    p.seasons.forEach(function(s) { if (s.goalie) goalieSeasons[s.season] = (goalieSeasons[s.season] || 0) + 1; });
    // Just this player's rows. Reaching into the full list to find them again
    // means scanning all 25,000 of them once per player, which is most of a
    // ten-second load and happens again on every filter change.
    var mine = [];

    p.seasons.forEach(function(s) {
      if (classes && !classes[s['class']]) return;
      var team = teamFor(s.season, s.team);
      if (!team) return;
      if (league && team.league !== league) return;

      var key = p.id + '|' + s.season + '|' + s.team + '|' + (s.goalie ? 'g' : 's');
      var row = byKey[key];
      if (!row) {
        var div = APP.divisionById[team.division];
        row = byKey[key] = {
          playerId: p.id, playerName: p.name, born: p.born, bornRange: p.bornRange,
          season: s.season, teamId: s.team, teamKey: teamKey(s.season, s.team),
          team: teamName(team), teamBase: teamName(team), teamShort: teamLabel(team),
          club: team.club || '', division: div ? div.name : '',
          leagueId: team.league, gender: team.gender,
          type: s.goalie ? 'goalie' : 'skater', jersey: s.jersey || '',
          GP: 0, G: 0, A: 0, PIM: 0, PPG: 0, SHG: 0, GA: 0
        };
        rows.push(row);
        mine.push(row);
      }
      row.GP += s.gp;
      row.G += s.g;
      row.A += s.a;
      row.PIM += s.pim;
      row.PPG += s.ppg;
      row.SHG += s.shg;
      if (s.ga != null) row.GA += s.ga;
      if (!row.jersey && s.jersey) row.jersey = s.jersey;
    });

    // Shots and save percentage come from the league's own goalie table, never
    // from the scoresheet shot grids: only about one grid in seven adds up.
    // That table is per season, so it can only be trusted onto a row when the
    // goalie played for a single team that season.
    if (p.official) {
      mine.forEach(function(row) {
        if (row.type !== 'goalie') return;
        if (goalieSeasons[row.season] !== 1) return;
        var off = p.official[row.season + ':goalie'];
        if (!off) return;
        if (off.shots != null) row.Shots = off.shots;
        if (off.so != null) row.SO = off.so;
        if (off.gaa) row.GAA = parseFloat(off.gaa);
        if (off.savePct) row['Save%'] = off.savePct;
        row.official = true;
      });
    }
  });

  // Without the league's table, goals against per game is the honest stand-in
  // for GAA -- it is the same figure whenever a goalie went the distance, and
  // it is marked so nobody reads it as the published number.
  rows.forEach(function(row) {
    if (row.type !== 'goalie' || row.GAA != null) return;
    row.GAA = row.GP > 0 ? (row.GA / row.GP) : 0;
    row.derivedGAA = true;
  });

  ALL_ENTRIES = rows;
  window.ALL_ENTRIES = rows;
  return rows;
}

// ── Detail, fetched on demand ─────────────────────────────────────────────
function loadPlayerLog(playerId) {
  var player = APP.playerById[playerId];
  if (!player) return Promise.resolve([]);
  var shard = player.shard;
  if (APP.logs[shard]) return Promise.resolve(APP.logs[shard][playerId] || []);
  var name = 'logs/p' + (shard < 10 ? '0' + shard : shard) + '.json';
  return loadJSON(name).then(function(payload) {
    APP.logs[shard] = payload.players || {};
    return APP.logs[shard][playerId] || [];
  });
}

function loadSeasonGames(season) {
  if (APP.games[season]) return Promise.resolve(APP.games[season]);
  return loadJSON('games/s' + season + '.json').then(function(payload) {
    APP.games[season] = payload.games || {};
    return APP.games[season];
  }).catch(function() {
    // A season that has started but finished nothing yet has no shard at all.
    APP.games[season] = {};
    return APP.games[season];
  });
}

// ── View switching ──
function captureAppState(viewOverride) {
  var views = ['browse','club','player','team','migration'];
  var v = viewOverride || views.find(function(v){ return document.getElementById('view-'+v).classList.contains('active'); }) || 'browse';
  var s = {view: v};
  if (v === 'browse') {
    s.season = document.getElementById('sel-season').value;
    s.club   = document.getElementById('sel-club-browse').value;
    s.div    = document.getElementById('sel-div-browse').value;
    s.type   = document.getElementById('sel-type').value;
    s.minGP  = document.getElementById('sel-min-gp').value;
  } else if (v === 'player') {
    s.playerId = CURRENT_PLAYER_ID;
  } else if (v === 'club') {
    s.clubName   = document.getElementById('sel-club').value;
    s.clubSeason = document.getElementById('sel-club-season').value;
  } else if (v === 'team') {
    s.teamKey = CURRENT_TEAM_KEY;
  }
  return s;
}
function applyAppState(s) {
  if (!s || !s.view) return;
  var viewOrder = ['browse','club','player','migration'];
  if (s.view === 'team') {
    document.querySelectorAll('.view').forEach(function(el){el.classList.remove('active');});
    document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active');});
    document.getElementById('view-team').classList.add('active');
    if (s.teamKey) renderTeam(s.teamKey);
    window.scrollTo({top:0, behavior:'smooth'});
    return;
  }
  document.querySelectorAll('.view').forEach(function(el){el.classList.remove('active');});
  document.querySelectorAll('.tab-btn').forEach(function(el){el.classList.remove('active');});
  document.getElementById('view-'+s.view).classList.add('active');
  var ti = viewOrder.indexOf(s.view);
  if (ti >= 0) document.querySelectorAll('.tab-btn')[ti].classList.add('active');
  if (s.view === 'browse') {
    if (s.season) document.getElementById('sel-season').value = s.season;
    if (s.type)   document.getElementById('sel-type').value = s.type;
    if (s.minGP)  document.getElementById('sel-min-gp').value = s.minGP;
    onSeasonChange();
    if (s.club) document.getElementById('sel-club-browse').value = s.club;
    onClubBrowseChange();
    if (s.div)  document.getElementById('sel-div-browse').value = s.div;
    onBrowseRender();
  } else if (s.view === 'player') {
    var p = APP.playerById[s.playerId];
    document.getElementById('player-search').value = p ? p.name : '';
    document.getElementById('ac-list').style.display = 'none';
    if (s.playerId) renderPlayerHistory(s.playerId);
  } else if (s.view === 'club') {
    if (s.clubName)   document.getElementById('sel-club').value = s.clubName;
    if (s.clubSeason) document.getElementById('sel-club-season').value = s.clubSeason;
    renderClub();
  } else if (s.view === 'migration') {
    renderMigration();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}
window.addEventListener('popstate', function(e){ applyAppState(e.state); });

function showView(v, btn) {
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  if(btn) btn.classList.add('active');
  history.pushState(captureAppState(v), '');
}

// ════════════════════════════════════════
// VIEW 1: Browse
// ════════════════════════════════════════
let browseSort={col:'PTS',dir:-1};
function initBrowse(){
  const sel=document.getElementById('sel-season');
  SEASONS.forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=SEASON_LABELS[s];sel.appendChild(o);});
  sel.value=latestSeasonWithData();
  onSeasonChange();
}
function onSeasonChange(){
  const season=parseInt(document.getElementById('sel-season').value);
  const clubSel=document.getElementById('sel-club-browse');
  const divSel=document.getElementById('sel-div-browse');
  // Reset both dropdowns
  clubSel.innerHTML='<option value="">— all —</option>';
  divSel.innerHTML='<option value="">— all —</option>';
  if(!season){onBrowseRender();return;}
  // Populate Club dropdown: all clubs with data for this season
  const entries=ALL_ENTRIES.filter(e=>e.season===season);
  const clubs=[...new Set(entries.map(e=>e.club).filter(Boolean))].filter(isBrowsableClub).sort((a,b)=>clubDisplayName(a).localeCompare(clubDisplayName(b)));
  clubs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=clubDisplayName(c);clubSel.appendChild(o);});
  // Populate Division dropdown: all divisions for this season
  const divs=[...new Set(entries.map(e=>e.division).filter(Boolean))].sort();
  divs.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;divSel.appendChild(o);});
  onBrowseRender();
}
function onClubBrowseChange(){
  const season=parseInt(document.getElementById('sel-season').value);
  const club=document.getElementById('sel-club-browse').value;
  const divSel=document.getElementById('sel-div-browse');
  const prevDiv=divSel.value;
  divSel.innerHTML='<option value="">— all —</option>';
  if(season){
    let entries=ALL_ENTRIES.filter(e=>e.season===season);
    if(club)entries=entries.filter(e=>e.club===club);
    const divs=[...new Set(entries.map(e=>e.division).filter(Boolean))].sort();
    divs.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;divSel.appendChild(o);});
    // Restore previous selection if still valid
    if(prevDiv && divs.includes(prevDiv))divSel.value=prevDiv;
  }
  onBrowseRender();
}
function onBrowseRender(){
  const season=parseInt(document.getElementById('sel-season').value);
  const club=document.getElementById('sel-club-browse').value;
  const div=document.getElementById('sel-div-browse').value;
  const type=document.getElementById('sel-type').value;
  const minGP=parseInt(document.getElementById('sel-min-gp').value)||1;
  if(!season){document.getElementById('browse-content').innerHTML='<div class="empty"><div class="icon">🏒</div>Select a season above to begin.</div>';return;}
  // Build label
  let subLabel='';
  if(club)subLabel+=' · '+clubDisplayName(club);
  if(div)subLabel+=' · '+div;
  const content=document.getElementById('browse-content');
  let html='';
  // Helper to filter entries
  const baseFilter=e=>e.season===season&&(club?e.club===club:true)&&(div?e.division===div:true);
  if(type==='skater'||type==='all'){
    let sk=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='skater'&&(parseInt(e.GP)||0)>=minGP);
    browseSort={col:'PTS',dir:-1};
    sk.sort((a,b)=>entryPts(b)-entryPts(a));
    if(sk.length){
      html+='<div class="section-heading"><h2>'+escHtml(SEASON_LABELS[season]+(subLabel||' · All'))+'</h2><span class="badge">'+sk.length+' skaters</span></div>'+renderSkaterTable(sk,true,'browse-table');
    } else {
      html+='<div class="empty" style="padding:12px 0"><div class="icon">📭</div>No skater data found.</div>';
    }
  }
  if(type==='goalie'||type==='all'){
    let gl=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='goalie'&&(parseInt(e.GP)||0)>=minGP);
    browseGoalieSort={col:'GAA',dir:1};
    gl.sort((a,b)=>(parseFloat(a.GAA)||0)-(parseFloat(b.GAA)||0));
    if(gl.length){
      if(type==='all')html+='<div style="margin-top:24px"></div>';
      const heading=type==='goalie'?'<div class="section-heading"><h2>'+escHtml(SEASON_LABELS[season]+(subLabel||' · All'))+'</h2><span class="badge">'+gl.length+' goalies</span></div>':'<div class="section-heading"><h2>Goalies</h2><span class="badge">'+gl.length+'</span></div>';
      html+=heading+renderGoalieTable(gl,true,'browse-goalie-table');
    } else {
      html+='<div class="empty" style="padding:12px 0"><div class="icon">📭</div>No goalie data found.</div>';
    }
  }
  if(!html)html='<div class="empty"><div class="icon">📭</div>No data found.</div>';
  content.innerHTML=html;
  if(type==='skater'||type==='all'){
    const sk=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='skater'&&(parseInt(e.GP)||0)>=minGP);
    attachSortHandlers('browse-table',sk,true);
  }
  if(type==='goalie'||type==='all'){
    const gl=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='goalie'&&(parseInt(e.GP)||0)>=minGP);
    attachGoalieSortHandlers('browse-goalie-table',gl,true);
  }
}
// Shared first-6-column widths for skater/goalie browse tables so columns align.
const BROWSE_SHARED_COLS='<col style="width:3%"><col style="width:20%"><col style="width:4%"><col style="width:19%"><col style="width:9%"><col style="width:5%">';
function renderSkaterTable(entries,showTeamDiv,tableId){
  const cols=showTeamDiv?['Rk','Player','#','Team','Division','GP','G','A','PTS','PIM','PPG','SHG','Pts/GP']:['Rk','Player','#','GP','G','A','PTS','PIM','PPG','SHG','Pts/GP'];
  const makeRow=(e,i)=>{
    const td=(v,cls='')=>'<td'+(cls?' class="'+cls+'"':'')+'>'+v+'</td>';
    const pts=entryPts(e);
    const base=[td(i+1,'num'),td('<span class="player-link" onclick="goToPlayer('+e.playerId+')">'+escHtml(e.playerName)+byLabel(e.playerId)+'</span>'),td(e.jersey||'','jersey')];
    if(showTeamDiv)base.push(td('<span class="team-link" onclick="goToTeam(\''+escAttr(e.teamKey)+'\')">'+escHtml(e.team)+'</span>'),td('<span class="div-badge">'+escHtml(e.division||'')+'</span>'));
    base.push(td(e.GP||0,'num'),td(e.G||0,'num'),td(e.A||0,'num'),td(pts,'num pts'),td(e.PIM||0,'num'),td(e.PPG||0,'num'),td(e.SHG||0,'num'),td(entryPtsPerGame(e),'num'));
    return '<tr>'+base.join('')+'</tr>';
  };
  const hdrs=cols.map((c,i)=>{const r=i>=(showTeamDiv?5:3)?' style="text-align:right"':'';return '<th data-col="'+c+'"'+r+'>'+c+'</th>';}).join('');

// ═══════════════════════════════════════
// ENTRY HELPERS
// ═══════════════════════════════════════
// Everything above hands these rows around, so the arithmetic on them lives in
// one place. Points are recomputed rather than read: the class filter can be
// showing any subset of a player's season, and a stored total would be the
// whole of it.
function normalizeTeam(t) { return (t || '').replace(/\s+/g, ' ').trim(); }

// The short form of a team, for use inside a club's own page where repeating
// the club name in every card is noise.
function teamSuffix(t) { return t || ''; }

function entryPts(e) { return (parseInt(e.G) || 0) + (parseInt(e.A) || 0); }

function entryPtsPerGame(e) {
  var gp = parseInt(e.GP) || 0;
  return gp > 0 ? (entryPts(e) / gp).toFixed(2) : '0.00';
}

function entryGA(e) { return parseInt(e.GA) || 0; }

// Shots and save percentage exist only where the league published a goalie
// table. The scoresheet shot grids are not a fallback: barely one in seven of
// them is internally consistent, so a number derived from them would be wrong
// far more often than it was right.
function entrySavePct(e) { return e['Save%'] || ''; }
function entrySavePctVal(e) { return parseFloat(e['Save%']) || 0; }
function entryShots(e) { return e.Shots != null ? e.Shots : ''; }

// GAA is the league's published figure where there is one, and goals against
// per game otherwise -- the same number whenever a goalie went the distance,
// marked so it is never mistaken for the official one.
function entryGAA(e) { return parseFloat(e.GAA) || 0; }
function entryGAADisplay(e) {
  var v = entryGAA(e).toFixed(2);
  return e.derivedGAA
    ? '<span class="derived" title="Goals against per game, from scoresheets. The league published no goalie table for this season.">' + v + '</span>'
    : v;
}


// ═══════════════════════════════════════
// VIEW 2: Club View
// ═══════════════════════════════════════
// Teams are grouped by their key, never by their name. In the older seasons
// the site gives every one of a club's teams the same name -- 18 different
// Anaheim Jr Ducks squads are all called "Anaheim Jr Ducks" in 2021 -- so
// grouping by name would fuse a whole club into a single card.
let clubSkaterSort = { col: 'PTS', dir: -1 };
let clubGoalieSort = { col: 'GAA', dir: 1 };

function initClub() {
  refreshClubOptions();
  const sSel = document.getElementById('sel-club-season');
  sSel.innerHTML = '<option value="">— all seasons —</option>';
  SEASONS.forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = SEASON_LABELS[s];
    sSel.appendChild(o);
  });
}

function refreshClubOptions() {
  const sel = document.getElementById('sel-club');
  if (!sel) return;
  const prev = sel.value;
  const present = {};
  ALL_ENTRIES.forEach(e => { if (e.club) present[e.club] = true; });
  const clubs = Object.keys(present).filter(isBrowsableClub)
    .sort((a, b) => clubDisplayName(a).localeCompare(clubDisplayName(b)));
  sel.innerHTML = '<option value="">— select —</option>';
  clubs.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = clubDisplayName(c);
    sel.appendChild(o);
  });
  if (prev && present[prev]) sel.value = prev;
}

function onClubChange() { renderClub(); }
function onClubSeasonChange() { renderClub(); }

// The teams a club iced in a season, as {key, team, entries}.
function clubTeams(club, season) {
  const byKey = {};
  ALL_ENTRIES.forEach(e => {
    if (e.club !== club) return;
    if (season && e.season !== season) return;
    if (!byKey[e.teamKey]) {
      byKey[e.teamKey] = {
        key: e.teamKey, season: e.season, teamId: e.teamId,
        name: e.team, short: e.teamShort, division: e.division,
        leagueId: e.leagueId, entries: []
      };
    }
    byKey[e.teamKey].entries.push(e);
  });
  return Object.keys(byKey).map(k => byKey[k])
    .sort((a, b) => a.division.localeCompare(b.division) || a.short.localeCompare(b.short));
}

function renderClub() {
  const club = document.getElementById('sel-club').value;
  const season = parseInt(document.getElementById('sel-club-season').value);
  const content = document.getElementById('club-content');

  if (!club) {
    content.innerHTML = '<div class="empty"><div class="icon">🏒</div>Select a club above to begin.</div>';
    return;
  }
  if (!season) { renderClubOverview(club, content); return; }

  const teams = clubTeams(club, season);
  if (!teams.length) {
    content.innerHTML = `<div class="empty"><div class="icon">📭</div>${escHtml(clubDisplayName(club))} had no recorded teams in ${SEASON_LABELS[season]}.</div>`;
    return;
  }
  renderClubSeason(club, season, teams, content);
}

function renderClubOverview(club, content) {
  const rows = SEASONS.map(s => {
    const teams = clubTeams(club, s);
    const players = new Set();
    teams.forEach(t => t.entries.forEach(e => players.add(e.playerId)));
    return { season: s, teams, playerCount: players.size };
  }).filter(r => r.teams.length);

  const tableRows = rows.map(r => `<tr>
    <td><span class="season-badge" style="cursor:pointer" onclick="setClubSeason(${r.season})">${SEASON_LABELS[r.season]}</span></td>
    <td class="num">${r.teams.length}</td>
    <td class="num">${r.playerCount}</td>
    <td>${r.teams.map(t => `<span class="team-pill" onclick="setClubSeasonTeam(${r.season},'${escAttr(t.key)}')">${escHtml(t.short)}</span>`).join(' ')}</td>
  </tr>`).join('');

  content.innerHTML = `
    <div class="section-heading" style="margin-bottom:20px">
      <h2>${escHtml(clubDisplayName(club))}</h2>
      <span class="badge">${rows.length} season${rows.length !== 1 ? 's' : ''} · all-time</span>
    </div>
    <div class="panel">
      <div class="panel-title">Season-by-Season Summary</div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Season</th>
            <th style="text-align:right">Teams</th>
            <th style="text-align:right">Players</th>
            <th>Rosters</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderClubSeason(club, season, teams, content) {
  const skaters = [];
  teams.forEach(t => t.entries.forEach(e => { if (e.type === 'skater') skaters.push(e); }));
  const players = new Set();
  teams.forEach(t => t.entries.forEach(e => players.add(e.playerId)));

  const teamCards = teams.map(t => {
    const tPlayers = new Set(t.entries.map(e => e.playerId));
    const league = APP.leagueById[t.leagueId];
    return `<div class="club-team-card" data-team-key="${escHtml(t.key)}" onclick="goToTeam('${escAttr(t.key)}')">
      <div class="ctc-name">${escHtml(t.short)}</div>
      <div class="ctc-div"><span class="div-badge">${escHtml(t.division)}</span>${league ? ` <span class="div-badge">${escHtml(league.name)}</span>` : ''}</div>
      <div class="ctc-stats">
        <span class="ctc-stat"><strong>${tPlayers.size}</strong><small>Players</small></span>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="section-heading" style="margin-bottom:8px">
      <h2>${escHtml(clubDisplayName(club))}</h2>
      <span class="badge">${SEASON_LABELS[season]}</span>
    </div>
    <div class="club-totals-bar">
      <div class="ctb-item"><span class="ctb-val">${teams.length}</span><span class="ctb-lbl">Teams</span></div>
      <div class="ctb-item"><span class="ctb-val">${players.size}</span><span class="ctb-lbl">Players</span></div>
      <div class="ctb-item"><span class="ctb-val">${skaters.reduce((s, e) => s + (parseInt(e.G) || 0), 0)}</span><span class="ctb-lbl">Goals</span></div>
      <div class="ctb-item"><span class="ctb-val">${skaters.reduce((s, e) => s + (parseInt(e.A) || 0), 0)}</span><span class="ctb-lbl">Assists</span></div>
      <div class="ctb-item" style="color:var(--accent2)"><span class="ctb-val">${skaters.reduce((s, e) => s + entryPts(e), 0)}</span><span class="ctb-lbl">Points</span></div>
    </div>
    <div class="club-team-grid" id="club-team-grid">
      ${teamCards}
    </div>
    <div id="club-roster-panel"></div>
  `;
}

function showTeamRoster(key) {
  const panel = document.getElementById('club-roster-panel');
  if (!panel) return;

  const roster = ALL_ENTRIES.filter(e => e.teamKey === key);
  let skaters = roster.filter(e => e.type === 'skater');
  let goalies = roster.filter(e => e.type === 'goalie');
  const first = roster[0];
  const title = first ? first.teamShort : key;

  clubSkaterSort = { col: 'PTS', dir: -1 };
  clubGoalieSort = { col: 'GAA', dir: 1 };
  skaters.sort((a, b) => entryPts(b) - entryPts(a));
  goalies.sort((a, b) => entryGAA(a) - entryGAA(b));

  function makeSkaterRow(e, i) {
    return `<tr>
      <td class="num">${i + 1}</td>
      <td class="player-link" onclick="goToPlayer(${e.playerId})">${escHtml(e.playerName)}${byLabel(e.playerId)}</td>
      <td class="jersey">${escHtml(e.jersey)}</td>
      <td class="num">${e.GP || 0}</td>
      <td class="num">${e.G || 0}</td>
      <td class="num">${e.A || 0}</td>
      <td class="num pts">${entryPts(e)}</td>
      <td class="num">${e.PIM || 0}</td>
      <td class="num">${e.PPG || 0}</td>

  }

  function makeGoalieRow(e, i) {
    return `<tr>
      <td class="num">${i + 1}</td>

      <td class="jersey">${escHtml(e.jersey)}</td>
      <td class="num">${e.GP || 0}</td>
      <td class="num">${entryShots(e)}</td>
      <td class="num">${entryGA(e)}</td>
      <td class="num">${entryGAADisplay(e)}</td>

  panel.innerHTML = `
    <div class="panel" style="margin-top:20px">
      <div class="panel-title">${escHtml(title)} · Roster</div>
      ${(skaters.length || goalies.length) ? `
      <div class="table-wrap">

          ${skaters.length ? `

            <th data-col="G" style="text-align:right">G</th>
            <th data-col="A" style="text-align:right">A</th>
            <th data-col="PTS" style="text-align:right">PTS</th>
            <th data-col="PIM" style="text-align:right">PIM</th>
            <th data-col="PPG" style="text-align:right">PPG</th>
            <th data-col="Pts/GP" style="text-align:right">Pts/GP</th>
          </tr></thead>
          <tbody id="club-skater-tbody">${skaters.map(makeSkaterRow).join('')}</tbody>` : ''}
          ${goalies.length ? `
          <tbody>
            ${skaters.length ? `<tr class="ph-section-divider"><td colspan="10"></td></tr>` : ''}
            <tr class="ph-goalie-subhdr">
              <td data-gcol="Rk">Rk</td>
              <td data-gcol="Goalie">Goalie</td>
              <td data-gcol="#">#</td>
              <td data-gcol="GP">GP</td>
              <td data-gcol="Shots">Shots</td>
              <td data-gcol="GA">GA</td>
              <td data-gcol="GAA">GAA</td>
              <td data-gcol="Save%">Save%</td>
              <td data-gcol="SO">SO</td>
              <td></td>
            </tr>
          </tbody>
          <tbody id="club-goalie-tbody">${goalies.map(makeGoalieRow).join('')}</tbody>` : ''}

  const table = document.getElementById('club-roster-table');
  if (table) {
    const skaterTbody = document.getElementById('club-skater-tbody');
    table.querySelectorAll('thead th[data-col]').forEach(th => {
      th.addEventListener('click', () => {

        else { clubSkaterSort.col = col; clubSkaterSort.dir = (col === 'Player' || col === '#') ? 1 : -1; }
        skaters.sort((a, b) => {

          else { va = parseInt(a[col]) || 0; vb = parseInt(b[col]) || 0; }

        goalies.sort((a, b) => {
          let va, vb;

          else if (col === '#') { va = parseInt(a.jersey) || 0; vb = parseInt(b.jersey) || 0; }

          else if (col === 'Save%') { va = entrySavePctVal(a); vb = entrySavePctVal(b); }
          else if (col === 'Shots') { va = parseInt(a.Shots) || 0; vb = parseInt(b.Shots) || 0; }
          else if (col === 'GA') { va = entryGA(a); vb = entryGA(b); }
          else if (col === 'Rk') { va = entryGAA(a); vb = entryGAA(b); clubGoalieSort.dir = 1; }
          else { va = parseInt(a[col]) || 0; vb = parseInt(b[col]) || 0; }
          if (typeof va === 'string') return clubGoalieSort.dir * va.localeCompare(vb);
          return clubGoalieSort.dir * (va - vb);
        });
        if (goalieTbody) goalieTbody.innerHTML = goalies.map(makeGoalieRow).join('');

// Players are addressed by id, never by name: a quarter of them share a
// display name with somebody else, so a name is a search term, not a handle.
var CURRENT_PLAYER_ID = null;
let acFocusIdx = -1;

function playerSearchIndex() {
  if (!APP._searchIndex) {
    APP._searchIndex = APP.players.map(function(p) {
      var names = [p.name].concat(p.aliases || []);
      return { id: p.id, name: p.name, hay: names.join(' ').toLowerCase() };
    }).sort(function(a, b) { return a.name.localeCompare(b.name); });
  }
  return APP._searchIndex;
}

// The last team a player appears on, which is what tells two people with the
// same name apart in a list of search results.
function lastSeenFor(playerId) {
  var best = null;
  ALL_ENTRIES.forEach(function(e) {
    if (e.playerId !== playerId) return;
    if (!best || e.season > best.season || (e.season === best.season && e.GP > best.GP)) best = e;
  });
  return best;
}

function onPlayerSearch() {
  const q = document.getElementById('player-search').value.trim().toLowerCase();
  const list = document.getElementById('ac-list');
  acFocusIdx = -1;
  if (!q) { list.style.display = 'none'; return; }
  const matches = playerSearchIndex().filter(p => p.hay.indexOf(q) !== -1).slice(0, 30);
  if (!matches.length) { list.style.display = 'none'; return; }
  list.innerHTML = matches.map(function(m) {
    const player = APP.playerById[m.id];
    const seasons = [...new Set(player.seasons.map(s => s.season))].sort();
    const last = lastSeenFor(m.id);
    const sub = (seasons.length ? seasons.map(s => SEASON_LABELS[s]).join(', ') : 'no games counted')
      + (last ? ' · ' + last.team : '');
    return '<div class="autocomplete-item" onclick="selectPlayer(' + m.id + ')"><span>'
      + escHtml(m.name) + bornLabel(m.id) + '</span><span class="ac-sub">' + escHtml(sub) + '</span></div>';
  }).join('');
  list.style.display = 'block';
}

function onSearchKey(e) {
  const list = document.getElementById('ac-list');
  const items = list.querySelectorAll('.autocomplete-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') { acFocusIdx = Math.min(acFocusIdx + 1, items.length - 1); items.forEach((el, i) => el.classList.toggle('focused', i === acFocusIdx)); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { acFocusIdx = Math.max(acFocusIdx - 1, 0); items.forEach((el, i) => el.classList.toggle('focused', i === acFocusIdx)); e.preventDefault(); }
  else if (e.key === 'Enter' && acFocusIdx >= 0) items[acFocusIdx].click();
  else if (e.key === 'Escape') list.style.display = 'none';
}
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) document.getElementById('ac-list').style.display = 'none'; });

  CURRENT_PLAYER_ID = playerId;

  const entries = ALL_ENTRIES.filter(e => e.playerId === playerId);

    content.innerHTML = '<div class="player-history-header"><h2>' + escHtml(player.name) + bornLabel(playerId)
      + '</h2></div><div class="empty"><div class="icon">📭</div>No games match the current filters.</div>';

  const isGoalie = goalieEntries.length > 0;

  const totalGP = sum(skaterEntries, e => parseInt(e.GP));

  const totalA = sum(skaterEntries, e => parseInt(e.A));

  const totalSHG = sum(skaterEntries, e => parseInt(e.SHG));

      + '<div class="stat-card"><div class="stat-val">' + totalA + '</div><div class="stat-lbl">Assists</div></div>'
      + '<div class="stat-card"><div class="stat-val" style="color:var(--accent2)">' + totalPts + '</div><div class="stat-lbl">Points</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + totalPIM + '</div><div class="stat-lbl">PIM</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + totalPPG + '</div><div class="stat-lbl">PP Goals</div></div>'
      + (totalSHG ? '<div class="stat-card"><div class="stat-val">' + totalSHG + '</div><div class="stat-lbl">SH Goals</div></div>' : '')
      + (isTwoWay ? '<div class="stat-card"><div class="stat-val">' + goalieGP + '</div><div class="stat-lbl">Goalie GP</div></div>'
        + '<div class="stat-card"><div class="stat-val">' + goalieGA + '</div><div class="stat-lbl">Goals Allowed</div></div>' : '')

    + '<td>' + teamLink(e) + '</td>'

  const CG = '<colgroup>'

    } else if (skaters.length) {
      body = '<div class="table-wrap"><table class="ph-table">' + CG

// ── Game log ──────────────────────────────────────────────────────────────
// One fetch of the player's shard covers every season, so the log is drawn for
// all of them at once rather than a request per section.
function renderGameLogs(playerId, seasons) {
  seasons.forEach(function(s) {
    var host = document.getElementById('gamelog-' + s);
    if (host) host.innerHTML = '<div class="log-loading">Loading game log…</div>';
  });

  loadPlayerLog(playerId).then(function(lines) {
    var classes = classFilter();
    var league = FILTERS.league ? parseInt(FILTERS.league) : null;
    var kept = lines.filter(function(l) {
      if (classes && !classes[l['class']]) return false;
      if (league && l.league !== league) return false;
      return true;
    });

    seasons.forEach(function(s) {
      var host = document.getElementById('gamelog-' + s);
      if (!host) return;
      var games = kept.filter(function(l) { return l.season === s; })
        .sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
      if (!games.length) { host.innerHTML = ''; return; }
      host.innerHTML = renderGameLogTable(s, games);
    });
  }).catch(function(err) {
    seasons.forEach(function(s) {
      var host = document.getElementById('gamelog-' + s);
      if (host) host.innerHTML = '<div class="log-loading">Game log unavailable (' + escHtml(err.message) + ')</div>';
    });
  });
}

function renderGameLogTable(season, games) {
  var anyGoalie = games.some(function(g) { return g.goalie; });
  var rows = games.map(function(g) {
    var opp = teamFor(g.season, g.opp);
    var oppName = opp ? teamName(opp) : 'Unknown';
    var result = g['for'] > g.against ? 'W' : (g['for'] < g.against ? 'L' : 'T');
    var cls = result === 'W' ? 'res-w' : result === 'L' ? 'res-l' : 'res-t';
    var mark = [];
    if (g.ppg) mark.push('<span class="strength-tag" title="Power play goals">PP' + (g.ppg > 1 ? '×' + g.ppg : '') + '</span>');
    if (g.shg) mark.push('<span class="strength-tag" title="Short-handed goals">SH' + (g.shg > 1 ? '×' + g.shg : '') + '</span>');
    return '<tr class="game-link" onclick="openBoxScore(' + g.season + ',\'' + g.game + '\')">'
      + '<td class="log-date">' + escHtml(formatGameDate(g.date)) + '</td>'
      + '<td>' + (g.home ? '<span class="log-vs">vs</span> ' : '<span class="log-vs">@</span> ')
      + '<span class="team-link" onclick="event.stopPropagation();goToTeam(\''
      + escAttr(teamKey(g.season, g.opp)) + '\')">' + escHtml(oppName) + '</span></td>'
      + '<td class="log-class">' + escHtml(gameClassLabel(g['class'])) + '</td>'
      + '<td class="num"><span class="' + cls + '">' + result + '</span> ' + g['for'] + '–' + g.against + '</td>'
      + (g.goalie
        ? '<td class="num">—</td><td class="num">—</td><td class="num">—</td>'
        : '<td class="num">' + (g.g || 0) + '</td><td class="num">' + (g.a || 0) + '</td><td class="num pts">' + (g.pts || 0) + '</td>')
      + '<td class="num">' + (g.pim || 0) + '</td>'
      + (anyGoalie ? '<td class="num">' + (g.goalie ? (g.ga != null ? g.ga : '') : '') + '</td>' : '')
      + '<td>' + mark.join(' ') + '</td>'
      + '</tr>';
  }).join('');

  return '<details class="log-details"><summary>' + games.length + ' game'
    + (games.length !== 1 ? 's' : '') + ' · game log</summary>'
    + '<div class="table-wrap"><table class="log-table"><thead><tr>'
    + '<th>Date</th><th>Opponent</th><th>Type</th><th style="text-align:right">Result</th>'
    + '<th style="text-align:right">G</th><th style="text-align:right">A</th><th style="text-align:right">PTS</th>'
    + '<th style="text-align:right">PIM</th>'
    + (anyGoalie ? '<th style="text-align:right">GA</th>' : '')
    + '<th></th></tr></thead><tbody>' + rows + '</tbody></table></div></details>';
}

function formatGameDate(iso) {
  if (!iso) return '';
  var parts = iso.split('-');
  if (parts.length !== 3) return iso;
  return parts[1] + '/' + parts[2] + '/' + parts[0].slice(2);
}

function gameClassLabel(c) {
  return { regular: 'Regular', playoff: 'Playoff', preseason: 'Preseason',
           exhibition: 'Exhibition', other: '—' }[c] || c || '—';
}


// ── Utils ──
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}



// ── Birth year labels ─────────────────────────────────────────────────────
// 2,592 players share a display name with somebody else, so the birth year is
// not decoration -- it is how you tell two children apart. Only a third have
// an exact year; the rest are narrowed to a range, which is too wide for a
// dense table but is exactly what you want when picking a name out of a list.
function byLabel(playerId) {
  var p = APP.playerById[playerId];
  if (!p || !p.born) return '';
  return '<span class="birth-yr">\'' + String(p.born).slice(2) + '</span>';
}

function bornLabel(playerId) {
  var p = APP.playerById[playerId];
  if (!p) return '';
  if (p.born) return '<span class="birth-yr">\'' + String(p.born).slice(2) + '</span>';
  if (p.bornRange) {
    return '<span class="birth-yr" title="Birth year narrowed to a range, not confirmed">\''
      + String(p.bornRange[0]).slice(2) + '–\'' + String(p.bornRange[1]).slice(2) + '</span>';
  }
  return '';
}

// ── Filters ───────────────────────────────────────────────────────────────
function initFilters() {
  var leagueSel = document.getElementById('sel-league');
  APP.leagues.forEach(function(l) {
    var o = document.createElement('option');
    o.value = l.id; o.textContent = l.name;
    leagueSel.appendChild(o);
  });
  var classSel = document.getElementById('sel-gameclass');
  GAME_CLASS_PRESETS.forEach(function(p) {
    var o = document.createElement('option');
    o.value = p.id; o.textContent = p.label;
    if (p.id === FILTERS.gameClass) o.selected = true;
    classSel.appendChild(o);
  });
  updateFilterNote();
}

function updateFilterNote() {
  var note = document.getElementById('filter-note');
  if (!note) return;
  var skaters = 0, goalies = 0;
  ALL_ENTRIES.forEach(function(e) { if (e.type === 'goalie') goalies++; else skaters++; });
  note.textContent = skaters.toLocaleString() + ' skater and ' + goalies.toLocaleString()
    + ' goalie seasons counted';
}

// Rebuilding the entries changes what every view is looking at, so the one
// that is on screen has to be drawn again -- and the dropdowns inside it
// repopulated, since a league filter can remove clubs and divisions entirely.
function onFilterChange() {
  FILTERS.league = document.getElementById('sel-league').value;
  FILTERS.gameClass = document.getElementById('sel-gameclass').value;
  buildEntries();
  updateFilterNote();
  refreshClubOptions();

  var active = ['browse', 'club', 'player', 'migration'].filter(function(v) {
    return document.getElementById('view-' + v).classList.contains('active');
  })[0] || 'browse';
  if (active === 'browse') onSeasonChange();
  else if (active === 'club') renderClub();
  else if (active === 'migration') renderMigration();
  else if (active === 'player') {
    if (CURRENT_PLAYER_ID) renderPlayerHistory(CURRENT_PLAYER_ID);
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────
function boot() {
  var status = document.getElementById('load-status');
  status.style.display = 'inline';
  status.textContent = '⏳ Loading…';

  loadJSON('core.json').then(function(core) {
    indexCore(core);
    buildEntries();
    initFilters();
    initBrowse();
    initClub();
    initMigration();
    status.textContent = '✓ ' + core.metadata.counts.players.toLocaleString() + ' players · '
      + SEASONS.length + ' seasons · ' + core.metadata.counts.teams.toLocaleString() + ' teams';
    history.replaceState(captureAppState(), '');
    document.documentElement.style.setProperty(
      '--header-h', document.querySelector('header').offsetHeight + 'px');
  }).catch(function(err) {
    status.textContent = '✗ ' + err.message;
    document.getElementById('browse-content').innerHTML =
      '<div class="empty"><div class="icon">⚠️</div>Could not load the dataset from <code>'
      + escHtml(APP.base || APP_DATA_SOURCES.join(' or ')) + '</code>.'
      + '<div style="margin-top:8px;font-size:.85rem">'
      + escHtml(err.message) + '</div></div>';
  });
}

boot();

  document.getElementById('view-team').classList.add('active');
  history.pushState({ view: 'team', teamKey: key }, '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderTeam(key);
}

// Every game a team appears in that season, oldest first.
function teamGames(season, teamId, games) {
  var out = [];
  Object.keys(games).forEach(function(id) {
    var g = games[id];
    if (g.home !== teamId && g.away !== teamId) return;
    var home = g.home === teamId;
    var played = g.hg != null && g.ag != null;
    out.push({
      id: id, game: g, home: home, played: played,
      opp: home ? g.away : g.home,
      oppName: home ? g.awayName : g.homeName,
      gf: played ? (home ? g.hg : g.ag) : null,
      ga: played ? (home ? g.ag : g.hg) : null
    });
  });
  return out.sort(function(a, b) { return (a.game.date || '').localeCompare(b.game.date || ''); });
}

function resultOf(row) {
  if (!row.played) return null;
  return row.gf > row.ga ? 'W' : (row.gf < row.ga ? 'L' : 'T');
}

function renderTeam(key) {
  var host = document.getElementById('team-content');
  var team = APP.teamByKey[key];
  if (!team) { host.innerHTML = '<div class="empty"><div class="icon">❌</div>Team not found.</div>'; return; }

  var div = APP.divisionById[team.division];
  var league = APP.leagueById[team.league];
  var standing = APP.standingsByKey[key];
  var roster = ALL_ENTRIES.filter(function(e) { return e.teamKey === key; });

  var record = '';
  if (standing && standing.gp) {
    var parts = [standing.w, standing.l];
    var labels = 'W-L';
    if (standing.t) { parts.push(standing.t); labels += '-T'; }
    if (standing.otl) { parts.push(standing.otl); labels += '-OTL'; }
    // The league's own table, which counts the regular season only. The
    // schedule below counts everything, so the two game counts differ and the
    // label has to say which is which.
    record = '<div class="panel-title" style="margin-bottom:8px">League standings · regular season</div>'
      + '<div class="club-totals-bar">'
      + '<div class="ctb-item"><span class="ctb-val">' + parts.join('-') + '</span><span class="ctb-lbl">' + labels + '</span></div>'
      + '<div class="ctb-item"><span class="ctb-val">' + standing.gp + '</span><span class="ctb-lbl">Games</span></div>'
      + '<div class="ctb-item" style="color:var(--accent2)"><span class="ctb-val">' + standing.pts + '</span><span class="ctb-lbl">Points</span></div>'
      + '<div class="ctb-item"><span class="ctb-val">' + standing.gf + '</span><span class="ctb-lbl">Goals For</span></div>'
      + '<div class="ctb-item"><span class="ctb-val">' + standing.ga + '</span><span class="ctb-lbl">Goals Against</span></div>'
      + '</div>';
  }

  host.innerHTML =
    '<div class="team-head"><h2>' + escHtml(teamName(team)) + '</h2>'
    + '<span class="season-badge">' + SEASON_LABELS[team.season] + '</span>'
    + (div ? '<span class="div-badge">' + escHtml(div.name) + '</span>' : '')
    + (league ? '<span class="div-badge">' + escHtml(league.name) + '</span>' : '')
    + '</div>'
    + '<div class="team-sub">'
    + '<span class="team-link" onclick="goToClub(\'' + escAttr(team.club) + '\',' + team.season + ')">'
    + escHtml(clubDisplayName(team.club)) + '</span>'
    + (standing && standing.gp ? '' : ' · no standings published')
    + '</div>'
    + record
    + '<div id="team-schedule"><div class="log-loading">Loading games…</div></div>'
    + '<div id="team-periods"></div>'
    + '<div id="team-roster"></div>';

  renderTeamRoster(roster);

  loadSeasonGames(team.season).then(function(games) {
    var rows = teamGames(team.season, team.id, games);
    renderTeamSchedule(rows, team);
    renderTeamPeriods(rows, team);
  }).catch(function(err) {
    document.getElementById('team-schedule').innerHTML =
      '<div class="log-loading">Games unavailable (' + escHtml(err.message) + ')</div>';
  });
}

function renderTeamSchedule(rows, team) {
  var host = document.getElementById('team-schedule');
  if (!rows.length) {
    host.innerHTML = '<div class="panel"><div class="panel-title">Schedule</div>'
      + '<p style="color:var(--muted);padding:4px 2px">No games recorded for this team.</p></div>';
    return;
  }
  var played = rows.filter(function(r) { return r.played; });
  var wins = played.filter(function(r) { return resultOf(r) === 'W'; }).length;
  var losses = played.filter(function(r) { return resultOf(r) === 'L'; }).length;
  var ties = played.length - wins - losses;

  var body = rows.map(function(r) {
    var res = resultOf(r);
    var cls = res === 'W' ? 'res-w' : res === 'L' ? 'res-l' : 'res-t';
    var opp = APP.teamByKey[teamKey(team.season, r.opp)];
    return '<tr class="game-link" onclick="openBoxScore(' + team.season + ',\'' + r.id + '\')">'
      + '<td class="log-date">' + escHtml(formatGameDate(r.game.date)) + '</td>'
      + '<td>' + (r.home ? '<span class="log-vs">vs</span> ' : '<span class="log-vs">@</span> ')
      + escHtml(opp ? teamName(opp) : (r.oppName || 'Unknown')) + '</td>'
      + '<td class="log-class">' + escHtml(gameClassLabel(r.game['class'])) + '</td>'
      + '<td class="num">' + (r.played
          ? '<span class="' + cls + '">' + res + '</span> ' + r.gf + '–' + r.ga
          : '<span class="sched">' + escHtml(r.game.time || 'scheduled') + '</span>') + '</td>'
      + '<td class="log-class">' + escHtml(r.game.rink || '') + '</td>'
      + '</tr>';
  }).join('');

  host.innerHTML = '<div class="panel"><div class="section-heading" style="margin-bottom:12px">'
    + '<h2 style="font-size:1rem">Schedule &amp; Results</h2>'
    + '<span class="badge">' + played.length + ' played'
    + (played.length ? ' · ' + wins + '-' + losses + (ties ? '-' + ties : '') : '')
    + (rows.length > played.length ? ' · ' + (rows.length - played.length) + ' upcoming' : '')
    + '</span></div>'
    + '<div class="table-wrap"><table><thead><tr>'
    + '<th>Date</th><th>Opponent</th><th>Type</th>'
    + '<th style="text-align:right">Result</th><th>Rink</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

// ── Scoring by period ─────────────────────────────────────────────────────
// Period scores are recorded for every game, so this is one of the few things
// in the app with no coverage caveat attached.
function renderTeamPeriods(rows, team) {
  var host = document.getElementById('team-periods');
  var forBy = {}, againstBy = {}, periods = {};
  var counted = 0;
  rows.forEach(function(r) {
    var p = r.game.periods;
    if (!r.played || !p) return;
    var mine = p[r.home ? 'home' : 'away'] || {};
    var theirs = p[r.home ? 'away' : 'home'] || {};
    var any = false;
    Object.keys(mine).forEach(function(k) { forBy[k] = (forBy[k] || 0) + mine[k]; periods[k] = true; any = true; });
    Object.keys(theirs).forEach(function(k) { againstBy[k] = (againstBy[k] || 0) + theirs[k]; periods[k] = true; any = true; });
    if (any) counted++;
  });

  var keys = Object.keys(periods).sort(function(a, b) {
    var na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });
  if (!keys.length) { host.innerHTML = ''; return; }

  var cells = keys.map(function(k) {
    var f = forBy[k] || 0, a = againstBy[k] || 0;
    var diff = f - a;
    var colour = diff > 0 ? 'var(--green)' : (diff < 0 ? 'var(--red,#e5484d)' : 'var(--text)');
    return '<div class="period-cell">'
      + '<div class="pc-lbl">' + escHtml(periodLabel(k)) + '</div>'
      + '<div class="pc-val" style="color:' + colour + '">' + (diff > 0 ? '+' : '') + diff + '</div>'
      + '<div class="pc-split">' + f + ' for · ' + a + ' against</div>'
      + '</div>';
  }).join('');

  host.innerHTML = '<div class="panel"><div class="section-heading" style="margin-bottom:12px">'
    + '<h2 style="font-size:1rem">Scoring by Period</h2>'
    + '<span class="badge">' + counted + ' game' + (counted !== 1 ? 's' : '') + '</span></div>'
    + '<div class="period-grid">' + cells + '</div></div>';
}

function periodLabel(p) {
  return { '1': '1st', '2': '2nd', '3': '3rd', '4': 'OT', 'OT': 'OT', 'SO': 'SO' }[String(p)] || String(p);
}

function renderTeamRoster(roster) {

      + '<td class="num">' + (e.PIM || 0) + '</td><td class="num">' + (e.PPG || 0) + '</td>'
      + '<td class="num">' + (e.SHG || 0) + '</td>'

    return '<tr><td class="num">' + (i + 1) + '</td>'

      + escHtml(e.playerName) + byLabel(e.playerId) + '</td>'
      + '<td class="jersey">' + escHtml(e.jersey) + '</td>'
      + '<td class="num">' + (e.GP || 0) + '</td>'
      + '<td class="num">' + entryShots(e) + '</td><td class="num">' + entryGA(e) + '</td>'
      + '<td class="num">' + entryGAADisplay(e) + '</td>'
      + '<td class="num" style="color:var(--green)">' + (entrySavePct(e) || '—') + '</td>'
      + '<td class="num">' + (e.SO != null ? e.SO : '') + '</td></tr>';
  }).join('');

  host.innerHTML = '<div class="panel"><div class="panel-title">Roster</div>'
    + (skaters.length ? '<div class="table-wrap"><table><thead><tr>'
        + '<th style="text-align:right">Rk</th><th>Player</th><th>#</th>'
        + '<th style="text-align:right">GP</th><th style="text-align:right">G</th>'
        + '<th style="text-align:right">A</th><th style="text-align:right">PTS</th>'
        + '<th style="text-align:right">PIM</th><th style="text-align:right">PPG</th>'
        + '<th style="text-align:right">SHG</th><th style="text-align:right">Pts/GP</th>'
        + '</tr></thead><tbody>' + skaterRows + '</tbody></table></div>' : '')
    + (goalies.length ? '<div class="panel-title" style="margin-top:18px">Goaltending</div>'
        + '<div class="table-wrap"><table><thead><tr>'
        + '<th style="text-align:right">Rk</th><th>Goalie</th><th>#</th>'
        + '<th style="text-align:right">GP</th><th style="text-align:right">Shots</th>'
        + '<th style="text-align:right">GA</th><th style="text-align:right">GAA</th>'
        + '<th style="text-align:right">Save%</th><th style="text-align:right">SO</th>'

    + '</div>';
}

function goToClub(club, season) {
  document.querySelectorAll('.view').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('view-club').classList.add('active');
  document.querySelectorAll('.tab-btn')[1].classList.add('active');
  refreshClubOptions();
  document.getElementById('sel-club').value = club;
  document.getElementById('sel-club-season').value = season || '';
  renderClub();
  history.pushState({ view: 'club', clubName: club, clubSeason: String(season || '') }, '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
