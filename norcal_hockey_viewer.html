      + '<div class="game-log" id="gamelog-' + s + '"></div></div>';
  }).join('');

  content.innerHTML = '<div class="player-history-header"><h2>' + escHtml(player.name) + bornLabel(playerId) + '</h2>'
    + (isTwoWay ? '<span class="div-badge">⛸ + 🥅 Two-Way</span>' : isGoalie ? '<span class="div-badge">🥅 Goalie</span>' : '')
    + '</div>' + aliasNote + teamBoxes(groups) + summaryCards
    + playerCurvePanel(skaterEntries, goalieEntries) + seasonSections
    + classNote
    + '<div id="linemates"></div>';

  // Which team-seasons survived the boxes, so the log and the linemates panel
  // count the same games the tables above them do.
  const playing = {};
  entries.forEach(e => { playing[e.season + '|' + e.teamId] = true; });
  renderGameLogs(playerId, seasons, playing);
  renderLinemates(playerId, seasons, playing);
}

// ── Development curve (#12) ─────────────────────────────────────────────────
// A player's scoring rate season by season -- the trajectory the season table
// carries but never draws. Skaters get points per game; a keeper with no skater
// seasons gets goals-against per game instead. Needs at least two seasons with
// games, since one point is not a line.
function playerCurvePanel(skaterEntries, goalieEntries) {
  var useSk = skaterEntries.length > 0;
  var src = useSk ? skaterEntries : goalieEntries;
  if (!src.length) return '';
  var bySeason = {};
  src.forEach(function(e) {
    var b = bySeason[e.season] || (bySeason[e.season] = { gp: 0, pts: 0, ga: 0, teams: [] });
    b.gp += parseInt(e.GP) || 0;
    b.pts += entryPts(e);
    b.ga += entryGA(e);
    if (e.team && b.teams.indexOf(e.team) === -1) b.teams.push(e.team);
  });
  var points = Object.keys(bySeason).map(Number).sort(function(a, b) { return a - b; })
    .filter(function(s) { return bySeason[s].gp > 0; })
    .map(function(s) {
      var b = bySeason[s];
      return { label: SEASON_LABELS[s], gp: b.gp, value: useSk ? b.pts / b.gp : b.ga / b.gp,
               teams: b.teams.join(', ') };
    });
  if (points.length < 2) return '';
  var title = useSk ? 'Points per game' : 'Goals against per game';
  var lede = useSk
    ? 'How this skater\'s scoring rate has moved season to season.'
    : 'Goals allowed per game, season to season &mdash; lower is better.';
  return '<div class="panel"><div class="panel-title">Development &middot; ' + title + '</div>'
    + '<div class="devcurve-wrap">' + devCurveSvg(points) + '</div>'
    + '<p class="dr-lede" style="margin:10px 0 0">' + lede + '</p></div>';
}

function devCurveSvg(points) {
  var W = 600, H = 220, padL = 40, padR = 18, padT = 24, padB = 34;
  var plotW = W - padL - padR, plotH = H - padT - padB;
  var maxV = Math.max.apply(null, points.map(function(p) { return p.value; }));
  var niceMax = Math.max(0.5, Math.ceil(maxV / 0.5) * 0.5);
  var n = points.length;
  function X(i) { return padL + (n === 1 ? plotW / 2 : plotW * i / (n - 1)); }
  function Y(v) { return padT + plotH * (1 - v / niceMax); }
  var grid = '';
  [0, niceMax / 2, niceMax].forEach(function(t) {
    var y = Y(t);
    grid += '<line class="dc-grid" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"/>'
      + '<text class="dc-axis" x="' + (padL - 7) + '" y="' + (y + 3.5).toFixed(1) + '" text-anchor="end">' + t.toFixed(1) + '</text>';
  });
  var line = points.map(function(p, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.value).toFixed(1); }).join(' ');
  var marks = points.map(function(p, i) {
    var x = X(i).toFixed(1), y = Y(p.value);
    var tip = escHtml(p.label) + ': ' + p.value.toFixed(2) + ' (' + p.gp + ' GP)'
      + (p.teams ? '\n' + escHtml(p.teams) : '');
    return '<circle class="dc-dot" cx="' + x + '" cy="' + y.toFixed(1) + '" r="4"/>'
      + '<text class="dc-val" x="' + x + '" y="' + (y - 10).toFixed(1) + '" text-anchor="middle">' + p.value.toFixed(2) + '</text>'
      + '<text class="dc-x" x="' + x + '" y="' + (H - padB + 18) + '" text-anchor="middle">' + escHtml(p.label) + '</text>'
      // A wide, invisible hit target over the dot so the tooltip is not a game
      // of finding an 8px circle. Drawn last so it sits above the line and text.
      + '<circle class="dc-hit" cx="' + x + '" cy="' + y.toFixed(1) + '" r="20"><title>' + tip + '</title></circle>';
  }).join('');
  return '<svg class="devcurve" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Development curve">'
    + grid + '<path class="dc-line" d="' + line + '" fill="none"/>' + marks + '</svg>';
}

// ── Game log ──────────────────────────────────────────────────────────────
// One fetch of the player's shard covers every season, so the log is drawn for
// all of them at once rather than a request per section.
function renderGameLogs(playerId, seasons, playing) {
  seasons.forEach(function(s) {
    var host = document.getElementById('gamelog-' + s);
    if (host) host.innerHTML = '<div class="log-loading">Loading game log…</div>';
  });

  loadPlayerLog(playerId).then(function(lines) {
    var classes = classFilter();
    var kept = lines.filter(function(l) {
      if (classes && !classes[l['class']]) return false;
      // The log line names the team it was played for, so an unticked team
      // drops out here rather than only at the season heading above it.
      if (playing && !playing[l.season + '|' + l.team]) return false;
      return true;
    });

    seasons.forEach(function(s) {
      var host = document.getElementById('gamelog-' + s);
      if (!host) return;
      var games = kept.filter(function(l) { return l.season === s; })
        .sort(function(a, b) { return (a.date || '').localeCompare(b.date || ''); });
      if (!games.length) { host.innerHTML = ''; return; }
      host.innerHTML = renderGameLogTable(s, games);
    });
  }).catch(function(err) {
    seasons.forEach(function(s) {
      var host = document.getElementById('gamelog-' + s);
      if (host) host.innerHTML = '<div class="log-loading">Game log unavailable (' + escHtml(err.message) + ')</div>';
    });
  });
}

function renderGameLogTable(season, games) {
  var anyGoalie = games.some(function(g) { return g.goalie; });
  var rows = games.map(function(g) {
    var opp = teamFor(g.season, g.opp);
    var oppName = opp ? teamName(opp) : 'Unknown';
    var result = g['for'] > g.against ? 'W' : (g['for'] < g.against ? 'L' : 'T');
    var cls = result === 'W' ? 'res-w' : result === 'L' ? 'res-l' : 'res-t';
    var mark = [];
    if (g.ppg) mark.push('<span class="strength-tag" title="Power play goals">PP' + (g.ppg > 1 ? '×' + g.ppg : '') + '</span>');
    if (g.shg) mark.push('<span class="strength-tag" title="Short-handed goals">SH' + (g.shg > 1 ? '×' + g.shg : '') + '</span>');
    return '<tr class="game-link" onclick="openBoxScore(' + g.season + ',\'' + g.game + '\')">'
      + '<td class="log-date">' + escHtml(formatGameDate(g.date)) + '</td>'
      + '<td>' + (g.home ? '<span class="log-vs">vs</span> ' : '<span class="log-vs">@</span> ')
      + '<span class="team-link" onclick="event.stopPropagation();goToTeam(\''
      + escAttr(teamKey(g.season, g.opp)) + '\')">' + escHtml(oppName) + '</span></td>'
      + '<td class="log-class">' + escHtml(gameTypeLabel(g['class'], g.stage)) + '</td>'
      + '<td class="num"><span class="' + cls + '">' + result + '</span> ' + g['for'] + '–' + g.against + '</td>'
      + (g.goalie
        ? '<td class="num">—</td><td class="num">—</td><td class="num">—</td>'
        : '<td class="num">' + (g.g || 0) + '</td><td class="num">' + (g.a || 0) + '</td><td class="num pts">' + (g.pts || 0) + '</td>')
      + '<td class="num">' + (g.pim || 0) + '</td>'
      + (anyGoalie ? '<td class="num">' + (g.goalie ? (g.ga != null ? g.ga : '') : '') + '</td>' : '')
      + '<td>' + mark.join(' ') + '</td>'
      + '</tr>';
  }).join('');

  return '<details class="log-details"><summary>' + games.length + ' game'
    + (games.length !== 1 ? 's' : '') + ' · game log</summary>'
    + '<div class="table-wrap"><table class="log-table"><thead><tr>'
    + '<th>Date</th><th>Opponent</th><th>Type</th><th style="text-align:right">Result</th>'
    + '<th style="text-align:right">G</th><th style="text-align:right">A</th><th style="text-align:right">PTS</th>'
    + '<th style="text-align:right">PIM</th>'
    + (anyGoalie ? '<th style="text-align:right">GA</th>' : '')
    + '<th></th></tr></thead><tbody>' + rows + '</tbody></table></div></details>';
}

function formatGameDate(iso) {
  if (!iso) return '';
  var parts = iso.split('-');
  if (parts.length !== 3) return iso;
  return parts[1] + '/' + parts[2] + '/' + parts[0].slice(2);
}

function gameClassLabel(c) {
  return { regular: 'Regular', playoff: 'Playoff', preseason: 'Preseason',
           exhibition: 'Exhibition', other: '—' }[c] || c || '—';
}

// The game's own type, plus which round of the competition it belonged to.
//
// The two are not the same question and do not agree: CAHA runs its tier
// competition under four league ids, and the one named "CAHA Preseason" holds
// 819 games the schedule types as Regular. Those four ids are one league to a
// reader, so the round they came from rides on the game as this label -- the
// only place that distinction still lives.
//
// Both are shown unless they say the same word, since "Playoff · Playoffs"
// tells nobody anything.
function gameTypeLabel(cls, stage) {
  var type = gameClassLabel(cls);
  if (!stage) return type;
  if (stage.toLowerCase().indexOf(String(cls || '').toLowerCase()) === 0) return stage;
  return type + ' · ' + stage;
}


// ── Utils ──
function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function escAttr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");}



// ── Narrow screens ────────────────────────────────────────────────────────
// Columns worth dropping on a phone, named rather than numbered because the
// tables here have six different shapes and a column index means something
// different in each. Everything dropped is a detail the player's or the game's
// own page carries anyway; what is left is who, where, and how they did.
//
// Dropping them is what lets the table fit without a scroll container, and the
// header depends on that: a sticky header pins to its nearest scrolling
// ancestor, so wrapping the table in one would unpin it from the title bar.
var MOBILE_DROP_COLUMNS = {
  '#': 1, 'Division': 1, 'PIM': 1, 'PPG': 1, 'SHG': 1, 'Pts/GP': 1,
  'Type': 1, 'Rink': 1, 'Shots': 1, 'SO': 1
};

function isNarrow() {
  return window.matchMedia('(max-width:600px)').matches;
}

function applyMobileColumns(root) {
  var narrow = isNarrow();
  (root || document).querySelectorAll('table').forEach(function(table) {
    var heads = table.querySelectorAll('thead th');
    if (!heads.length) return;
    var drop = {};
    heads.forEach(function(th, i) {
      var name = (th.textContent || '').trim();
      if (MOBILE_DROP_COLUMNS[name]) drop[i] = true;
      th.style.display = (narrow && drop[i]) ? 'none' : '';
    });
    if (Object.keys(drop).length) {
      table.querySelectorAll('tr').forEach(function(tr) {
        if (tr.parentNode.tagName === 'THEAD') return;
        // A row spanning the table (a section divider) has no columns to drop.
        if (tr.children.length !== heads.length) return;
        for (var i = 0; i < tr.children.length; i++) {
          tr.children[i].style.display = (narrow && drop[i]) ? 'none' : '';
        }
      });
    }

    // Whatever still will not fit scrolls, and only that gives up its pinned
    // header. Measured rather than assumed: which tables overflow depends on
    // the names in them, and those change with the filters.
    var wrap = table.closest('.table-wrap');
    if (wrap) {
      wrap.classList.toggle(
        'scrolls', narrow && table.scrollWidth > wrap.clientWidth + 1);
    }
  });
}

// Tables are rebuilt constantly -- every filter change, sort and drill-down --
// so this watches for them rather than being called from each render.
// Spell out the abbreviated stat headers on hover, in whatever table lands --
// keyed on each cell's own label, so a table gets the tooltips by having the
// header, not by opting in, and a cell that already carries a title is left be.
function applyStatTips(root) {
  var cells = root.querySelectorAll('thead th, tr.ph-goalie-subhdr td');
  for (var i = 0; i < cells.length; i++) {
    var cell = cells[i];
    if (cell.title) continue;
    var key = (cell.getAttribute('data-col') || cell.getAttribute('data-gcol')
      || cell.textContent || '').trim();
    if (STAT_TIPS[key]) cell.title = STAT_TIPS[key];
  }
}

function watchForTables() {
  var pending = null;
  var run = function() { pending = null; applyMobileColumns(document); applyStatTips(document); };
  // A timer rather than an animation frame: frames do not fire while the tab is
  // in the background, so a table rendered there would keep its full width
  // until something else happened to redraw it.
  new MutationObserver(function() {
    if (pending) return;
    pending = setTimeout(run, 0);
  }).observe(document.body, { childList: true, subtree: true });
  window.addEventListener('resize', run);
  run();
}

// ── Birth year labels ─────────────────────────────────────────────────────
// 2,592 players share a display name with somebody else, so the birth year is
// not decoration -- it is how you tell two children apart. Only a third have
// an exact year; the rest are narrowed to a range, which is too wide for a
// dense table but is exactly what you want when picking a name out of a list.
function byLabel(playerId) {
  var p = APP.playerById[playerId];
  if (!p || !p.born) return '';
  return '<span class="birth-yr">\'' + String(p.born).slice(2) + '</span>';
}

// A jersey number as a small tile, sitting just before the birth-year one.
function jerseyLabel(jersey) {
  jersey = (jersey == null ? '' : String(jersey)).trim();
  if (!jersey) return '';
  return '<span class="jersey-yr">#' + escHtml(jersey) + '</span>';
}

function bornLabel(playerId) {
  var p = APP.playerById[playerId];
  if (!p) return '';
  if (p.born) return '<span class="birth-yr">\'' + String(p.born).slice(2) + '</span>';
  if (p.bornRange) {
    return '<span class="birth-yr" title="Birth year narrowed to a range, not confirmed">\''
      + String(p.bornRange[0]).slice(2) + '–\'' + String(p.bornRange[1]).slice(2) + '</span>';
  }
  return '';
}

// ── Filters ───────────────────────────────────────────────────────────────
function initFilters() {
  var leagueSel = document.getElementById('sel-league');
  APP.leagues.forEach(function(l) {
    var o = document.createElement('option');
    o.value = l.id; o.textContent = l.name;
    leagueSel.appendChild(o);
  });
  // Everything ticked to start with. A total that quietly leaves a third of
  // the stat lines out is the wrong default: the reader who wants league
  // numbers can say so, but the reader who does not know they are filtering
  // cannot un-know it.
  buildTypeMenu('gameclass-boxes', 'onFilterChange()');
  readGameClasses();
  updateFilterNote();
}

function readGameClasses() {
  var ticked = {};
  document.querySelectorAll('#gameclass-boxes input:checked').forEach(function(box) {
    if (!box.closest('.type-all')) ticked[box.value] = true;
  });
  FILTERS.classes = ticked;
  paintTypeMenu('gameclass-summary', 'gameclass-boxes', Object.keys(ticked));
}

function updateFilterNote() {
  var note = document.getElementById('filter-note');
  if (!note) return;
  if (FILTERS.classes && !Object.keys(FILTERS.classes).length) {
    note.textContent = 'no game types ticked — nothing is counted';
    return;
  }
  var skaters = 0, goalies = 0;
  ALL_ENTRIES.forEach(function(e) { if (e.type === 'goalie') goalies++; else skaters++; });
  note.textContent = skaters.toLocaleString() + ' skater and ' + goalies.toLocaleString()
    + ' goalie seasons counted';
}

// Rebuilding the entries changes what every view is looking at, so the one
// that is on screen has to be drawn again -- and the dropdowns inside it
// repopulated, since a league filter can remove clubs and divisions entirely.
function onFilterChange() {
  FILTERS.league = document.getElementById('sel-league').value;
  readGameClasses();
  buildEntries();
  updateFilterNote();
  updateFilterSummary();
  refreshClubOptions();

  var active = ['schedule', 'browse', 'club', 'player'].filter(function(v) {
    return document.getElementById('view-' + v).classList.contains('active');
  })[0] || 'schedule';
  if (active === 'schedule') { rebuildSchedFilters(); renderSchedule(); }
  else if (active === 'browse') onSeasonChange();
  else if (active === 'club') renderClub();
  else if (active === 'player') {
    if (CURRENT_PLAYER_ID) renderPlayerHistory(CURRENT_PLAYER_ID);
  }
}

// ── Boot ──────────────────────────────────────────────────────────────────
function boot() {
  var status = document.getElementById('load-status');
  status.style.display = 'inline';
  status.textContent = '⏳ Loading…';

  loadJSON('core.json').then(function(core) {
    indexCore(core);
    buildEntries();
    initFilters();
    markActiveView('schedule');
    initSchedule();
    initBrowse();
    initClub();
    initMigration();
    // Open in the markup so the panel still works without this, and closed here
    // only where the screen is small enough to need it. Once at boot: after
    // that it is the reader's to open and leave open.
    if (isNarrow()) {
      var filters = document.getElementById('filters');
      if (filters) filters.open = false;
    }
    watchForTables();
    status.textContent = '✓ ' + core.metadata.counts.players.toLocaleString() + ' players · '
      + SEASONS.length + ' seasons · ' + core.metadata.counts.teams.toLocaleString() + ' teams';
    renderFooter(core.metadata && core.metadata.generated);
    history.replaceState(captureAppState(), '');
    document.documentElement.style.setProperty(
      '--header-h', document.querySelector('header').offsetHeight + 'px');
  }).catch(function(err) {
    status.textContent = '✗ ' + err.message;
    // The viewer's own version is knowable without the dataset, and is exactly
    // what somebody reporting a broken page needs to quote.
    renderFooter(null);
    document.getElementById('schedule-content').innerHTML =
      '<div class="empty"><div class="icon">⚠️</div>Could not load the dataset from <code>'
      + escHtml(APP.base || APP_DATA_SOURCES.join(' or ')) + '</code>.'
      + '<div style="margin-top:8px;font-size:.85rem">'
      + escHtml(err.message) + '</div></div>';
  });
}

boot();

// ════════════════════════════════════════
// VIEW 5: Team
// ════════════════════════════════════════
// A season's worth of one team: where it finished, every game it played or is
// due to play, when it scores, and who was on it. Everything here comes from
// one season shard, fetched on demand -- the team page is the first thing in
// the app that needs game-level detail.
var CURRENT_TEAM_KEY = null;

function goToTeam(key) {
  CURRENT_TEAM_KEY = key;
  // Keep the header season pointed at the team you're looking at, so it reads
  // right and a change from it moves this team, not some other season.
  var t = APP.teamByKey[key];
  if (t) setSeasonSelect(t.season);
  document.querySelectorAll('.view').forEach(function(el) { el.classList.remove('active'); });
  document.querySelectorAll('.tab-btn').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('view-team').classList.add('active');
  markActiveView('team');
  history.pushState({ view: 'team', teamKey: key }, '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  renderTeam(key);
}

// Point the header season control at a given season when it has that option.
function setSeasonSelect(season) {
  var sel = document.getElementById('sel-season');
  if (sel && season != null && sel.querySelector('option[value="' + season + '"]')) {
    sel.value = String(season);
  }
}

// Every game a team appears in that season, oldest first.
function teamGames(season, teamId, games) {
  var out = [];
  Object.keys(games).forEach(function(id) {
    var g = games[id];
    if (g.home !== teamId && g.away !== teamId) return;
    var home = g.home === teamId;
    var played = g.hg != null && g.ag != null;
    out.push({
      id: id, game: g, home: home, played: played,
      opp: home ? g.away : g.home,
      oppName: home ? g.awayName : g.homeName,
      gf: played ? (home ? g.hg : g.ag) : null,
      ga: played ? (home ? g.ag : g.hg) : null
    });
  });
  return out.sort(function(a, b) { return (a.game.date || '').localeCompare(b.game.date || ''); });
}

function resultOf(row) {
  if (!row.played) return null;
  return row.gf > row.ga ? 'W' : (row.gf < row.ga ? 'L' : 'T');
}

function renderTeam(key) {
  var host = document.getElementById('team-content');
  var team = APP.teamByKey[key];
  if (!team) { host.innerHTML = '<div class="empty"><div class="icon">❌</div>Team not found.</div>'; return; }

  var div = APP.divisionById[team.division];
  var league = APP.leagueById[team.league];
  var roster = ALL_ENTRIES.filter(function(e) { return e.teamKey === key; });

  // The club half of the title links back to the club; the level after it stays
  // plain, so "SJ Jr. Sharks 13U AAA" reads with only the club as a link.
  var titleHtml;
  if (team.club) {
    var clubDisp = clubDisplayName(team.club);
    var lvl = teamLabel(team);
    var tail = clubDisp.split(' ').pop().toLowerCase();
    var head = (lvl.split(' ')[0] || '').toLowerCase();
    if (tail && tail === head) lvl = lvl.split(' ').slice(1).join(' ');
    titleHtml = '<span class="team-link" onclick="goToClub(\'' + escAttr(team.club) + '\',' + team.season + ')">'
      + escHtml(clubDisp) + '</span>' + (lvl ? ' ' + escHtml(lvl) : '');
  } else {
    titleHtml = escHtml(teamName(team));
  }

  host.innerHTML =
    '<div class="team-head"><h2>' + titleHtml + '</h2>'
    + '<span class="season-badge">' + SEASON_LABELS[team.season] + '</span>'
    + (div ? '<span class="div-badge">' + escHtml(div.name) + '</span>' : '')
    + (league ? '<span class="div-badge">' + escHtml(league.name) + '</span>' : '')
    + '</div>'
    + '<div id="team-record"><div class="log-loading">Loading record…</div></div>'
    + '<div id="team-schedule"><div class="log-loading">Loading games…</div></div>'
    + '<div id="team-periods"></div>'
    + '<div id="team-roster"></div>'
    + (team.club ? '<div class="panel dr-panel">'
        + '<div class="dr-h">Player movement</div>'
        + '<p class="dr-lede">Tracing this exact roster &mdash; the clubs these players were with the season before, and the season after. Hover a block to follow one club.</p>'
        + '<div id="team-flow" style="overflow-x:auto"></div>'
        + '<div id="team-flow-legend" style="margin-top:10px"></div></div>' : '');

  renderTeamRoster(roster);
  if (team.club) {
    renderFlowInto(document.getElementById('team-flow'), document.getElementById('team-flow-legend'),
      { season: team.season, focusClub: team.club, focusTeam: key });
  }

  loadSeasonGames(team.season).then(function(games) {
    var rows = teamGames(team.season, team.id, games);
    TEAM_VIEW = { team: team, rows: rows };
    renderTeamRecord(team, rows);
    renderTeamSchedule(rows, team);
    renderTeamPeriods(rows, team);
  }).catch(function(err) {
    document.getElementById('team-schedule').innerHTML =
      '<div class="log-loading">Games unavailable (' + escHtml(err.message) + ')</div>';
    var rec = document.getElementById('team-record');
    if (rec) rec.innerHTML = '';
  });
}

// The record above the schedule, with a Regular / All games toggle. Both are
// added up from the games themselves rather than any published table, so the
// current season and games no league table counts still show, and the two
// scopes differ only by the non-regular games.
// Shares RESULTS_SCOPE with the division standings so the reader's Regular /
// All-games choice carries across. Left unset, a team defaults to Regular, or to
// All where it has played nothing but exhibitions yet -- so a preseason page
// opens on the games it has.
var TEAM_VIEW = null;

function renderTeamRecord(team, rows) {
  var host = document.getElementById('team-record');
  if (!host) return;
  var scope = RESULTS_SCOPE;
  if (scope == null) {
    var hasRegular = rows.some(function(r) { return r.played && r.game['class'] === 'regular'; });
    var hasAny = rows.some(function(r) { return r.played; });
    scope = (hasRegular || !hasAny) ? 'regular' : 'all';
  }
  var toggle = '<div class="rec-head"><div class="rec-toggle">'
    + '<button type="button" class="rec-btn' + (scope === 'regular' ? ' active' : '')
    + '" onclick="setResultsScope(\'regular\')">Regular</button>'
    + '<button type="button" class="rec-btn' + (scope === 'all' ? ' active' : '')
    + '" onclick="setResultsScope(\'all\')">All games</button>'
    + '</div></div>';
  host.innerHTML = toggle + teamRecordPanel(team, rows, scope);
}

function teamRecordPanel(team, rows, scope) {
  // Both scopes add up the same way -- one filters to regular-season games, the
  // other keeps every type -- so switching between them moves only the
  // non-regular games, and the two always reconcile against the schedule below.
  var played = rows.filter(function(r) {
    return r.played && (scope === 'all' || r.game['class'] === 'regular');
  });
  if (!played.length) {
    return '<div class="team-sub">No ' + (scope === 'all' ? 'games' : 'regular-season games')
      + ' played yet.</div>';
  }
  var w = 0, l = 0, t = 0, gf = 0, ga = 0;
  played.forEach(function(r) {
    gf += r.gf; ga += r.ga;
    var res = resultOf(r);
    if (res === 'W') w++; else if (res === 'L') l++; else t++;
  });
  var recLabels = 'W-L' + (t ? '-T' : '');
  var rec = w + '-' + l + (t ? '-' + t : '');
  var title = scope === 'all' ? 'Record · all games' : 'Record · regular season';
  return teamRecordBar(title, rec, recLabels, played.length, 2 * w + t, gf, ga);
}

function teamRecordBar(title, rec, labels, gp, pts, gf, ga) {
  function tile(val, lbl, accent) {
    return '<div class="ctb-item"' + (accent ? ' style="color:var(--accent2)"' : '') + '>'
      + '<span class="ctb-val">' + escHtml(String(val == null ? '—' : val)) + '</span>'
      + '<span class="ctb-lbl">' + lbl + '</span></div>';
  }
  return '<div class="panel-title" style="margin-bottom:8px">' + escHtml(title) + '</div>'
    + '<div class="club-totals-bar">'
    + tile(rec, labels) + tile(gp, 'Games') + tile(pts, 'Points', true)
    + tile(gf, 'Goals For') + tile(ga, 'Goals Against')
    + '</div>';
}

function renderTeamSchedule(rows, team) {
  var host = document.getElementById('team-schedule');
  if (!rows.length) {
    host.innerHTML = '<div class="panel"><div class="panel-title">Schedule</div>'
      + '<p style="color:var(--muted);padding:4px 2px">No games recorded for this team.</p></div>';
    return;
  }
  var played = rows.filter(function(r) { return r.played; });
  var wins = played.filter(function(r) { return resultOf(r) === 'W'; }).length;
  var losses = played.filter(function(r) { return resultOf(r) === 'L'; }).length;
  var ties = played.length - wins - losses;

  var body = rows.map(function(r) {
    var res = resultOf(r);
    var cls = res === 'W' ? 'res-w' : res === 'L' ? 'res-l' : 'res-t';
    var opp = APP.teamByKey[teamKey(team.season, r.opp)];
    // The opponent name goes to that team; only the result opens the box score.
    var oppCell = opp
      ? '<span class="team-link" onclick="goToTeam(\'' + escAttr(teamKey(team.season, r.opp)) + '\')">' + escHtml(teamName(opp)) + '</span>'
      : escHtml(r.oppName || 'Unknown');
    var resultCell = r.played
      ? '<span class="box-link" onclick="openBoxScore(' + team.season + ',\'' + r.id + '\')" title="Box score">'
        + '<span class="' + cls + '">' + res + '</span> ' + r.gf + '–' + r.ga + '</span>'
      : '<span class="sched">' + escHtml(r.game.time || 'scheduled') + '</span>';
    return '<tr>'
      + '<td class="log-date">' + escHtml(formatGameDate(r.game.date)) + '</td>'
      + '<td>' + (r.home ? '<span class="log-vs">vs</span> ' : '<span class="log-vs">@</span> ') + oppCell + '</td>'
      + '<td class="log-class">'
      + escHtml(gameTypeLabel(r.game['class'], r.game.stage)) + '</td>'
      + '<td class="num">' + resultCell + '</td>'
      + '<td class="log-class">' + escHtml(r.game.rink || '') + '</td>'
      + '</tr>';
  }).join('');

  host.innerHTML = '<div class="panel"><div class="section-heading" style="margin-bottom:12px">'
    + '<h2 style="font-size:1rem">Schedule &amp; Results</h2>'
    + '<span class="badge">' + played.length + ' played'
    + (played.length ? ' · ' + wins + '-' + losses + (ties ? '-' + ties : '') : '')
    + (rows.length > played.length ? ' · ' + (rows.length - played.length) + ' upcoming' : '')
    + '</span></div>'
    + '<div class="table-wrap"><table><thead><tr>'
    + '<th>Date</th><th>Opponent</th><th>Type</th>'
    + '<th style="text-align:right">Result</th><th>Rink</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

// ── Scoring by period ─────────────────────────────────────────────────────
// Period scores are recorded for every game, so this is one of the few things
// in the app with no coverage caveat attached.
function renderTeamPeriods(rows, team) {
  var host = document.getElementById('team-periods');
  var forBy = {}, againstBy = {}, periods = {};
  var counted = 0;
  rows.forEach(function(r) {
    var p = r.game.periods;
    if (!r.played || !p) return;
    var mine = p[r.home ? 'home' : 'away'] || {};
    var theirs = p[r.home ? 'away' : 'home'] || {};
    var any = false;
    Object.keys(mine).forEach(function(k) { forBy[k] = (forBy[k] || 0) + mine[k]; periods[k] = true; any = true; });
    Object.keys(theirs).forEach(function(k) { againstBy[k] = (againstBy[k] || 0) + theirs[k]; periods[k] = true; any = true; });
    if (any) counted++;
  });

  var keys = Object.keys(periods).sort(function(a, b) {
    var na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });
  if (!keys.length) { host.innerHTML = ''; return; }

  var cells = keys.map(function(k) {
    var f = forBy[k] || 0, a = againstBy[k] || 0;
    var diff = f - a;
    var colour = diff > 0 ? 'var(--green)' : (diff < 0 ? 'var(--red,#e5484d)' : 'var(--text)');
    return '<div class="period-cell">'
      + '<div class="pc-lbl">' + escHtml(periodLabel(k)) + '</div>'
      + '<div class="pc-val" style="color:' + colour + '">' + (diff > 0 ? '+' : '') + diff + '</div>'
      + '<div class="pc-split">' + f + ' for · ' + a + ' against</div>'
      + '</div>';
  }).join('');

  host.innerHTML = '<div class="panel"><div class="section-heading" style="margin-bottom:12px">'
    + '<h2 style="font-size:1rem">Scoring by Period</h2>'
    + '<span class="badge">' + counted + ' game' + (counted !== 1 ? 's' : '') + '</span></div>'
    + '<div class="period-grid">' + cells + '</div></div>';
}

function periodLabel(p) {
  return { '1': '1st', '2': '2nd', '3': '3rd', '4': 'OT', 'OT': 'OT', 'SO': 'SO' }[String(p)] || String(p);
}

function renderTeamRoster(roster) {
  var host = document.getElementById('team-roster');
  var skaters = roster.filter(function(e) { return e.type === 'skater'; })
    .sort(function(a, b) { return entryPts(b) - entryPts(a); });
  var goalies = roster.filter(function(e) { return e.type === 'goalie'; })
    .sort(function(a, b) { return entryGAA(a) - entryGAA(b); });
  if (!skaters.length && !goalies.length) {
    host.innerHTML = '<div class="panel"><div class="panel-title">Roster</div>'
      + '<p style="color:var(--muted);padding:4px 2px">No roster recorded — the games'
      + ' counted filter may be excluding them.</p></div>';
    return;
  }
  var skaterRows = skaters.map(function(e, i) {
    return '<tr><td class="num">' + (i + 1) + '</td>'
      + '<td class="player-link" onclick="goToPlayer(' + e.playerId + ')">'
      + escHtml(e.playerName) + byLabel(e.playerId) + '</td>'
      + '<td class="jersey">' + escHtml(e.jersey) + '</td>'
      + '<td class="num">' + (e.GP || 0) + '</td><td class="num">' + (e.G || 0) + '</td>'
      + '<td class="num">' + (e.A || 0) + '</td><td class="num pts">' + entryPts(e) + '</td>'
      + '<td class="num">' + (e.PIM || 0) + '</td><td class="num">' + (e.PPG || 0) + '</td>'
      + '<td class="num">' + (e.SHG || 0) + '</td>'
      + '<td class="num">' + entryPtsPerGame(e) + '</td></tr>';
  }).join('');
  var goalieRows = goalies.map(function(e, i) {
    return '<tr><td class="num">' + (i + 1) + '</td>'
      + '<td class="player-link" onclick="goToPlayer(' + e.playerId + ')">'
      + escHtml(e.playerName) + byLabel(e.playerId) + '</td>'
      + '<td class="jersey">' + escHtml(e.jersey) + '</td>'
      + '<td class="num">' + (e.GP || 0) + '</td>'
      + '<td class="num">' + entryShots(e) + '</td><td class="num">' + entryGA(e) + '</td>'
      + '<td class="num">' + entryGAADisplay(e) + '</td>'
      + '<td class="num" style="color:var(--green)">' + (entrySavePct(e) || '—') + '</td>'
      + '<td class="num">' + (e.SO != null ? e.SO : '') + '</td></tr>';
  }).join('');

  host.innerHTML = '<div class="panel"><div class="panel-title">Roster</div>'
    + (skaters.length ? '<div class="table-wrap"><table class="ranked"><thead><tr>'
        + '<th style="text-align:right">Rk</th><th>Player</th><th>#</th>'
        + '<th style="text-align:right">GP</th><th style="text-align:right">G</th>'
        + '<th style="text-align:right">A</th><th style="text-align:right">PTS</th>'
        + '<th style="text-align:right">PIM</th><th style="text-align:right">PPG</th>'
        + '<th style="text-align:right">SHG</th><th style="text-align:right">Pts/GP</th>'
        + '</tr></thead><tbody>' + skaterRows + '</tbody></table></div>' : '')
    + (goalies.length ? '<div class="panel-title" style="margin-top:18px">Goaltending</div>'
        + '<div class="table-wrap"><table class="ranked"><thead><tr>'
        + '<th style="text-align:right">Rk</th><th>Goalie</th><th>#</th>'
        + '<th style="text-align:right">GP</th><th style="text-align:right">Shots</th>'

// The host the data is collected from; the game's own id opens the same
// scoresheet PDF a scorekeeper files -- generate-scorecard.php, the "Scoresheet"
// column on Time to Score, not the HTML oss-scoresheet page.
var TTS_HOST = 'https://stats.caha.timetoscore.com';

function renderBoxScore(season, g, gameId) {
  var home = APP.teamByKey[teamKey(season, g.home)];
  var away = APP.teamByKey[teamKey(season, g.away)];
  var homeName = home ? teamName(home) : (g.homeName || 'Home');
  var awayName = away ? teamName(away) : (g.awayName || 'Away');
  var played = g.hg != null && g.ag != null;

  var periods = periodKeys(g);
  var lineScore = '<div class="table-wrap"><table><thead><tr><th>Team</th>'
    + periods.map(function(p) { return '<th style="text-align:right">' + escHtml(periodLabel(p)) + '</th>'; }).join('')
    + '<th style="text-align:right">Final</th></tr></thead><tbody>'
    + [['away', awayName, g.ag], ['home', homeName, g.hg]].map(function(row) {
        var side = row[0], name = row[1], total = row[2];
        var scores = (g.periods || {})[side] || {};
        return '<tr><td class="box-side">' + escHtml(name) + '</td>'
          + periods.map(function(p) {
              return '<td class="num">' + (scores[p] != null ? scores[p] : '–') + '</td>';
            }).join('')
          + '<td class="num pts">' + (total != null ? total : '–') + '</td></tr>';
      }).join('')
    + '</tbody></table></div>';

  var meta = [formatGameDate(g.date), g.time, g.rink,
              gameTypeLabel(g['class'], g.stage), g.level]
    .filter(Boolean).map(escHtml).join(' · ');

  // The scoresheet PDF is filed once a game is played; a scheduled game has
  // none to link to yet.
  var scoresheet = (played && gameId != null)
    ? '<div class="box-links"><a class="scoresheet-link" target="_blank" rel="noopener noreferrer" href="'
      + TTS_HOST + '/generate-scorecard.php?game_id=' + encodeURIComponent(gameId)
      + '">Scoresheet PDF <span aria-hidden="true">↗</span></a></div>'
    : '';

  return '<div class="box-head">'
    + '<div class="box-score-line">' + escHtml(awayName) + ' '
    + (played ? g.ag + ' – ' + g.hg : 'vs') + ' ' + escHtml(homeName) + '</div>'
    + '</div><div class="box-meta">' + meta
    + (played ? '' : ' · <span class="sched">not played yet</span>') + '</div>'
    + scoresheet
    + (played ? lineScore : '')
    + renderGoalList(season, g, homeName, awayName)
    + renderPenaltyList(season, g, homeName, awayName);
}

function periodKeys(g) {
  var seen = {};
  Object.keys(g.periods || {}).forEach(function(side) {
    Object.keys(g.periods[side] || {}).forEach(function(p) { seen[p] = true; });
  });
  var keys = Object.keys(seen);
  if (!keys.length) return ['1', '2', '3'];
  return keys.sort(function(a, b) {
    var na = parseInt(a), nb = parseInt(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a).localeCompare(String(b));
  });
}

//: Strengths the scoresheet system sets itself when a goal is scored during a
//: penalty. They are recorded rather than typed, so they are worth showing.
var STRENGTH_LABELS = {
  PP: 'Power play', SH: 'Short-handed', EN: 'Empty net',
  '5/3': '5-on-3', '4/4': '4-on-4', PS: 'Penalty shot'
};

function strengthTag(code) {
  if (!code) return '';
  var label = STRENGTH_LABELS[code] || code;
  return ' <span class="strength-tag" title="' + escHtml(label) + '">' + escHtml(code) + '</span>';
}

function playerLink(id, fallback) {
  var p = id ? APP.playerById[id] : null;
  if (!p) return escHtml(fallback || 'Unknown');
  return '<span class="player-link" onclick="closeBoxScore();goToPlayer(' + id + ')">'
    + escHtml(p.name) + '</span>';
}

function renderGoalList(season, g, homeName, awayName) {
  if (!g.goals || !g.goals.length) {
    return '<div class="box-sect">Scoring</div>'
      + '<p style="color:var(--muted);font-size:.85rem">No goals recorded.</p>';
  }
  var rows = g.goals.slice().sort(function(a, b) {
    var pa = parseInt(a.per) || 0, pb = parseInt(b.per) || 0;
    if (pa !== pb) return pa - pb;
    return (b.sec || 0) - (a.sec || 0);   // clocks count down
  }).map(function(goal) {
    var assists = (goal.assists || []).map(function(id) { return playerLink(id); });
    return '<tr>'
      + '<td class="log-class">' + escHtml(periodLabel(goal.per)) + '</td>'
      + '<td class="log-date">' + escHtml(goal.time || '') + '</td>'
      + '<td class="box-side">' + escHtml(goal.side === 'home' ? homeName : awayName) + '</td>'
      + '<td>' + playerLink(goal.by, goal.byNo ? '#' + goal.byNo : null) + strengthTag(goal.str)
      + (assists.length ? '<div class="goal-assists">' + assists.join(', ') + '</div>' : '')
      + '</td></tr>';
  }).join('');
  return '<div class="box-sect">Scoring</div>'
    + '<div class="table-wrap"><table><tbody>' + rows + '</tbody></table></div>';
}

function renderPenaltyList(season, g, homeName, awayName) {
  if (!g.penalties || !g.penalties.length) return '';
  var rows = g.penalties.slice().sort(function(a, b) {
    return (parseInt(a.per) || 0) - (parseInt(b.per) || 0);
  }).map(function(pen) {
    return '<tr>'
      + '<td class="log-class">' + escHtml(periodLabel(pen.per)) + '</td>'
      + '<td class="log-date">' + escHtml(pen.off || pen.start || '') + '</td>'
      + '<td class="box-side">' + escHtml(pen.side === 'home' ? homeName : awayName) + '</td>'
      + '<td>' + playerLink(pen.by, pen.byNo ? '#' + pen.byNo : null) + '</td>'
      + '<td>' + escHtml(pen.inf || '') + '</td>'
      + '<td class="num">' + (pen.min != null ? pen.min : '') + '</td>'
      + '</tr>';
  }).join('');
  return '<div class="box-sect">Penalties</div>'
    + '<div class="table-wrap"><table><thead><tr>'
    + '<th></th><th>Time</th><th>Team</th><th>Player</th><th>Infraction</th>'
    + '<th style="text-align:right">Min</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
}


// ════════════════════════════════════════
// Linemates
// ════════════════════════════════════════
// Who a player scores with, in both directions: the goals they finished off
// somebody's pass, and the goals somebody finished off theirs. Only 71% of
// goals carry an assist at all, so the counts are a floor rather than a
// complete picture, and the panel says so.
//
// Tallied a season at a time, because a linemate is a property of a roster and
// a roster lasts one season. A career total ranks the boy somebody fed twenty
// times in one year level with the one they happened to share a bench with
// twice a year for five, and reads as though both were linemates. "All
// seasons" is still one click away, since who a player keeps ending up with
// across teams is worth seeing — it is just a different question.
var LINEMATES = null;

// A season's worth of scoring is often a single goal, where a career's
// never was, so the counts have to read as English either way.
function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function renderLinemates(playerId, seasons, playing) {
  var host = document.getElementById('linemates');
  if (!host) return;
  host.innerHTML = '<div class="log-loading">Working out linemates…</div>';

  Promise.all(seasons.map(loadSeasonGames)).then(function(all) {
    // The reader may have moved to another player while the season files were
    // loading; that page has its own #linemates and this one is detached.
    if (document.getElementById('linemates') !== host) return;

    var classes = classFilter();

    function blank() { return { fedMe: {}, iFed: {}, goals: 0, assists: 0, assisted: 0 }; }

    // A game counts when one of the player's still-ticked teams was in it.
    // That replaces the league test this used to run: the player page has no
    // league picker any more, and the teams are the finer question anyway --
    // untick one of two teams a player had in a season and the games of the
    // other are what should remain.
    function ours(season, game) {
      if (!playing) return true;
      return playing[season + '|' + game.home] || playing[season + '|' + game.away];
    }

    function tally(into, game) {
      (game.goals || []).forEach(function(goal) {
        var assists = goal.assists || [];
        if (goal.by === playerId) {
          into.goals++;
          if (assists.length) into.assisted++;
          assists.forEach(function(a) { into.fedMe[a] = (into.fedMe[a] || 0) + 1; });
        } else if (assists.indexOf(playerId) !== -1) {
          into.assists++;
          if (goal.by) into.iFed[goal.by] = (into.iFed[goal.by] || 0) + 1;
        }
      });
    }

    var bySeason = {}, everything = blank();
    all.forEach(function(games, i) {
      var here = blank();
      Object.keys(games).forEach(function(id) {
        var g = games[id];
        if (classes && !classes[g['class']]) return;
        if (!ours(seasons[i], g)) return;
        tally(here, g);
        tally(everything, g);
      });
      if (here.goals || here.assists) bySeason[seasons[i]] = here;
    });

    if (!everything.goals && !everything.assists) {
      host.innerHTML = '<div class="panel"><div class="panel-title">Linemates</div>'
        + '<p style="color:var(--muted);font-size:.85rem">No goals or assists in the '
        + 'games currently counted.</p></div>';
      return;
    }

    var played = seasons.filter(function(s) { return bySeason[s]; })
                        .sort(function(a, b) { return b - a; });
    LINEMATES = { host: host, bySeason: bySeason, all: everything, seasons: played };
    // Newest first: a player page is usually being read about the season the
    // player is in now, not the one they started in.
    pickLinemateSeason(played[0]);
  }).catch(function(err) {
    host.innerHTML = '<div class="log-loading">Linemates unavailable ('
      + escHtml(err.message) + ')</div>';
  });
}

function pickLinemateSeason(key) {
  if (!LINEMATES || !LINEMATES.host.isConnected) return;
  var picked = key === 'all' ? LINEMATES.all : LINEMATES.bySeason[key];
  if (!picked) return;

  // Only worth a switcher when there is something to switch between; one
  // season is its own career total and a control that does nothing is worse
  // than no control.
  var chips = '';
  if (LINEMATES.seasons.length > 1) {
    chips = '<div class="mate-seasons">'
      + LINEMATES.seasons.map(function(s) {
          return '<button class="mate-season' + (key === s ? ' active' : '') + '" '
            + 'onclick="pickLinemateSeason(' + s + ')">'
            + escHtml(SEASON_LABELS[s]) + '</button>';
        }).join('')
      + '<button class="mate-season' + (key === 'all' ? ' active' : '') + '" '
      + 'onclick="pickLinemateSeason(\'all\')">All seasons</button></div>';
  }

  LINEMATES.host.innerHTML = '<div class="panel">'
    + '<div class="section-heading" style="margin-bottom:12px">'
    + '<h2 style="font-size:1rem">Linemates</h2>'
    + '<span class="badge">' + plural(picked.goals, 'goal') + ' · '
    + plural(picked.assists, 'assist')
    + (key === 'all' ? '' : ' in ' + escHtml(SEASON_LABELS[key])) + '</span></div>'
    + chips
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px">'
    + mateColumn('Set up their goals', picked.iFed)
    + mateColumn('Assisted on their goals', picked.fedMe)
    + '</div>'
    + '<div style="color:var(--muted);font-size:.78rem;margin-top:14px">'
    + (picked.goals ? picked.assisted + ' of ' + plural(picked.goals, 'goal')
        + (picked.goals === 1 ? ' carries' : ' carry') + ' a recorded assist. ' : '')
    + 'Assists are recorded on about 71% of goals overall, so these are a floor.'
    + '</div></div>';
}

function mateColumn(title, counts) {
  var list = Object.keys(counts).map(function(id) {
    return { id: parseInt(id), n: counts[id] };
  }).sort(function(a, b) { return b.n - a.n; }).slice(0, 10);
  if (!list.length) {
    return '<div><div class="panel-title">' + escHtml(title) + '</div>'
      + '<p style="color:var(--muted);font-size:.85rem">None recorded.</p></div>';
  }
  var top = list[0].n;
  return '<div><div class="panel-title">' + escHtml(title) + '</div>'
    + list.map(function(m) {
        var p = APP.playerById[m.id];
        return '<div class="mate-row">'
          + '<span class="mate-n">' + m.n + '×</span>'
          + '<span class="mate-bar" style="width:' + Math.round(70 * m.n / top) + 'px"></span>'
          + '<span class="player-link" onclick="goToPlayer(' + m.id + ')">'
          + escHtml(p ? p.name : ('#' + m.id)) + '</span>'
          + (p ? byLabel(m.id) : '') + '</div>';
      }).join('')
    + '</div>';
}

function migShowPlayerPopup(ids, clubLabel, seasonLabel, ev) {

  }

    return { id: id, name: (APP.playerById[id] || {}).name || ('#' + id) };
  }).sort(function(a, b) { return a.name.localeCompare(b.name); });

  var html = '<div class="mig-popup-title">'
           + escHtml(clubLabel) + ' — ' + escHtml(seasonLabel)
           + ' <span class="mig-popup-count">(' + sorted.length + ')</span>'
           + closeBtn
           + '</div>'

           + '</div>';
  popup.innerHTML = html;
  var closeEl = document.getElementById('mig-popup-close-btn');
  if (closeEl) closeEl.onclick = function() { popup.style.display = 'none'; };
  popup.style.display = 'block';

  // Position near click, keeping within viewport
  var x = ev.clientX + 14, y = ev.clientY - 10;
  popup.style.left = '0'; popup.style.top = '0';
  var pw = popup.offsetWidth || 220, ph = popup.offsetHeight || 200;
  if (x + pw + 8 > window.innerWidth)  x = ev.clientX - pw - 14;
  if (y + ph + 8 > window.innerHeight) y = window.innerHeight - ph - 8;
  popup.style.left = Math.max(8, x) + 'px';
  popup.style.top  = Math.max(8, y) + 'px';

  // Dismiss on next click outside
  setTimeout(function() {
    function closePopup(e) {
      if (!popup.contains(e.target)) {
        popup.style.display = 'none';
        document.removeEventListener('click', closePopup, true);
      }
    }
    document.addEventListener('click', closePopup, true);
  }, 0);
}


// Fills the hidden season control the flow chart reads. The chart itself is
// drawn from the club and team pages via renderFlowInto.
function initMigration() {
  var sel = document.getElementById('mig-season');
  sel.innerHTML = '';
  var latest = latestSeasonWithData();
  SEASONS.forEach(function(s) {
    var o = document.createElement('option');

// Draw the player-flow chart into any container, centred on a season and
// focused on a club (and optionally one of its teams). The drawing reads its
// focus from the hidden controls, and reads it *before* it rebuilds their
// option lists -- so each is seeded here with the wanted value already selected,
// which then survives the rebuild.
function renderFlowInto(container, legendEl, opts) {
  opts = opts || {};
  document.getElementById('mig-season').value = String(opts.season);
  document.getElementById('mig-focus-club').innerHTML =
    '<option value="' + escAttr(opts.focusClub || '') + '" selected></option>';
  document.getElementById('mig-team-filter').innerHTML =
    '<option value="' + escAttr(opts.focusTeam || '') + '" selected></option>';
  container.innerHTML = '<div class="empty"><div class="icon">⏳</div>Working out the flow…</div>';
  if (legendEl) legendEl.innerHTML = '';
  setTimeout(function() {
    if (!container.isConnected) return; // the reader moved on before it drew
    _drawMigrationSVG(container, legendEl);
  }, 20);
}

function _drawMigrationSVG(container, legendEl) {
  // Read through APP: this function declares its own SEASONS below, for the two
  // or three columns it draws, and that declaration shadows the global one for
  // the whole function body.
  var ALL_SEASONS    = APP.seasons;
  var primarySeason  = parseInt(document.getElementById('mig-season').value)
                       || ALL_SEASONS[ALL_SEASONS.length - 1];
  var psIdx          = ALL_SEASONS.indexOf(primarySeason);
  // Build context-aware SEASONS array (2 or 3 elements)
  var SEASONS;
  if (psIdx === 0) {
    // Earliest: show [selected, next]
    SEASONS = [ALL_SEASONS[0], ALL_SEASONS[1]];
  } else if (psIdx === ALL_SEASONS.length - 1) {
    // Most recent: show [prev, selected]
    SEASONS = [ALL_SEASONS[psIdx - 1], ALL_SEASONS[psIdx]];
  } else {
    // Middle: show [prev, selected, next]
    SEASONS = [ALL_SEASONS[psIdx - 1], ALL_SEASONS[psIdx], ALL_SEASONS[psIdx + 1]];
  }
  var seasonStart    = SEASONS[0];
  var seasonEnd      = SEASONS[SEASONS.length - 1];
  var minFlow        = parseInt(document.getElementById('mig-min-flow').value) || 1;
  var NO_DATA        = '— No Data';   // sentinel club for missing season data
  // Always the full, unfiltered roster history -- the flow is about where
  // players went, not what the filter bar is narrowing the stats to.
  var FLOW_ENTRIES   = fullEntries();

  // ── 1. Populate team dropdown, then read team filter ─────────────
  // Teams are identified by their key: in the older seasons every one of a
  // club's teams carries the same name, so a name would select several.
  var teamSel          = document.getElementById('mig-team-filter');
  var prevTeam         = teamSel.value;
  var currentFocusClub = document.getElementById('mig-focus-club').value;
  var teamSet = {};
  FLOW_ENTRIES.forEach(function(e) {
    if (e.season !== primarySeason) return;
    if (currentFocusClub && e.club !== currentFocusClub) return;
    teamSet[e.teamKey] = currentFocusClub ? e.teamShort : e.team;
  });
  var teamList = Object.keys(teamSet).sort(function(a, b) {
    return teamSet[a].localeCompare(teamSet[b]);
  });
  var teamOpts = '<option value="">All teams</option>';
  teamList.forEach(function(t) {
    teamOpts += '<option value="' + escAttr(t) + '"' + (t === prevTeam ? ' selected' : '')
             + '>' + escHtml(teamSet[t]) + '</option>';
  });
  teamSel.innerHTML = teamOpts;
  var teamFilter = teamSel.value;

  // If a specific team is selected, collect the roster for that team in the PRIMARY season only
  // (both skaters and goalies). We then track where those exact players came from / went to.
  var teamPlayerSet = null;
  if (teamFilter) {
    teamPlayerSet = {};
    FLOW_ENTRIES.forEach(function(e) {
      if (e.type !== 'skater' && e.type !== 'goalie') return;
      if (e.season !== primarySeason) return;   // primary season roster only
      if (e.teamKey === teamFilter) teamPlayerSet[e.playerId] = true;
    });
  }

  // ── 2. Build player→season→club map (skaters + goalies) ──────────
  var playerClubs = {}; // player id -> {season -> primaryClub}
  FLOW_ENTRIES.forEach(function(e) {
    if (teamPlayerSet && !teamPlayerSet[e.playerId]) return;
    if (!e.club) return;
    if (!playerClubs[e.playerId]) playerClubs[e.playerId] = {};
    if (!playerClubs[e.playerId][e.season]) playerClubs[e.playerId][e.season] = e.club;
  });

  // ── 2. Count players per (season,club) and flows ─────────────────
  var seasonClubCounts = {}; // {season: {club: n}}
  var flowMap = {};           // composite key -> {fromClub,fromSeason,toClub,toSeason,count}

  Object.keys(playerClubs).forEach(function(name) {
    var seasons = playerClubs[name];
    SEASONS.forEach(function(s) {
      if (!seasons[s]) return;
      if (!seasonClubCounts[s]) seasonClubCounts[s] = {};
      var c = seasons[s];
      seasonClubCounts[s][c] = (seasonClubCounts[s][c] || 0) + 1;
    });
    for (var i = 0; i < SEASONS.length - 1; i++) {
      var s1 = SEASONS[i], s2 = SEASONS[i+1];
      if (!seasons[s1] || !seasons[s2]) continue;
      var key = seasons[s1]+'|||'+s1+'|||'+seasons[s2]+'|||'+s2;
      if (!flowMap[key]) flowMap[key] = {fromClub:seasons[s1],fromSeason:s1,toClub:seasons[s2],toSeason:s2,count:0};
      flowMap[key].count++;
    }
  });

  // ── 2c. Build block→player name lookup ───────────────────────────
  var blockPlayers = {}; // {season: {club: [sorted names]}}
  Object.keys(playerClubs).forEach(function(name) {
    var sc = playerClubs[name];
    SEASONS.forEach(function(s) {
      if (!sc[s]) return;
      var c = sc[s];
      if (!blockPlayers[s]) blockPlayers[s] = {};
      if (!blockPlayers[s][c]) blockPlayers[s][c] = [];
      blockPlayers[s][c].push(name);
    });
  });

  // ── 2b. No-Data flows: players who appear or vanish between seasons ───
  // Only consider players who have data in at least one season within SEASONS
  var playersInRange = {};

    });
    g.addEventListener('mouseleave', function() {
      svg.querySelectorAll('.flow-label').forEach(function(t) { t.style.display = 'none'; });
      svg.querySelectorAll('.block-total-label').forEach(function(t) { t.style.display = 'none'; });
      svg.querySelectorAll('.club-group').forEach(function(other) { other.style.opacity = '1'; });
      svg.querySelectorAll('.flow-path').forEach(function(p) { p.setAttribute('opacity', p.dataset.opac); });
      // Restore any block rect title we overwrote on mouseenter
      var blockRect = g.querySelector('rect.club-block');
      if (blockRect) {
        var blockTitleEl = blockRect.querySelector('title');
        if (blockTitleEl && blockTitleEl._origText) blockTitleEl.textContent = blockTitleEl._origText;
      }
    });
  });

  // Click a block → show player list popup only (no dropdown changes or re-render)
  svg.querySelectorAll('.club-group').forEach(function(g) {
    g.addEventListener('click', function(ev) {
      ev.stopPropagation();
      var club    = g.dataset.club;
      var season  = parseInt(g.dataset.season);
      var NO_DATA = svg.dataset.noData;
      var focusClub = document.getElementById('mig-focus-club').value;

      // When a focus club is set and we click a source block, show only the
      // players who flowed from this club into the focused destination club.
      var hasOut = !!svg.querySelector('.flow-label[data-from="'+club+'"][data-froms="'+season+'"]');
      var hasIn  = !!svg.querySelector('.flow-label[data-to="'+club+'"][data-tos="'+season+'"]');
      var isSource      = hasOut && !hasIn;
      var isDestination = hasIn  && !hasOut && club !== focusClub;

      if (focusClub && isSource) {
        var flowLabel = svg.querySelector('.flow-label[data-from="'+club+'"][data-froms="'+season+'"][data-to="'+focusClub+'"]');
        if (flowLabel) {
          var names = JSON.parse(flowLabel.dataset.players || '[]');
          var label = clubDisplayName(club) + ' → ' + clubDisplayName(focusClub);
          migShowPlayerPopup(names, label, SEASON_LABELS[season] + ' → ' + SEASON_LABELS[parseInt(flowLabel.dataset.tos)], ev);
          return;
        }
      }

      // When a focus club is set and we click a destination block, show only the
      // players who flowed from the focused source club into this destination.
      if (focusClub && isDestination) {
        var flowLabel = svg.querySelector('.flow-label[data-from="'+focusClub+'"][data-to="'+club+'"][data-tos="'+season+'"]');
        if (flowLabel) {
          var names = JSON.parse(flowLabel.dataset.players || '[]');
          var label = clubDisplayName(focusClub) + ' → ' + clubDisplayName(club);
          migShowPlayerPopup(names, label, SEASON_LABELS[parseInt(flowLabel.dataset.froms)] + ' → ' + SEASON_LABELS[season], ev);
          return;
        }
      }

      var names = JSON.parse(g.dataset.players || '[]');
      migShowPlayerPopup(names, club === NO_DATA ? 'No Data' : clubDisplayName(club), SEASON_LABELS[season], ev);
    });
  });

  // Focus is set/cleared via the Club dropdown only (not via block clicks)

  // ── 6. Legend ─────────────────────────────────────────────────────
  var activeSeason = Object.keys(seasonClubCounts);
  var legendClubs  = allClubs.filter(function(c) {
    return activeSeason.some(function(s){ return seasonClubCounts[s] && seasonClubCounts[s][c]; });
  });
  var legendHTML = '<div style="display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;">';
  legendClubs.forEach(function(c) {
    legendHTML += '<span style="display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--text);">'
                + '<span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:'+clubColor[c]+';flex-shrink:0;"></span>'
                + escHtml(clubDisplayName(c))+'</span>';
  });
  legendHTML += '</div>';
  legendEl.innerHTML = legendHTML;
}

</script>

</body>
</html>
