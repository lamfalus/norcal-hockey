// ENTRY HELPERS
// ═══════════════════════════════════════
// Everything above hands these rows around, so the arithmetic on them lives in
// one place. Points are recomputed rather than read: the class filter can be
// showing any subset of a player's season, and a stored total would be the
// whole of it.
function normalizeTeam(t) { return (t || '').replace(/\s+/g, ' ').trim(); }

// The short form of a team, for use inside a club's own page where repeating
// the club name in every card is noise.
function teamSuffix(t) { return t || ''; }

function entryPts(e) { return (parseInt(e.G) || 0) + (parseInt(e.A) || 0); }

function entryPtsPerGame(e) {
  var gp = parseInt(e.GP) || 0;
  return gp > 0 ? (entryPts(e) / gp).toFixed(2) : '0.00';
}

function entryGA(e) { return parseInt(e.GA) || 0; }

// Shots and save percentage exist only where the league published a goalie
// table. The scoresheet shot grids are not a fallback: barely one in seven of
// them is internally consistent, so a number derived from them would be wrong
// far more often than it was right.
function entrySavePct(e) { return e['Save%'] || ''; }
function entrySavePctVal(e) { return parseFloat(e['Save%']) || 0; }
function entryShots(e) { return e.Shots != null ? e.Shots : ''; }

// GAA is the league's published figure where there is one, and goals against
// per game otherwise -- the same number whenever a goalie went the distance,
// marked so it is never mistaken for the official one.
function entryGAA(e) { return parseFloat(e.GAA) || 0; }
function entryGAADisplay(e) {
  var v = entryGAA(e).toFixed(2);
  return e.derivedGAA
    ? '<span class="derived" title="Goals against per game, from scoresheets. The league published no goalie table for this season.">' + v + '</span>'
    : v;
}


// ═══════════════════════════════════════
// VIEW 2: Club View
// ═══════════════════════════════════════
// Teams are grouped by their key, never by their name. In the older seasons
// the site gives every one of a club's teams the same name -- 18 different
// Anaheim Jr Ducks squads are all called "Anaheim Jr Ducks" in 2021 -- so
// grouping by name would fuse a whole club into a single card.

// The club view's season lives here, not in the shared bar: '' is the all-seasons
// overview (its landing), a number is that one season. The reader moves between
// them with the season badges in the overview and the "back to all seasons" link
// on a season, so the control is the page itself.
var CLUB_SEASON = '';

function initClub() {
  refreshClubOptions();
}

function refreshClubOptions() {
  const sel = document.getElementById('sel-club');
  if (!sel) return;
  const prev = sel.value;
  const present = {};
  ALL_ENTRIES.forEach(e => { if (e.club) present[e.club] = true; });
  const clubs = Object.keys(present).filter(isBrowsableClub)
    .sort((a, b) => clubDisplayName(a).localeCompare(clubDisplayName(b)));
  sel.innerHTML = '<option value="">— select —</option>';
  clubs.forEach(c => {
    const o = document.createElement('option');
    o.value = c; o.textContent = clubDisplayName(c);
    sel.appendChild(o);
  });
  if (prev && present[prev]) sel.value = prev;
}

// A new club opens on its all-seasons overview.
function onClubChange() { CLUB_SEASON = ''; renderClub(); }

// The teams a club iced in a season, as {key, team, entries}.
function clubTeams(club, season) {
  const byKey = {};
  ALL_ENTRIES.forEach(e => {
    if (e.club !== club) return;
    if (season && e.season !== season) return;
    if (!byKey[e.teamKey]) {
      byKey[e.teamKey] = {
        key: e.teamKey, season: e.season, teamId: e.teamId,
        name: e.team, short: e.teamShort, division: e.division,
        leagueId: e.leagueId, entries: []
      };
    }
    byKey[e.teamKey].entries.push(e);
  });
  return Object.keys(byKey).map(k => byKey[k])
    .sort((a, b) => a.division.localeCompare(b.division) || a.short.localeCompare(b.short));
}

function renderClub() {
  const club = document.getElementById('sel-club').value;
  const season = parseInt(CLUB_SEASON);
  const content = document.getElementById('club-content');
  updateFilterSummary();

  if (!club) {
    content.innerHTML = '<div class="empty"><div class="icon">🏒</div>Select a club above to begin.</div>';
    return;
  }
  if (!season) { renderClubOverview(club, content); return; }

  const teams = clubTeams(club, season);
  if (!teams.length) {
    content.innerHTML = `<div class="empty"><div class="icon">📭</div>${escHtml(clubDisplayName(club))} had no recorded teams in ${SEASON_LABELS[season]}.</div>`;
    return;
  }
  renderClubSeason(club, season, teams, content);
}

function renderClubOverview(club, content) {
  const rows = SEASONS.map(s => {
    const teams = clubTeams(club, s);
    const players = new Set();
    teams.forEach(t => t.entries.forEach(e => players.add(e.playerId)));
    return { season: s, teams, playerCount: players.size };
  }).filter(r => r.teams.length);

  // Newest season on top; rows stays oldest-first for the retention and flow
  // views below, which read it chronologically.
  const tableRows = rows.slice().reverse().map(r => `<tr>
    <td><span class="season-badge" style="cursor:pointer" onclick="setClubSeason(${r.season})">${SEASON_LABELS[r.season]}</span></td>
    <td class="num">${r.teams.length}</td>
    <td class="num">${r.playerCount}</td>
    <td class="roster-cell">${r.teams.map(t => `<span class="team-pill" onclick="goToTeam('${escAttr(t.key)}')">${escHtml(t.short)}</span>`).join(' ')}</td>
  </tr>`).join('');

  content.innerHTML = `
    <div class="section-heading" style="margin-bottom:20px">
      <h2>${escHtml(clubDisplayName(club))}</h2>
      <span class="badge">${rows.length} season${rows.length !== 1 ? 's' : ''} · all-time</span>
    </div>
    <div class="panel">
      <div class="panel-title">Season-by-Season Summary</div>
      <div class="table-wrap">
        <table class="club-summary">
          <thead><tr>
            <th>Season</th>
            <th style="text-align:right">Teams</th>
            <th style="text-align:right">Players</th>
            <th>Rosters</th>
          </tr></thead>
          <tbody>${tableRows}</tbody>
        </table>
      </div>
    </div>
    ${clubRetention(club, rows)}
  `;
  if (rows.length >= 2) renderClubFlow(club);
}

// Club retention & pipeline (#17). How many of a club's players come back the
// next season, and where the ones who leave turn up. Both read off the entries
// the app already holds: a player's club, season by season.
function clubRetention(club, rows) {
  if (rows.length < 2) return '';
  var setBySeason = {};
  rows.forEach(function(r) {
    var set = {};
    r.teams.forEach(function(t) { t.entries.forEach(function(e) { set[e.playerId] = true; }); });
    setBySeason[r.season] = set;
  });
  var transitions = [];
  for (var i = 0; i < rows.length - 1; i++) {
    var a = rows[i], b = rows[i + 1];
    var A = setBySeason[a.season], B = setBySeason[b.season];
    var aIds = Object.keys(A);
    var retained = aIds.filter(function(id) { return B[id]; }).length;
    // A gap is a missed calendar year, judged by start year -- season ids are
    // not always consecutive even when the seasons are.
    var ya = (APP.seasonById[a.season] || {}).startYear;
    var yb = (APP.seasonById[b.season] || {}).startYear;
    transitions.push({ from: a.season, to: b.season, start: aIds.length, retained: retained,
      rate: aIds.length ? retained / aIds.length : 0,
      newIn: Object.keys(B).filter(function(id) { return !A[id]; }).length,
      gap: (ya != null && yb != null) ? (yb - ya > 1) : false });
  }
  // Newest transition on top, matching the season-by-season summary above;
  // transitions itself stays chronological for anything reading it in order.
  var rowsHtml = transitions.slice().reverse().map(function(t) {
    var pct = Math.round(t.rate * 100);
    return '<tr><td>' + escHtml(SEASON_LABELS[t.from]) + ' &rarr; ' + escHtml(SEASON_LABELS[t.to])
      + (t.gap ? ' <span class="dr-sub">(gap)</span>' : '') + '</td>'
      + '<td class="dr-val">' + t.start + '</td><td class="dr-val">' + t.retained + '</td>'
      + '<td class="dr-share"><span class="dr-barwrap"><span class="dr-bar" style="width:' + pct + '%"></span></span><span class="dr-pct">' + pct + '%</span></td>'
      + '<td class="dr-val dr-sub">+' + t.newIn + '</td></tr>';
  }).join('');

  // Where the players came from and went is the player-flow chart, focused on
  // this club -- both directions in one picture, where the old table showed only
  // departures. Centred on the latest season the club was active, its own
  // seasons on offer.
  var actSeasons = rows.map(function(r) { return r.season; });
  var latestActive = actSeasons[actSeasons.length - 1];
  var seasonOpts = actSeasons.slice().reverse().map(function(s) {
    return '<option value="' + s + '"' + (s === latestActive ? ' selected' : '') + '>' + escHtml(SEASON_LABELS[s]) + '</option>';
  }).join('');
  var flowSection = '<div class="dr-h" style="margin-top:24px">Player movement</div>'
    + '<p class="dr-lede">The clubs this club\'s players arrived from and left for, season to season. Hover a block to trace one club.</p>'
    + '<label class="flow-season">Centre on <select id="club-flow-season" onchange="onClubFlowSeasonChange()">' + seasonOpts + '</select></label>'
    + '<div id="club-flow" style="overflow-x:auto;margin-top:12px"></div>'
    + '<div id="club-flow-legend" style="margin-top:10px"></div>';

  return '<div class="panel dr-panel"><div class="dr-h">Player retention</div>'
    + '<p class="dr-lede">How many of one season\'s players return the next &mdash; and how many are new. A roster is a single season\'s thing, so this counts the players, not the teams.</p>'
    + '<div class="table-wrap"><table class="dr-table"><thead><tr>'
    + '<th>Season change</th><th class="dr-val">Players</th><th class="dr-val">Returned</th><th>Retention</th><th class="dr-val">New</th>'
    + '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>'
    + flowSection + '</div>';
}

// The club's flow chart is drawn after its page is in the DOM, and redrawn when
// the season control moves.
function renderClubFlow(club) {
  var seasonSel = document.getElementById('club-flow-season');
  var cont = document.getElementById('club-flow');
  if (!seasonSel || !cont) return;
  renderFlowInto(cont, document.getElementById('club-flow-legend'),
    { season: parseInt(seasonSel.value), focusClub: club });
}
function onClubFlowSeasonChange() {
  renderClubFlow(document.getElementById('sel-club').value);
}

// Each team's record under the filters above.
//
// Not the league's standings row, which is what the team page shows: that
// table counts the regular season and nothing else, so it cannot answer a
// question asked with preseason ticked, or with only playoffs ticked, or with
// one league picked out of a club that plays in two. Counted off the games
// themselves instead, and only off games that were actually given a result --
// 5,375 past fixtures never were, and a team is not owed a loss for them.
//
// The season file is a fetch, so the cards render with the count they already
// have and the record arrives into them.
function fillClubRecords(club, season, teams) {
  var hosts = document.querySelectorAll('#club-content .ctc-record');
  if (!hosts.length) return;

  loadSeasonGames(season).then(function(games) {
    // The reader may have moved to another club or season while it loaded.
    if (document.getElementById('sel-club').value !== club) return;
    if (parseInt(CLUB_SEASON) !== season) return;

    var classes = classFilter();
    var league = FILTERS.league ? parseInt(FILTERS.league) : null;
    var record = {};
    teams.forEach(function(t) { record[t.teamId] = { w: 0, l: 0, t: 0, gp: 0 }; });

    Object.keys(games).forEach(function(id) {
      var g = games[id];
      if (g.hg == null || g.ag == null) return;
      if (classes && !classes[g['class']]) return;
      if (league && g.league !== league) return;
      [[g.home, g.hg, g.ag], [g.away, g.ag, g.hg]].forEach(function(side) {
        var r = record[side[0]];
        if (!r) return;
        r.gp++;
        if (side[1] > side[2]) r.w++;
        else if (side[1] < side[2]) r.l++;
        else r.t++;
      });
    });

    document.querySelectorAll('#club-content .ctc-record').forEach(function(host) {
      var r = record[parseInt(host.dataset.teamId)];
      var value = host.querySelector('strong');
      if (!r || !r.gp) {
        // A team with fixtures but no results yet is not 0-0-0; it has not
        // played, and a zeroed record reads as though it had.
        value.textContent = '—';
        value.style.color = 'var(--muted)';
        host.title = 'No games with a result under these filters';
        return;
      }
      value.textContent = r.t ? r.w + '-' + r.l + '-' + r.t : r.w + '-' + r.l;
      host.title = r.gp + (r.gp === 1 ? ' game' : ' games') + ' with a result';
      host.querySelector('small').textContent = r.t ? 'W-L-T' : 'W-L';
    });
  }).catch(function() {
    document.querySelectorAll('#club-content .ctc-record').forEach(function(host) {
      host.querySelector('strong').textContent = '—';
      host.title = 'Could not load the games for this season';
    });
  });
}

function renderClubSeason(club, season, teams, content) {
  const skaters = [];
  teams.forEach(t => t.entries.forEach(e => { if (e.type === 'skater') skaters.push(e); }));
  const players = new Set();
  teams.forEach(t => t.entries.forEach(e => players.add(e.playerId)));

  const teamCards = teams.map(t => {
    const tPlayers = new Set(t.entries.map(e => e.playerId));
    const league = APP.leagueById[t.leagueId];
    return `<div class="club-team-card" data-team-key="${escHtml(t.key)}" onclick="goToTeam('${escAttr(t.key)}')">
      <div class="ctc-name">${escHtml(t.short)}</div>
      <div class="ctc-div"><span class="div-badge">${escHtml(t.division)}</span>${league ? ` <span class="div-badge">${escHtml(league.name)}</span>` : ''}</div>
      <div class="ctc-stats">
        <span class="ctc-stat"><strong>${tPlayers.size}</strong><small>Players</small></span>
        <span class="ctc-stat ctc-record" data-team-id="${t.teamId}"><strong>·</strong><small>Record</small></span>
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="section-heading" style="margin-bottom:8px">
      <h2><span class="team-link" onclick="setClubSeason('')" title="Back to all seasons">${escHtml(clubDisplayName(club))}</span></h2>
      <span class="badge">${SEASON_LABELS[season]}</span>
    </div>
    <div class="club-totals-bar">
      <div class="ctb-item"><span class="ctb-val">${teams.length}</span><span class="ctb-lbl">Teams</span></div>
      <div class="ctb-item"><span class="ctb-val">${players.size}</span><span class="ctb-lbl">Players</span></div>
      <div class="ctb-item"><span class="ctb-val">${skaters.reduce((s, e) => s + (parseInt(e.G) || 0), 0)}</span><span class="ctb-lbl">Goals</span></div>
      <div class="ctb-item"><span class="ctb-val">${skaters.reduce((s, e) => s + (parseInt(e.A) || 0), 0)}</span><span class="ctb-lbl">Assists</span></div>
      <div class="ctb-item" style="color:var(--accent2)"><span class="ctb-val">${skaters.reduce((s, e) => s + entryPts(e), 0)}</span><span class="ctb-lbl">Points</span></div>
    </div>
    <div class="club-team-grid" id="club-team-grid">
      ${teamCards}
    </div>
    <div class="panel dr-panel">
      <div class="dr-h">Player movement</div>
      <p class="dr-lede">The clubs this club's players arrived from and left for around ${escHtml(SEASON_LABELS[season])}. Hover a block to trace one club.</p>
      <div id="club-flow" style="overflow-x:auto"></div>
      <div id="club-flow-legend" style="margin-top:10px"></div>
    </div>
  `;

  fillClubRecords(club, season, teams);
  renderFlowInto(document.getElementById('club-flow'),
    document.getElementById('club-flow-legend'), { season: season, focusClub: club });
}

function setClubSeason(season) {
  CLUB_SEASON = (season === '' || season == null) ? '' : season;
  if (CLUB_SEASON) setSeasonSelect(CLUB_SEASON);
  renderClub();
}


// ════════════════════════════════════════
// The player page + the global search bar
// ════════════════════════════════════════
// Players are addressed by id, never by name: a quarter of them share a
// display name with somebody else, so a name is a search term, not a handle.
var CURRENT_PLAYER_ID = null;
let acFocusIdx = -1;

function playerSearchIndex() {
  if (!APP._searchIndex) {
    APP._searchIndex = APP.players.map(function(p) {
      var names = [p.name].concat(p.aliases || []);
      return { id: p.id, name: p.name, hay: names.join(' ').toLowerCase() };
    }).sort(function(a, b) { return a.name.localeCompare(b.name); });
  }
  return APP._searchIndex;
}

// The last team a player appears on, which is what tells two people with the
// same name apart in a list of search results.
function lastSeenFor(playerId) {
  var best = null;
  ALL_ENTRIES.forEach(function(e) {
    if (e.playerId !== playerId) return;
    if (!best || e.season > best.season || (e.season === best.season && e.GP > best.GP)) best = e;
  });
  return best;
}

// ── Global search ───────────────────────────────────────────────────────────
// The header bar searches players, clubs and divisions at once. A single query
// can match all three, so results are grouped under a heading each and capped
// per type -- a common run of letters in 3,000 player names can never bury the
// handful of clubs or divisions that also match.
var GLOBAL_RESULTS = [];
var TYPE_LABEL = { division: 'Divisions', club: 'Clubs', player: 'Players' };
var TYPE_ORDER = ['division', 'club', 'player'];
var TYPE_CAP   = { division: 6, club: 6, player: 20 };

// Players come from the same index the old lookup used; clubs from APP.clubs;
// divisions from the schedule's own filter list, so a picked division is always
// a value that filter recognises. Divisions arrive once the schedule has
// loaded, so the index is only cached as complete after they are present.
function globalSearchIndex() {
  var divSel = document.getElementById('sel-sched-div');
  var divReady = !!(divSel && divSel.options.length > 1);
  if (APP._globalIdx && APP._globalDivReady) return APP._globalIdx;
  var items = [];
  playerSearchIndex().forEach(function(p) {
    items.push({ type: 'player', id: p.id, name: p.name, hay: p.hay });
  });
  (APP.clubs || []).forEach(function(name) {
    var disp = clubDisplayName(name);
    items.push({ type: 'club', id: name, name: disp,
                 hay: (disp + ' ' + name).toLowerCase() });
  });
  if (divReady) {
    Array.prototype.forEach.call(divSel.options, function(o) {
      if (!o.value) return;
      items.push({ type: 'division', id: o.value, name: o.value,
                   hay: o.value.toLowerCase() });
    });
  }
  APP._globalIdx = items;
  APP._globalDivReady = divReady;
  return items;
}

function onGlobalSearch() {
  var q = document.getElementById('global-search').value.trim().toLowerCase();
  var list = document.getElementById('global-ac');
  acFocusIdx = -1;
  GLOBAL_RESULTS = [];
  if (!q) { list.style.display = 'none'; return; }
  var hits = globalSearchIndex().filter(function(it) { return it.hay.indexOf(q) !== -1; });
  // A name that starts with the query beats one that merely contains it, so
  // "cup" surfaces Cupertino ahead of a name with those letters mid-word.
  hits.sort(function(a, b) {
    var ap = a.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
    var bp = b.name.toLowerCase().indexOf(q) === 0 ? 0 : 1;
    return ap - bp || a.name.localeCompare(b.name);
  });
  var byType = { division: [], club: [], player: [] };
  hits.forEach(function(it) {
    if (byType[it.type].length < TYPE_CAP[it.type]) byType[it.type].push(it);
  });
  var html = '';
  TYPE_ORDER.forEach(function(t) {
    if (!byType[t].length) return;
    html += '<div class="ac-group">' + TYPE_LABEL[t] + '</div>';
    byType[t].forEach(function(it) {
      var idx = GLOBAL_RESULTS.length;
      GLOBAL_RESULTS.push(it);
      html += renderGlobalItem(it, idx);
    });
  });
  if (!html) { list.style.display = 'none'; return; }
  list.innerHTML = html;
  list.style.display = 'block';
}

function renderGlobalItem(it, idx) {
  var main, sub;
  if (it.type === 'player') {
    var player = APP.playerById[it.id];
    var seasons = [...new Set(player.seasons.map(function(s) { return s.season; }))].sort();
    var last = lastSeenFor(it.id);
    sub = (seasons.length ? seasons.map(function(s) { return SEASON_LABELS[s]; }).join(', ') : 'no games counted')
        + (last ? ' · ' + last.team : '');
    main = escHtml(it.name) + bornLabel(it.id);
  } else {
    main = escHtml(it.name);
    sub = it.type === 'club' ? 'Club page' : 'Schedule';
  }
  return '<div class="autocomplete-item" onclick="pickGlobalAt(' + idx + ')"><span>'
    + main + '</span><span class="ac-sub">' + escHtml(sub) + '</span></div>';
}

// Results carry no user text into the onclick -- they are addressed by their
// slot in GLOBAL_RESULTS, so a club or division name with a quote in it can
// never break the markup or the routing.
function pickGlobalAt(idx) {
  var it = GLOBAL_RESULTS[idx];
  if (!it) return;
  document.getElementById('global-ac').style.display = 'none';
  document.getElementById('global-search').value = it.name;
  if (it.type === 'player') goToPlayer(it.id);
  else if (it.type === 'club') goToClub(it.id);
  else if (it.type === 'division') goToScheduleDivision(it.id);
}

function onGlobalKey(e) {
  var list = document.getElementById('global-ac');
  var items = list.querySelectorAll('.autocomplete-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') { acFocusIdx = Math.min(acFocusIdx + 1, items.length - 1); items.forEach(function(el, i) { el.classList.toggle('focused', i === acFocusIdx); }); if (items[acFocusIdx]) items[acFocusIdx].scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { acFocusIdx = Math.max(acFocusIdx - 1, 0); items.forEach(function(el, i) { el.classList.toggle('focused', i === acFocusIdx); }); if (items[acFocusIdx]) items[acFocusIdx].scrollIntoView({ block: 'nearest' }); e.preventDefault(); }
  else if (e.key === 'Enter' && acFocusIdx >= 0) items[acFocusIdx].click();
  else if (e.key === 'Escape') list.style.display = 'none';
}
document.addEventListener('click', function(e) {
  if (!e.target.closest('.global-search')) document.getElementById('global-ac').style.display = 'none';
});

function goToPlayer(playerId) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  markTab('player');
  document.getElementById('view-player').classList.add('active');
  // The filter bar reads this to decide which of its controls mean anything
  // here. Without it a player reached from the schedule keeps the schedule's
  // rules, which hide "Games counted" -- a filter still applying, with its
  // control taken away.
  markActiveView('player');
  document.getElementById('global-ac').style.display = 'none';
  history.pushState({ view: 'player', playerId: playerId }, '');
  renderPlayerHistory(playerId);
}

// Land on the schedule with a division picked -- there is no division page, and
// the schedule is where a division reads as itself: who it plays and when.
function goToScheduleDivision(divName) {
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  markTab('schedule');
  document.getElementById('view-schedule').classList.add('active');
  markActiveView('schedule');
  var divSel = document.getElementById('sel-sched-div');
  if (divSel) divSel.value = divName;
  // Clear the club filter so the division is not silently narrowed to whatever
  // club happened to be set.
  var clubSel = document.getElementById('sel-sched-club');
  if (clubSel) clubSel.value = '';
  renderSchedule();
  history.pushState(captureAppState('schedule'), '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════
// VIEW 2b: Division report
// ════════════════════════════════════════
// One division, one season, read whole: who scores on special teams, how much
// of each team leans on one player, home-and-away records, and the pairs who
// keep scoring together. Everything but the chemistry graph is already in the
// entries the app built at load; that one file loads on demand.
var DR = { season: null, token: 0 };

// Draw the four division panels into a container, from entries already scoped to
// one division, one league and one season. A token guards the two async panels
// so a fast switch to another division cannot let a stale draw land in the new.
function renderDivisionInto(container, entries, season) {
  var teams = {};
  entries.forEach(function(e) {
    if (!teams[e.teamKey]) {
      teams[e.teamKey] = { key: e.teamKey, id: e.teamId, club: e.club, short: e.teamShort };
    }
  });
  // Inside one division the label the app usually shows -- the level, "13U AAA"
  // -- is the same for every team, so the club tells them apart; the full name
  // is only needed when a club fields two teams here.
  var clubCount = {};
  Object.keys(teams).forEach(function(k) { var c = teams[k].club || ''; clubCount[c] = (clubCount[c] || 0) + 1; });
  DR.season = season;
  DR.token = (DR.token || 0) + 1;
  var token = DR.token;
  DR.teamLabels = {};
  Object.keys(teams).forEach(function(k) {
    var t = teams[k], obj = APP.teamByKey[k];
    if (t.club && clubCount[t.club] === 1) t.label = clubDisplayName(t.club);
    else t.label = obj ? teamName(obj) : (clubDisplayName(t.club) || t.short);
    DR.teamLabels[k] = t.label;
  });

  container.innerHTML = drSpecialTeams(entries) + drScoringBalance(entries)
    + '<div class="panel dr-panel" id="dr-homeice"><div class="dr-h">Home ice</div>'
    + '<p class="dr-loading">Working out home and away records.</p></div>'
    + '<div class="panel dr-panel" id="dr-chem"><div class="dr-h">Line chemistry</div>'
    + '<p class="dr-loading">Loading goals to find the pairs who score together.</p></div>';
  drRenderHomeIce(season, teams, token);
  drRenderChemistry(season, teams, token);
}

// The team's name as this division shows it -- the club, since the level is the
// same down every row. Falls back to the app's usual name off the report.
function drTeamName(key) {
  if (DR.teamLabels && DR.teamLabels[key]) return DR.teamLabels[key];
  var t = APP.teamByKey[key];
  return t ? teamName(t) : '';
}

// A short ranked list of players, one stat.
function drMiniTable(title, rows, statHead, statFn) {
  if (!rows.length) {
    return '<div class="dr-card"><div class="panel-title">' + title + '</div>'
      + '<p class="dr-none">None recorded.</p></div>';
  }
  var body = rows.map(function(e, i) {
    return '<tr><td class="dr-rk">' + (i + 1) + '</td>'
      + '<td><span class="team-link" onclick="goToPlayer(' + e.playerId + ')">' + escHtml(e.playerName) + '</span>' + jerseyLabel(e.jersey) + bornLabel(e.playerId) + '</td>'
      + '<td><span class="team-link" onclick="goToTeam(\'' + escAttr(e.teamKey) + '\')">' + escHtml(drTeamName(e.teamKey)) + '</span></td>'
      + '<td class="dr-val">' + statFn(e) + '</td></tr>';
  }).join('');
  return '<div class="dr-card"><div class="panel-title">' + title + '</div>'
    + '<div class="table-wrap"><table class="dr-table"><thead><tr>'
    + '<th class="dr-rk">Rk</th><th>Player</th><th>Team</th><th class="dr-val">' + statHead + '</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

function drSpecialTeams(entries) {
  var sk = entries.filter(function(e) { return e.type === 'skater'; });
  var pp = sk.filter(function(e) { return (e.PPG || 0) > 0; })
    .sort(function(a, b) { return b.PPG - a.PPG || entryPts(b) - entryPts(a); }).slice(0, 12);
  var sh = sk.filter(function(e) { return (e.SHG || 0) > 0; })
    .sort(function(a, b) { return b.SHG - a.SHG || entryPts(b) - entryPts(a); }).slice(0, 10);
  return '<div class="panel dr-panel"><div class="dr-h">Special teams</div>'
    + '<p class="dr-lede">Goals scored on the power play and short-handed. The scoresheet flags the strength automatically, so these counts are trustworthy.</p>'
    + '<div class="dr-two">'
    + drMiniTable('Power-play goals', pp, 'Goals', function(e) { return e.PPG; })
    + drMiniTable('Short-handed goals', sh, 'Goals', function(e) { return e.SHG; })
    + '</div></div>';
}

function drScoringBalance(entries) {
  var byTeam = {};
  entries.forEach(function(e) {
    if (e.type !== 'skater') return;
    var t = byTeam[e.teamKey] || (byTeam[e.teamKey] = { key: e.teamKey, label: drTeamName(e.teamKey), goals: 0, scorers: 0, top: null });
    t.goals += (e.G || 0);
    if ((e.G || 0) > 0) t.scorers++;
    if (!t.top || (e.G || 0) > t.top.G) t.top = { name: e.playerName, id: e.playerId, G: e.G || 0, jersey: e.jersey };
  });
  var rows = Object.keys(byTeam).map(function(k) { return byTeam[k]; })
    .filter(function(t) { return t.goals > 0; })
    .map(function(t) { t.share = t.top ? t.top.G / t.goals : 0; return t; })
    .sort(function(a, b) { return b.share - a.share; });
  if (!rows.length) return '';
  var body = rows.map(function(t) {
    var pct = Math.round(t.share * 100);
    return '<tr><td><span class="team-link" onclick="goToTeam(\'' + escAttr(t.key) + '\')">' + escHtml(t.label) + '</span></td>'
      + '<td class="dr-val">' + t.goals + '</td>'
      + '<td>' + (t.top ? '<span class="team-link" onclick="goToPlayer(' + t.top.id + ')">' + escHtml(t.top.name) + '</span>' + jerseyLabel(t.top.jersey) + ' <span class="dr-sub">' + t.top.G + 'g</span>' : '&mdash;') + '</td>'
      + '<td class="dr-val">' + t.scorers + '</td>'
      + '<td class="dr-share"><span class="dr-barwrap"><span class="dr-bar" style="width:' + pct + '%"></span></span><span class="dr-pct">' + pct + '%</span></td></tr>';
  }).join('');
  return '<div class="panel dr-panel"><div class="dr-h">Scoring balance</div>'
    + '<p class="dr-lede">How much of each team\'s offence runs through its top scorer &mdash; a high share is a one-line team, a low one spreads it around.</p>'
    + '<div class="table-wrap"><table class="dr-table"><thead><tr>'
    + '<th>Team</th><th class="dr-val">Goals</th><th>Top scorer</th><th class="dr-val">Scorers</th><th>Top-scorer share</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

// Home ice needs the schedule file. Each team in the division is scored on its
// own games, split by where they were played; the class filter is applied so
// the record matches whatever game types are ticked above.
function drRenderHomeIce(season, teams, token) {
  loadSchedule().then(function(rows) {
    var host = document.getElementById('dr-homeice');
    if (!host || DR.token !== token) return;
    var classes = classFilter();
    var rec = {};
    Object.keys(teams).forEach(function(k) {
      rec[teams[k].id] = { label: teams[k].label, key: teams[k].key,
        home: { w: 0, l: 0, t: 0, gf: 0, ga: 0 }, away: { w: 0, l: 0, t: 0, gf: 0, ga: 0 } };
    });
    rows.forEach(function(g) {
      if (g.season !== season || g.hg == null || g.ag == null) return;
      if (classes && !classes[g.cls]) return;
      [['home', g.home, g.hg, g.ag], ['away', g.away, g.ag, g.hg]].forEach(function(spec) {
        var r = rec[spec[1]];
        if (!r) return;
        var slot = r[spec[0]], gf = spec[2], ga = spec[3];
        slot.gf += gf; slot.ga += ga;
        if (gf > ga) slot.w++; else if (gf < ga) slot.l++; else slot.t++;
      });
    });
    function played(s) { return s.w + s.l + s.t; }
    function winPct(s) { var n = played(s); return n ? (s.w + s.t * 0.5) / n : 0; }
    var list = Object.keys(rec).map(function(id) { return rec[id]; })
      .filter(function(r) { return played(r.home) + played(r.away) > 0; });
    // An edge only means something with games on both sides -- a team that has
    // only played at home has not shown a home advantage, just a home schedule.
    list.forEach(function(r) {
      r.edge = (played(r.home) && played(r.away)) ? winPct(r.home) - winPct(r.away) : null;
    });
    list.sort(function(a, b) {
      if ((a.edge == null) !== (b.edge == null)) return a.edge == null ? 1 : -1;
      if (a.edge == null) return played(b.home) + played(b.away) - (played(a.home) + played(a.away));
      return b.edge - a.edge;
    });
    if (!list.length) {
      host.innerHTML = '<div class="dr-h">Home ice</div><p class="dr-none">No played games yet.</p>';
      return;
    }
    function rec3(s) { return s.w + '-' + s.l + '-' + s.t; }
    var body = list.map(function(r) {
      var edgeCell, cls = '';
      if (r.edge == null) { edgeCell = '&mdash;'; }
      else {
        var edgePct = Math.round(r.edge * 100);
        cls = r.edge > 0.005 ? 'dr-pos' : (r.edge < -0.005 ? 'dr-neg' : '');
        edgeCell = (edgePct > 0 ? '+' : '') + edgePct;
      }
      return '<tr><td><span class="team-link" onclick="goToTeam(\'' + escAttr(r.key) + '\')">' + escHtml(r.label) + '</span></td>'
        + '<td class="dr-val">' + rec3(r.home) + '</td><td class="dr-val dr-sub">' + r.home.gf + '&ndash;' + r.home.ga + '</td>'
        + '<td class="dr-val">' + rec3(r.away) + '</td><td class="dr-val dr-sub">' + r.away.gf + '&ndash;' + r.away.ga + '</td>'
        + '<td class="dr-val ' + cls + '">' + edgeCell + '</td></tr>';
    }).join('');
    host.innerHTML = '<div class="dr-h">Home ice</div>'
      + '<p class="dr-lede">Each team\'s record at home and on the road (W-L-T, then goals for&ndash;against), sorted by the size of their home-ice edge in win percentage.</p>'
      + '<div class="table-wrap"><table class="dr-table"><thead><tr>'
      + '<th>Team</th><th class="dr-val">Home</th><th class="dr-val">GF&ndash;GA</th><th class="dr-val">Away</th><th class="dr-val">GF&ndash;GA</th><th class="dr-val">Edge</th>'
      + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  });
}

// Line chemistry (#16): the pairs who combine for goals, built from the season's
// goal events. A pair is one player's goal and another's assist on it, counted
// in both directions -- the same scorer↔assister signal the player page uses,
// aggregated across the whole division. Only goals scored by a division team
// count, and only the ticked game types.
function drRenderChemistry(season, teams, token) {
  loadSeasonGames(season).then(function(games) {
    var host = document.getElementById('dr-chem');
    if (!host || DR.token !== token) return;
    var classes = classFilter();
    var byId = {};
    Object.keys(teams).forEach(function(k) { byId[teams[k].id] = teams[k]; });
    var pairs = {};
    Object.keys(games).forEach(function(id) {
      var g = games[id];
      if (classes && !classes[g['class']]) return;
      (g.goals || []).forEach(function(goal) {
        var tm = byId[goal.side === 'home' ? g.home : g.away];
        if (!tm) return;
        var by = goal.by, assists = goal.assists || [];
        if (by == null || !assists.length) return;
        assists.forEach(function(a) {
          if (a == null || a === by) return;
          var key = Math.min(by, a) + '|' + Math.max(by, a);
          var p = pairs[key] || (pairs[key] = { a: Math.min(by, a), b: Math.max(by, a), n: 0, teamKey: tm.key });
          p.n++;
        });
      });
    });
    var list = Object.keys(pairs).map(function(k) { return pairs[k]; })
      .sort(function(x, y) { return y.n - x.n; }).slice(0, 15);
    if (!list.length) {
      host.innerHTML = '<div class="dr-h">Line chemistry</div><p class="dr-none">No assisted goals recorded yet.</p>';
      return;
    }
    var body = list.map(function(p, i) {
      var na = (APP.playerById[p.a] || {}).name || ('#' + p.a);
      var nb = (APP.playerById[p.b] || {}).name || ('#' + p.b);
      return '<tr><td class="dr-rk">' + (i + 1) + '</td>'
        + '<td><span class="team-link" onclick="goToPlayer(' + p.a + ')">' + escHtml(na) + '</span>' + bornLabel(p.a)
        + ' <span class="dr-amp">&harr;</span> <span class="team-link" onclick="goToPlayer(' + p.b + ')">' + escHtml(nb) + '</span>' + bornLabel(p.b) + '</td>'
        + '<td><span class="team-link" onclick="goToTeam(\'' + escAttr(p.teamKey) + '\')">' + escHtml(drTeamName(p.teamKey)) + '</span></td>'
        + '<td class="dr-val">' + p.n + '</td></tr>';
    }).join('');
    host.innerHTML = '<div class="dr-h">Line chemistry</div>'
      + '<p class="dr-lede">The pairs who combine most for goals &mdash; one scored, the other assisted, counted both ways. Assists are recorded on about 71% of goals, so these are a floor.</p>'
      + '<div class="table-wrap"><table class="dr-table"><thead><tr>'
      + '<th class="dr-rk">Rk</th><th>Pair</th><th>Team</th><th class="dr-val">Goals together</th>'
      + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  });
}

// Kept for history entries written before the team page existed.
function goToBrowseTeam(key) {
  const match = ALL_ENTRIES.filter(e => e.teamKey === key)[0];
  if (!match) return;
  document.querySelectorAll('.view').forEach(function(el) { el.classList.remove('active'); });
  markTab('browse');
  document.getElementById('view-browse').classList.add('active');
  markActiveView('browse');
  document.getElementById('sel-season').value = match.season;
  onSeasonChange();
  if (match.division) document.getElementById('sel-div-browse').value = match.division;
  onDivBrowseChange();
  if (match.club) document.getElementById('sel-club-browse').value = match.club;
  onBrowseRender();
  history.pushState({
    view: 'browse', season: String(match.season), club: match.club, div: match.division,
    type: document.getElementById('sel-type').value,
    minGP: document.getElementById('sel-min-gp').value
  }, '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// A season whose every game is preseason or exhibition disappears completely
// under the default "Regular + Playoffs" -- section, stats and all. In August
// that is every season that has just started, so a parent looking for the game
// they watched on the weekend finds nothing, and an absent section reads
// exactly like a collection failure. Name what is being held back instead.
function hiddenSeasonsFor(player, shownSeasons) {
  var shown = {};
  shownSeasons.forEach(function(s) { shown[s] = true; });
  var kinds = {}, seasons = [];

  (player.seasons || []).forEach(function(s) {
    if (shown[s.season]) return;
    // The seasons passed in were built with no league filter and every team
    // ticked, so anything missing from them is missing for one reason, and
    // this is it. A team the reader unticked never reaches here.
    if (!teamFor(s.season, s.team)) return;
    if (seasons.indexOf(s.season) === -1) seasons.push(s.season);
    kinds[s['class']] = true;
  });
  seasons.sort(function(a, b) { return a - b; });
  return { seasons: seasons, kinds: Object.keys(kinds).sort() };
}

function joinList(items, conjunction) {
  if (items.length < 2) return items[0] || '';
  return items.slice(0, -1).join(', ') + ' ' + (conjunction || 'and') + ' '
    + items[items.length - 1];
}

function hiddenSeasonNote(player, shownSeasons) {
  var hidden = hiddenSeasonsFor(player, shownSeasons);
  if (!hidden.seasons.length) return '';
  var many = hidden.seasons.length > 1;
  // The classes that hid these seasons are, by definition, the unticked ones,
  // so the note can point straight at the boxes to tick.
  // In the dataset's own order, not alphabetical: "regular, playoff, preseason"
  // is the order these are named everywhere else in the app.
  var kinds = (APP.gameClasses || hidden.kinds)
    .filter(function(c) { return hidden.kinds.indexOf(c) !== -1; })
    .map(filterClassLabel);
  return '<div class="season-hidden"><strong>'
    + escHtml(joinList(hidden.seasons.map(function(s) { return SEASON_LABELS[s]; })))
    + '</strong> ' + (many ? 'are' : 'is') + ' not shown. Every game '
    + (many ? 'in them is ' : 'in it is ')
    + escHtml(joinList(kinds, 'or').toLowerCase())
    + ', and ' + (kinds.length > 1 ? 'those are' : 'that is')
    + ' unticked under <em>Games counted</em>. '
    + '<button class="note-link" onclick="showAllGameClasses()">Count every game</button>'
    + '</div>';
}

function showAllGameClasses() {
  document.querySelectorAll('#gameclass-boxes input').forEach(function(box) {
    box.checked = true;
  });
  onFilterChange();
}

// The class lists are ticked by their own boxes everywhere else; this is the
// one place that sets them from outside, so it repaints too.

// Which of a player's own teams are ticked. Reset whenever the page moves to
// a different player: the list is theirs, and so is the state.
var PLAYER_TEAMS = { playerId: null, ticked: {} };

// The same team across two seasons is one entry, not two -- a player who
// stayed put for two years played for one team and should be able to say so
// with one box. Club plus the team's own name identifies it: the division can
// move underneath a team ("14U AA East" one year, "14U AA" the next) while the
// squad is unchanged, and two squads in one club are told apart by their names
// ("12-1", "12-2") rather than by anything else the site prints.
function teamGroupKey(entry) {
  return entry.club + '|' + (entry.teamShort || entry.team);
}

function playerTeamGroups(entries) {
  var byKey = {}, groups = [];
  entries.forEach(function(e) {
    var key = teamGroupKey(e);
    var group = byKey[key];
    if (!group) {
      group = byKey[key] = { key: key, label: e.team, seasons: [], newest: e.season };
      groups.push(group);
    }
    if (group.seasons.indexOf(e.season) === -1) group.seasons.push(e.season);
    // Name the group as its most recent season names it: a club that renames
    // a team should be read by what it is called now.
    if (e.season > group.newest) { group.newest = e.season; group.label = e.team; }
  });
  groups.forEach(function(g) { g.seasons.sort(function(a, b) { return b - a; }); });
  groups.sort(function(a, b) { return b.newest - a.newest || a.label.localeCompare(b.label); });
  return groups;
}

function teamBoxes(groups) {
  if (groups.length < 2) return '';
  return '<div class="team-boxes"><span class="team-boxes-label">Teams</span>'
    + groups.map(function(g) {
        var seasons = g.seasons.map(function(s) { return SEASON_LABELS[s]; }).join(', ');
        return '<label class="team-box" title="' + escHtml(seasons) + '">'
          + '<input type="checkbox" value="' + escHtml(g.key) + '"'
          + (PLAYER_TEAMS.ticked[g.key] ? ' checked' : '')
          + ' onchange="onPlayerTeamsChange()"><span>' + escHtml(g.label) + '</span></label>';
      }).join('')
    + '</div>';
}

function onPlayerTeamsChange() {
  var ticked = {};
  document.querySelectorAll('.team-boxes input:checked').forEach(function(box) {
    ticked[box.value] = true;
  });
  PLAYER_TEAMS.ticked = ticked;
  renderPlayerHistory(PLAYER_TEAMS.playerId);
}

function renderPlayerHistory(playerId) {
  CURRENT_PLAYER_ID = playerId;
  const player = APP.playerById[playerId];
  const content = document.getElementById('player-content');
  if (!player) { content.innerHTML = '<div class="empty"><div class="icon">❌</div>Player not found.</div>'; return; }

  // The player's whole history under the class filter, with no league applied:
  // the team boxes below are what narrows it, and they can only be honest if
  // they are listing every team there is.
  const everyEntry = entriesForPlayer(player, classFilter(), null);
  const groups = playerTeamGroups(everyEntry);
  if (PLAYER_TEAMS.playerId !== playerId) {
    PLAYER_TEAMS = { playerId: playerId, ticked: {} };
    groups.forEach(function(g) { PLAYER_TEAMS.ticked[g.key] = true; });
  }

  const header = '<div class="player-history-header"><h2>' + escHtml(player.name) + bornLabel(playerId) + '</h2></div>';
  // Computed before the team boxes narrow anything: a season the reader has
  // deliberately unticked is not one the page owes an explanation for.
  const classNote = hiddenSeasonNote(player, [...new Set(everyEntry.map(e => e.season))]);

  const entries = everyEntry.filter(e => PLAYER_TEAMS.ticked[teamGroupKey(e)]);
  if (!entries.length) {
    content.innerHTML = header + teamBoxes(groups)
      + '<div class="empty"><div class="icon">📭</div>'
      + (everyEntry.length ? 'No teams ticked.' : 'No games match the current filters.')
      + '</div>' + classNote;
    return;
  }

  const skaterEntries = entries.filter(e => e.type === 'skater');
  const goalieEntries = entries.filter(e => e.type === 'goalie');
  // Newest first. A player page is read about the season the player is in
  // now, and a team held for two years shows its more recent one first.
  const seasons = [...new Set(entries.map(e => e.season))].sort((a, b) => b - a);
  const isTwoWay = skaterEntries.length > 0 && goalieEntries.length > 0;
  const isGoalie = goalieEntries.length > 0;
  const sum = (list, f) => list.reduce((s, e) => s + (f(e) || 0), 0);
  const totalGP = sum(skaterEntries, e => parseInt(e.GP));
  const totalG = sum(skaterEntries, e => parseInt(e.G));
  const totalA = sum(skaterEntries, e => parseInt(e.A));
  const totalPts = sum(skaterEntries, entryPts);
  const totalPIM = sum(skaterEntries, e => parseInt(e.PIM));
  const totalPPG = sum(skaterEntries, e => parseInt(e.PPG));
  const totalSHG = sum(skaterEntries, e => parseInt(e.SHG));
  const goalieGP = sum(goalieEntries, e => parseInt(e.GP));
  const goalieGA = sum(goalieEntries, entryGA);

  let summaryCards = '';
  if (skaterEntries.length) {
    summaryCards = '<div class="stat-summary">'
      + '<div class="stat-card"><div class="stat-val">' + seasons.length + '</div><div class="stat-lbl">Seasons</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + totalGP + '</div><div class="stat-lbl">Skater GP</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + totalG + '</div><div class="stat-lbl">Goals</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + totalA + '</div><div class="stat-lbl">Assists</div></div>'
      + '<div class="stat-card"><div class="stat-val" style="color:var(--accent2)">' + totalPts + '</div><div class="stat-lbl">Points</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + totalPIM + '</div><div class="stat-lbl">PIM</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + totalPPG + '</div><div class="stat-lbl">PP Goals</div></div>'
      + (totalSHG ? '<div class="stat-card"><div class="stat-val">' + totalSHG + '</div><div class="stat-lbl">SH Goals</div></div>' : '')
      + (isTwoWay ? '<div class="stat-card"><div class="stat-val">' + goalieGP + '</div><div class="stat-lbl">Goalie GP</div></div>'
        + '<div class="stat-card"><div class="stat-val">' + goalieGA + '</div><div class="stat-lbl">Goals Allowed</div></div>' : '')
      + '</div>';
  } else if (goalieEntries.length) {
    const shots = sum(goalieEntries, e => parseInt(e.Shots));
    summaryCards = '<div class="stat-summary">'
      + '<div class="stat-card"><div class="stat-val">' + seasons.length + '</div><div class="stat-lbl">Seasons</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + goalieGP + '</div><div class="stat-lbl">Career GP</div></div>'
      + '<div class="stat-card"><div class="stat-val">' + goalieGA + '</div><div class="stat-lbl">Goals Allowed</div></div>'
      + (shots ? '<div class="stat-card"><div class="stat-val">' + shots + '</div><div class="stat-lbl">Shots Faced</div></div>' : '')
      + '</div>';
  }

  const aliasNote = (player.aliases && player.aliases.length)
    ? '<div class="alias-note">Also listed as ' + player.aliases.map(escHtml).join(', ') + '</div>' : '';

  const R = 'style="text-align:right"';
  const teamLink = e => '<span class="team-link" onclick="goToTeam(\'' + escAttr(e.teamKey) + '\')">' + escHtml(e.team) + '</span>';
  const skaterRow = e =>
    '<tr>'
    + '<td>' + teamLink(e) + '</td>'
    + '<td><span class="div-badge">' + escHtml(e.division || '') + '</span></td>'
    + '<td class="jersey">' + escHtml(e.jersey) + '</td>'
    + '<td class="num">' + (e.GP || 0) + '</td>'
    + '<td class="num">' + (e.G || 0) + '</td>'
    + '<td class="num">' + (e.A || 0) + '</td>'
    + '<td class="num pts">' + entryPts(e) + '</td>'
    + '<td class="num">' + (e.PIM || 0) + '</td>'
    + '<td class="num">' + (e.PPG || 0) + '</td>'
    + '<td class="num">' + entryPtsPerGame(e) + '</td>'
    + '</tr>';
  const goalieRow = e =>
    '<tr class="goalie-row">'
    + '<td>' + teamLink(e) + '</td>'
    + '<td><span class="div-badge">' + escHtml(e.division || '') + '</span></td>'
    + '<td class="jersey">' + escHtml(e.jersey) + '</td>'
    + '<td class="num">' + (e.GP || 0) + '</td>'
    + '<td class="num">' + entryShots(e) + '</td>'
    + '<td class="num">' + entryGA(e) + '</td>'
    + '<td class="num">' + entryGAADisplay(e) + '</td>'
    + '<td class="num" style="color:var(--green)">' + (entrySavePct(e) || '—') + '</td>'
    + '<td class="num">' + (e.SO != null ? e.SO : '') + '</td>'
    + '<td></td>'
    + '</tr>';

  const CG = '<colgroup>'
    + '<col style="width:25%"><col style="width:10%"><col style="width:5%">'
    + '<col style="width:7%"><col style="width:8%"><col style="width:8%">'
    + '<col style="width:9%"><col style="width:9%"><col style="width:8%"><col style="width:11%">'
    + '</colgroup>';

  const seasonSections = seasons.map(s => {
    const sEntries = entries.filter(e => e.season === s);
    const skaters = sEntries.filter(e => e.type === 'skater').sort((a, b) => (parseInt(b.GP) || 0) - (parseInt(a.GP) || 0));
    const goalies = sEntries.filter(e => e.type === 'goalie').sort((a, b) => (parseInt(b.GP) || 0) - (parseInt(a.GP) || 0));

    let body = '';
    if (skaters.length && goalies.length) {
      body = '<div class="table-wrap"><table class="ph-table">' + CG
        + '<thead><tr>'
        + '<th>Team</th><th>Division</th><th>#</th>'
        + '<th ' + R + '>GP</th><th ' + R + '>G</th><th ' + R + '>A</th><th ' + R + '>PTS</th>'
        + '<th ' + R + '>PIM</th><th ' + R + '>PPG</th><th ' + R + '>Pts/GP</th>'
        + '</tr></thead>'
        + '<tbody>'
        + skaters.map(skaterRow).join('')
        + '<tr class="ph-section-divider"><td colspan="10">🥅 GOALIE STATS</td></tr>'
        + '<tr class="ph-goalie-subhdr">'
        + '<td></td><td></td><td></td>'
        + '<td>GP</td><td>Shots</td><td>GA</td><td>GAA</td><td>Save%</td><td>SO</td><td></td>'
        + '</tr>'
        + goalies.map(goalieRow).join('')
        + '</tbody></table></div>';
    } else if (skaters.length) {
      body = '<div class="table-wrap"><table class="ph-table">' + CG
        + '<thead><tr>'
        + '<th>Team</th><th>Division</th><th>#</th>'
        + '<th ' + R + '>GP</th><th ' + R + '>G</th><th ' + R + '>A</th><th ' + R + '>PTS</th>'
        + '<th ' + R + '>PIM</th><th ' + R + '>PPG</th><th ' + R + '>Pts/GP</th>'
        + '</tr></thead>'
        + '<tbody>' + skaters.map(skaterRow).join('') + '</tbody></table></div>';
    } else if (goalies.length) {
      body = '<div class="table-wrap"><table class="ph-table">' + CG
        + '<thead><tr>'
        + '<th>Team</th><th>Division</th><th>#</th>'
        + '<th ' + R + '>GP</th><th ' + R + '>Shots</th><th ' + R + '>GA</th><th ' + R + '>GAA</th>'
        + '<th ' + R + '>Save%</th><th ' + R + '>SO</th><th></th>'
        + '</tr></thead>'
        + '<tbody>' + goalies.map(goalieRow).join('') + '</tbody></table></div>';

    return '<div class="season-section" data-season="' + s + '"><div class="season-section-header">'
