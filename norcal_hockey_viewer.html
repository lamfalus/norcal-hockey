function rebuildSchedClubs() {
  var clubSel = document.getElementById('sel-sched-club');
  if (!clubSel || !SCHEDULE.rows) return;
  var div = document.getElementById('sel-sched-div').value;
  var prev = clubSel.value;
  var clubs = {};
  SCHEDULE.rows.forEach(function(g) {
    if (!schedFilterScope(g)) return;
    ['home', 'away'].forEach(function(side) {
      // With a division chosen, only the side actually in it counts -- not its
      // cross-division opponent, the same rule the filter itself now uses.
      if (div && schedSideDivision(g, side) !== div) return;
      var id = side === 'home' ? g.home : g.away;
      if (id == null) return;
      var team = APP.teamByKey[teamKey(g.season, id)];
      if (team && team.club && isBrowsableClub(team.club)) clubs[team.club] = true;
    });
  });
  var names = Object.keys(clubs).sort(function(a, b) { return clubDisplayName(a).localeCompare(clubDisplayName(b)); });
  clubSel.innerHTML = '<option value="">&mdash; all &mdash;</option>'
    + names.map(function(c) { return '<option value="' + escAttr(c) + '">' + escHtml(clubDisplayName(c)) + '</option>'; }).join('');
  clubSel.value = (prev && clubs[prev]) ? prev : '';
}

// Division narrows the club list, then the schedule redraws.
function onSchedDivChange() {
  rebuildSchedClubs();
  renderSchedule();
}

// ── Filtering ─────────────────────────────────────────────────────────────
function schedClubOf(g, side) {
  var id = side === 'home' ? g.home : g.away;
  if (id == null) return null;
  var team = APP.teamByKey[teamKey(g.season, id)];
  return team ? team.club : null;
}

// An empty bracket slot -- "14AAA Seed 1" against "14AAA Seed 4" -- is a shape
// the playoff draw printed before it knew who was in it. 238 of them, all in
// CAHA Playoffs, and not one was ever given a result or a real team: a seed
// slot cannot appear on anybody's schedule, so it does not appear on this one.
//
// Note this is not the same thing as a game with no team id. Those 92 are the
// ambiguous_team cases -- same club against itself, named on both sides, 32 of
// them with a full box score -- and they stay.
function isEmptyBracket(g) {
  return ['home', 'away'].some(function(side) {
    var club = schedClubOf(g, side);
    var known = club ? APP.clubByName[club] : null;
    return known ? known.kind === 'bracket' : false;
  });
}

function schedulePasses(g, classes) {
  if (isEmptyBracket(g)) return false;
  if (FILTERS.league && g.league !== parseInt(FILTERS.league)) return false;
  if (classes && !classes[g.cls]) return false;
  // With both a division and a club, the same team has to answer both -- a
  // Sharks 14AAA filter means the Sharks' 14AAA side, not their 14AA side in a
  // game whose other team happens to be a 14AAA club. With only one set, either
  // side is enough: that is how somebody following just a division, or just a
  // club, thinks about it.
  if (SCHED.div && SCHED.club) {
    var matched = ['home', 'away'].some(function(side) {
      return schedClubOf(g, side) === SCHED.club && schedSideDivision(g, side) === SCHED.div;
    });
    if (!matched) return false;
  } else {
    if (SCHED.div && schedDivisionsOf(g).indexOf(SCHED.div) < 0) return false;
    if (SCHED.club && schedClubOf(g, 'home') !== SCHED.club
                   && schedClubOf(g, 'away') !== SCHED.club) return false;
  }
  return true;
}

// With one club in one division picked, the played games on show are that
// team's, so their record is worth stating. A game the club played against
// itself is neither a win nor a loss for it, and drops out.
function schedTeamRecord(games, club) {
  var w = 0, l = 0, t = 0, gf = 0, ga = 0;
  games.forEach(function(g) {
    if (g.hg == null || g.ag == null) return;
    var home = schedClubOf(g, 'home') === club;
    var away = schedClubOf(g, 'away') === club;
    if (home === away) return;
    var forGoals = home ? g.hg : g.ag;
    var againstGoals = home ? g.ag : g.hg;
    gf += forGoals; ga += againstGoals;
    if (forGoals > againstGoals) w++; else if (forGoals < againstGoals) l++; else t++;
  });
  return { w: w, l: l, t: t, n: w + l + t, gf: gf, ga: ga };
}

// The one team a club + division filter resolves to this season, so the filtered
// schedule can point at that team's own page rather than pretend to be it. Null
// when the filter still spans more than one team (a club with two squads in the
// division), where a single link would be a guess.
function schedFilteredTeamKey(season) {
  if (!(SCHED.div && SCHED.club)) return null;
  var keys = {};
  SCHEDULE.rows.forEach(function(g) {
    if (g.season !== season) return;
    ['home', 'away'].forEach(function(side) {
      if (schedClubOf(g, side) === SCHED.club && schedSideDivision(g, side) === SCHED.div) {
        var id = side === 'home' ? g.home : g.away;
        if (id != null) keys[teamKey(season, id)] = true;
      }
    });
  });
  var arr = Object.keys(keys);
  return arr.length === 1 ? arr[0] : null;
}

// A division's table, computed from the game results themselves rather than any
// published standings. Nothing is published for the current season in preseason,
// and SCAHA has no history here at all, so the results are the one source that
// works every season. Only games between two teams of the same division count,
// which keeps it a closed round-robin -- the wins, losses and goals across the
// table each balance, which is how we know it is right. Scope 'regular' counts
// the regular season; 'all' adds preseason, exhibition and the rest.
function schedStandings(season, league, div, scope) {
  var rec = {};
  function row(id) {
    if (!rec[id]) rec[id] = { id: id, gp: 0, w: 0, l: 0, t: 0, gf: 0, ga: 0 };
    return rec[id];
  }
  function divOf(id) {
    var team = APP.teamByKey[teamKey(season, id)];
    if (!team || team.division == null) return null;
    var d = APP.divisionById[team.division];
    // The granular division -- East and West are their own tables, as on TTS.
    return d ? d.name : null;
  }
  SCHEDULE.rows.forEach(function(g) {
    if (g.season !== season || g.league !== league) return;
    if (scope !== 'all' && g.cls !== 'regular') return;
    if (g.hg == null || g.ag == null || g.home == null || g.away == null) return;
    if (divOf(g.home) !== div || divOf(g.away) !== div) return;
    var h = row(g.home), a = row(g.away);
    h.gp++; a.gp++; h.gf += g.hg; h.ga += g.ag; a.gf += g.ag; a.ga += g.hg;
    if (g.hg > g.ag) { h.w++; a.l++; }
    else if (g.ag > g.hg) { a.w++; h.l++; }
    else { h.t++; a.t++; }
  });
  var rows = Object.keys(rec).map(function(id) {
    var r = rec[id];
    r.pts = 2 * r.w + r.t;
    r.gd = r.gf - r.ga;
    r.name = teamName(APP.teamByKey[teamKey(season, r.id)]);
    return r;
  });
  // Points first, then goal difference and goals for -- the usual order -- and a
  // name to settle the rest so the table does not reshuffle between renders.
  rows.sort(function(x, y) {
    return y.pts - x.pts || y.gd - x.gd || y.gf - x.gf || x.name.localeCompare(y.name);
  });
  return rows;
}

// One Regular / All-games preference, shared by the division standings and the
// team record so the same choice follows the reader between them. Null until
// they pick; each view falls back to its own sensible default meanwhile.
var RESULTS_SCOPE = null;
function setResultsScope(scope) {
  RESULTS_SCOPE = scope;
  var v = document.body.getAttribute('data-view');
  if (v === 'team' && TEAM_VIEW) renderTeamRecord(TEAM_VIEW.team, TEAM_VIEW.rows);
  else if (v === 'schedule') renderSchedule();
}

// The standings sit above the schedule, and only where one league and one
// division are picked -- otherwise the rows would span teams that never shared a
// table. A season with nothing played in scope yet (preseason) has none, and
// says so rather than leaving a silent gap.
function schedStandingsPanel(season) {
  var league = parseInt(FILTERS.league);
  if (!league || !SCHED.div) return '';
  var scope = RESULTS_SCOPE || 'regular';
  var scopeWord = scope === 'all' ? 'all games' : 'regular season';
  var head = '<div class="section-heading" style="margin-bottom:8px"><h2>Standings</h2>'
    + '<span class="badge">' + escHtml(SCHED.div) + ' · ' + scopeWord + '</span></div>'
    + '<div class="rec-head" style="margin-bottom:12px"><div class="rec-toggle">'
    + '<button type="button" class="rec-btn' + (scope === 'regular' ? ' active' : '')
    + '" onclick="setResultsScope(\'regular\')">Regular</button>'
    + '<button type="button" class="rec-btn' + (scope === 'all' ? ' active' : '')
    + '" onclick="setResultsScope(\'all\')">All games</button>'
    + '</div></div>';

  var rows = schedStandings(season, league, SCHED.div, scope);
  if (!rows.length) {
    // Nothing played in scope yet. If games are on the schedule, say the table
    // is coming rather than leave a gap that reads as missing.
    var scheduled = SCHEDULE.rows.some(function(g) {
      return g.season === season && g.league === league
        && (scope === 'all' || g.cls === 'regular')
        && (g.hg == null || g.ag == null)
        && schedSideDivision(g, 'home') === SCHED.div
        && schedSideDivision(g, 'away') === SCHED.div;
    });
    if (!scheduled) return '';
    return head
      + '<div class="band-note">No ' + (scope === 'all' ? 'games' : 'regular-season games')
      + ' have been played yet &mdash; the table appears once they are.</div>'
      + '<div style="margin-top:28px"></div>';
  }
  var body = rows.map(function(r, i) {
    var gd = (r.gd > 0 ? '+' : '') + r.gd;
    return '<tr>'
      + '<td class="num st-rk">' + (i + 1) + '</td>'
      + '<td><span class="team-link" onclick="goToTeam(\'' + teamKey(season, r.id) + '\')">'
      + escHtml(r.name) + '</span></td>'
      + '<td class="num">' + r.gp + '</td>'
      + '<td class="num">' + r.w + '</td>'
      + '<td class="num">' + r.l + '</td>'
      + '<td class="num">' + r.t + '</td>'
      + '<td class="num pts">' + r.pts + '</td>'
      + '<td class="num">' + r.gf + '</td>'
      + '<td class="num">' + r.ga + '</td>'
      + '<td class="num">' + escHtml(gd) + '</td>'
      + '</tr>';
  }).join('');
  var lede = 'Built from played ' + (scope === 'all' ? '' : 'regular-season ')
    + 'games between the division’s teams. 2 points for a win, 1 for a tie.';
  return head
    + '<div class="band-note">' + lede + '</div>'
    + '<div class="table-wrap"><table class="standings-table"><thead><tr>'
    + '<th class="num">#</th><th>Team</th><th class="num" title="Games played">GP</th>'
    + '<th class="num" title="Wins">W</th><th class="num" title="Losses">L</th>'
    + '<th class="num" title="Ties">T</th><th class="num" title="Points">PTS</th>'
    + '<th class="num" title="Goals for">GF</th><th class="num" title="Goals against">GA</th>'
    + '<th class="num" title="Goal difference">DIFF</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<div style="margin-top:28px"></div>';
}

// ── Rendering ─────────────────────────────────────────────────────────────
var SCHED_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var SCHED_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

function scheduleDayLabel(iso) {
  var p = iso.split('-');
  if (p.length !== 3) return iso;
  var d = new Date(+p[0], +p[1] - 1, +p[2]);
  var label = SCHED_DAYS[d.getDay()] + ' ' + SCHED_MONTHS[d.getMonth()] + ' ' + (+p[2])
            + ', ' + p[0];
  var today = new Date(); today.setHours(0, 0, 0, 0);
  var days = Math.round((d - today) / 86400000);
  if (days === 0) return 'Today · ' + label;
  if (days === 1) return 'Tomorrow · ' + label;
  if (days === -1) return 'Yesterday · ' + label;
  return label;
}

// A side the collector could not pin to a team row -- 503 games have one --
// keeps the name the site printed, and is not a link to anywhere.
function scheduleSide(g, side, winner) {
  var id = side === 'home' ? g.home : g.away;
  var team = id != null ? APP.teamByKey[teamKey(g.season, id)] : null;
  var won = winner === side;
  if (!team) {
    var raw = (side === 'home' ? g.homeName : g.awayName) || 'Unknown';
    return won ? '<span class="sched-win">' + escHtml(raw) + '</span>' : escHtml(raw);
  }
  return '<span class="team-link' + (won ? ' sched-win' : '')
    + '" onclick="event.stopPropagation();goToTeam(\'' + teamKey(g.season, id) + '\')">'
    + escHtml(teamName(team)) + '</span>';
}

function scheduleRow(g, today) {
  var played = g.hg != null && g.ag != null;
  var winner = played ? (g.hg > g.ag ? 'home' : g.ag > g.hg ? 'away' : null) : null;
  var result;
  if (played) {
    result = '<span class="sched-score">' + g.ag + ' – ' + g.hg + '</span>';
  } else if (g.date >= today) {
    result = '<span class="sched">–</span>';
  } else {
    // Scheduled, in the past, never given a score. 5,613 games are like this,
    // and they were real fixtures, so the row stays and says so.
    result = '<span class="sched-none">no result</span>';
  }
  return '<tr class="game-link" onclick="openBoxScore(' + g.season + ',\'' + g.id + '\')">'
    + '<td class="log-date">' + escHtml(g.time || '') + '</td>'
    + '<td>' + scheduleSide(g, 'away', winner)
    + ' <span class="sched-at">@</span> ' + scheduleSide(g, 'home', winner) + '</td>'
    + '<td class="log-class">' + escHtml(g.level || '') + '</td>'
    + '<td class="log-class">' + escHtml(gameTypeLabel(g.cls, g.stage)) + '</td>'
    + '<td class="num">' + result + '</td>'
    + '<td class="log-class">' + escHtml(g.rink || '') + '</td>'
    + '</tr>';
}

function scheduleBand(games, shown, band, today) {
  var slice = games.slice(0, shown);
  var body = '', day = null, i;
  for (i = 0; i < slice.length; i++) {
    if (slice[i].date !== day) {
      day = slice[i].date;
      var n = 0;
      for (var j = i; j < slice.length && slice[j].date === day; j++) n++;
      body += '<tr class="sched-day"><td colspan="6">' + escHtml(scheduleDayLabel(day))
            + '<span class="day-n">' + n + (n === 1 ? ' game' : ' games') + '</span></td></tr>';
    }
    body += scheduleRow(slice[i], today);
  }
  var html = '<div class="table-wrap"><table><thead><tr>'
    + '<th>Time</th><th>Game</th><th>Level</th><th>Type</th>'
    + '<th style="text-align:right">Result</th><th>Rink</th>'
    + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  if (games.length > slice.length) {
    var left = games.length - slice.length;
    html += '<button class="sched-more" onclick="schedMore(\'' + band + '\')">'
      + 'Show ' + Math.min(left, SCHED_PAGE) + ' more · ' + left.toLocaleString()
      + ' still hidden</button>';
  }
  return html;
}

function schedMore(band) {
  SCHED[band] += SCHED_PAGE;
  renderSchedule();
}

// What the collapsed filter panel says it is showing, on the same terms as the
// browse one: only what is actually narrowing something gets named.
// What the collapsed bar says it is set to. One row, so one summary -- it
// reads whichever view is showing, in the order the controls sit in.
function updateFilterSummary() {
  var el = document.getElementById('filter-summary');
  if (!el) return;
  var view = document.body.getAttribute('data-view') || 'schedule';
  var parts = [];
  var value = function(id) {
    var sel = document.getElementById(id);
    return sel ? sel.value : '';
  };

  if (view === 'schedule') {
    if (SCHED.season != null) parts.push(SEASON_LABELS[SCHED.season] || ('Season ' + SCHED.season));
    parts.push(typeSummaryFor(SCHED.classes));
    parts.push(SCHED.div || 'all divisions');
    if (SCHED.club) parts.push(clubDisplayName(SCHED.club));
  } else if (view === 'browse') {
    var season = value('sel-season');
    if (!season) { el.textContent = 'Choose a season'; return; }
    parts.push(SEASON_LABELS[parseInt(season)] || season);
    parts.push(typeSummaryFor(FILTERS.classes));
    parts.push(value('sel-club-browse') ? clubDisplayName(value('sel-club-browse')) : 'all clubs');
    if (value('sel-div-browse')) parts.push(value('sel-div-browse'));
    if (value('sel-type') === 'skater') parts.push('skaters');
    if (value('sel-type') === 'goalie') parts.push('goalies');
    var minGP = parseInt(value('sel-min-gp')) || 1;
    if (minGP > 1) parts.push(minGP + '+ GP');
  } else if (view === 'club' || view === 'team') {
    var cs = CLUB_SEASON;
    parts.push(cs ? (SEASON_LABELS[parseInt(cs)] || cs) : 'all seasons');
    parts.push(typeSummaryFor(FILTERS.classes));
    parts.push(value('sel-club') ? clubDisplayName(value('sel-club')) : 'no club chosen');
  } else if (view === 'player') {
    // Nothing else is set here, so the one control has to carry the line --
    // and a collapsed bar saying nothing reads as a bar with nothing in it.
    parts.push(typeSummaryFor(FILTERS.classes) || 'all game types');
  }

  var leagueSel = document.getElementById('sel-league');
  if (view !== 'player' && leagueSel && leagueSel.value) {
    var league = APP.leagueById[parseInt(leagueSel.value)];
    if (league) parts.splice(1, 0, league.name);
  }
  el.textContent = parts.filter(Boolean).join(' · ') || 'Filters';
}

// Only worth naming when it is not the default; "all types" in a summary line
// is a word spent saying nothing was narrowed.
function typeSummaryFor(classes) {
  var all = APP.gameClasses || [];
  var ticked = all.filter(function(c) { return classes && classes[c]; });
  if (ticked.length === all.length) return '';
  if (!ticked.length) return 'no game types';
  return ticked.map(filterClassLabel).join(' + ');
}

function readSchedTypes() {
  var ticked = {};
  document.querySelectorAll('#sched-type-boxes input:checked').forEach(function(box) {
    if (!box.closest('.type-all')) ticked[box.value] = true;
  });
  SCHED.classes = ticked;
  paintTypeMenu('sched-type-summary', 'sched-type-boxes', Object.keys(ticked));
}

function schedClassFilter() {
  if (!SCHED.classes) return null;
  var ticked = Object.keys(SCHED.classes);
  if (APP.gameClasses && ticked.length === APP.gameClasses.length) return null;
  return SCHED.classes;
}

function onSchedTypeChange() {
  readSchedTypes();
  SCHED.upcoming = SCHED.recent = SCHED_PAGE;
  renderSchedule();
}

// The one global Season, always in the header. Whatever view is open redraws for
// the chosen season: the schedule, the stats, a club's season, or the same team a
// year earlier. The player page spans every season, so it scrolls to that one.
function onGlobalSeasonChange() {
  var season = parseInt(document.getElementById('sel-season').value);
  SCHED.season = season;
  SCHED.upcoming = SCHED.recent = SCHED_PAGE;
  var v = document.body.getAttribute('data-view');
  if (v === 'browse') onSeasonChange();
  else if (v === 'club') { CLUB_SEASON = season; renderClub(); }
  else if (v === 'team') switchTeamSeason(season);
  else if (v === 'player') scrollToPlayerSeason(season);
  else { rebuildSchedFilters(); renderSchedule(); }
}

// On a team page, the season control switches to the same club's team in the same
// division that season. Where the club iced no such team, the page says so rather
// than jump somewhere unrelated.
function switchTeamSeason(season) {
  var cur = APP.teamByKey[CURRENT_TEAM_KEY];
  if (!cur) return;
  var curDiv = cur.division != null ? coreDivision((APP.divisionById[cur.division] || {}).name || '') : '';
  var match = (APP.core.teams || []).find(function(t) {
    if (t.season !== season || t.club !== cur.club) return false;
    return coreDivision((APP.divisionById[t.division] || {}).name || '') === curDiv;
  });
  if (match) { goToTeam(teamKey(season, match.id)); return; }
  var host = document.getElementById('team-content');
  if (host) {
    host.innerHTML = '<div class="empty"><div class="icon">📭</div>'
      + escHtml(clubDisplayName(cur.club)) + (curDiv ? ' ' + escHtml(curDiv) : '')
      + ' has no ' + escHtml(SEASON_LABELS[season] || ('season ' + season)) + ' record.</div>';
  }
}

// The player page already lists every season; nudge to the chosen one if it is
// there, and otherwise leave the page where it is.
function scrollToPlayerSeason(season) {
  var el = document.querySelector('#player-content [data-season="' + season + '"]');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Which season the picker opens on.
//
// Read off the newest game that has actually been played rather than the
// newest season in the file, so it rolls over on its own: through the summer
// that is the season just finished, and the first preseason weekend of the
// next one moves it forward. Taking the highest season id instead would empty
// the band the moment a league published next year's fixtures.
function currentScheduleSeason() {
  if (SCHEDULE.partial != null) return SCHEDULE.partial;
  if (SCHEDULE.season != null) return SCHEDULE.season;
  var today = todayISO();
  var rows = SCHEDULE.rows || [];
  for (var i = rows.length - 1; i >= 0; i--) {
    if (rows[i].date < today) { SCHEDULE.season = rows[i].season; return SCHEDULE.season; }
  }
  SCHEDULE.season = rows.length ? rows[0].season : null;
  return SCHEDULE.season;
}

function renderSchedule() {
  var content = document.getElementById('schedule-content');
  if (!SCHEDULE.rows) return;

  var div = document.getElementById('sel-sched-div').value;
  var club = document.getElementById('sel-sched-club').value;
  // Any change to what is being asked for starts the bands over. Keeping a
  // reader 300 rows deep after they narrow to one club shows them nothing.
  if (div !== SCHED.div || club !== SCHED.club) {
    SCHED.upcoming = SCHED.recent = SCHED_PAGE;
  }
  SCHED.div = div; SCHED.club = club;
  updateFilterSummary();

  var classes = schedClassFilter();
  var today = todayISO();
  var season = SCHED.season;
  var upcoming = [], recent = [], noResult = 0;
  // The file arrives sorted by date, so splitting it is a walk, not a sort.
  SCHEDULE.rows.forEach(function(g) {
    if (season != null && g.season !== season) return;
    if (!schedulePasses(g, classes)) return;
    if (g.date >= today) upcoming.push(g);
    else {
      recent.push(g);
      if (g.hg == null) noResult++;
    }
  });
  recent.reverse();

  if (!upcoming.length && !recent.length) {
    content.innerHTML = '<div class="empty"><div class="icon">📭</div>'
      + 'No games match these filters.</div>';
    return;
  }

  var html = '';
  if (SCHEDULE.partial != null) {
    html += '<div class="band-note">Showing <strong>'
      + escHtml(SEASON_LABELS[SCHEDULE.partial] || ('season ' + SCHEDULE.partial))
      + '</strong> only. This dataset has no <code>schedule.json</code>, the'
      + ' cross-season index, so earlier seasons are not listed here — they are'
      + ' still on every team and player page. The nightly run writes one.</div>';
  }
  // With a league and a division picked, the schedule is one division's, so its
  // table belongs above it.
  html += schedStandingsPanel(season);
  // A season with nothing left to play is an archive, not a schedule: there is
  // no "next", so there is no "recent" either -- everything in it is simply
  // the results. Both words go rather than sit over a band that has one game
  // in it from two years ago.
  if (upcoming.length) {
    html += '<div class="section-heading"><h2>Next up</h2><span class="badge">'
      + upcoming.length.toLocaleString() + ' scheduled</span></div>'
      + scheduleBand(upcoming, SCHED.upcoming, 'upcoming', today)
      + '<div style="margin-top:28px"></div>';
  }
  // One club in one division is a single team, so its record belongs beside the
  // played count. Without both, the band spans several teams and a record would
  // be meaningless.
  var recordBadge = '';
  if (SCHED.div && SCHED.club) {
    var rec = schedTeamRecord(recent, SCHED.club);
    if (rec.n) {
      recordBadge = '<span class="badge sched-record" title="Wins–losses–ties · goals for–against">'
        + rec.w + '-' + rec.l + '-' + rec.t + ' record'
        + ' · ' + rec.gf + ' GF / ' + rec.ga + ' GA</span>';
    }
    // This is the schedule filtered to one team, not the team's own page -- link
    // out to that page rather than duplicate it here.
    var tk = schedFilteredTeamKey(season);
    if (tk) {
      recordBadge += ' <span class="team-link sched-teamlink" onclick="goToTeam(\''
        + escAttr(tk) + '\')">Open team page →</span>';
    }
  }
  html += '<div class="section-heading"><h2>'
    + (upcoming.length ? 'Recent results' : 'Results') + '</h2><span class="badge">'
    + (recent.length - noResult).toLocaleString() + ' played'
    + (noResult ? ' · ' + noResult.toLocaleString() + ' with no result' : '')
    + '</span>' + recordBadge + '</div>'
    + (recent.length
        ? scheduleBand(recent, SCHED.recent, 'recent', today)
        : '<div class="band-note">Nothing played yet.</div>');

  content.innerHTML = html;
}

// ════════════════════════════════════════
// VIEW 1: Browse
// ════════════════════════════════════════
let browseSort={col:'PTS',dir:-1};
// Populates the one shared Season select (newest first) and sets the default the
// whole app opens on; SCHED.season mirrors it so the schedule opens there too.
var BROWSE_RENDERED_SEASON = null;
function initBrowse(){
  const sel=document.getElementById('sel-season');
  SEASONS.slice().reverse().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=SEASON_LABELS[s];sel.appendChild(o);});
  sel.value=latestSeasonWithData();
  SCHED.season=parseInt(sel.value);
  onSeasonChange();
}
function onSeasonChange(){
  const season=parseInt(document.getElementById('sel-season').value);
  BROWSE_RENDERED_SEASON=season;
  const clubSel=document.getElementById('sel-club-browse');
  const divSel=document.getElementById('sel-div-browse');
  // Reset both dropdowns
  clubSel.innerHTML='<option value="">— all —</option>';
  divSel.innerHTML='<option value="">— all —</option>';
  if(!season){onBrowseRender();return;}
  // Populate Club dropdown: all clubs with data for this season
  const entries=ALL_ENTRIES.filter(e=>e.season===season);
  const clubs=[...new Set(entries.map(e=>e.club).filter(Boolean))].filter(isBrowsableClub).sort((a,b)=>clubDisplayName(a).localeCompare(clubDisplayName(b)));
  clubs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=clubDisplayName(c);clubSel.appendChild(o);});
  // Populate Division dropdown: all divisions for this season
  const divs=[...new Set(entries.map(e=>e.division).filter(Boolean))].sort();
  divs.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;divSel.appendChild(o);});
  onBrowseRender();
}
// Division narrows Club, not the other way round: divisions are steady season
// to season, but a club may field no team in a given division in a given year,
// so once a division is picked the club list drops to those actually in it.
function onDivBrowseChange(){
  const season=parseInt(document.getElementById('sel-season').value);
  const div=document.getElementById('sel-div-browse').value;
  const clubSel=document.getElementById('sel-club-browse');
  const prevClub=clubSel.value;
  clubSel.innerHTML='<option value="">— all —</option>';
  if(season){
    let entries=ALL_ENTRIES.filter(e=>e.season===season);
    if(div)entries=entries.filter(e=>e.division===div);
    const clubs=[...new Set(entries.map(e=>e.club).filter(Boolean))].filter(isBrowsableClub).sort((a,b)=>clubDisplayName(a).localeCompare(clubDisplayName(b)));
    clubs.forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=clubDisplayName(c);clubSel.appendChild(o);});
    // Keep the club if it still fields a team in this division.
    if(prevClub && clubs.includes(prevClub))clubSel.value=prevClub;
  }
  onBrowseRender();
}
function onClubBrowseChange(){ onBrowseRender(); }

// The one team a season + club + division narrows to, so the stats view can link
// out to that team's own page rather than be a second, lesser team view. Null
// when it still spans more than one team.
function browseFilteredTeamKey(season, club, div){
  if(!club || !div) return null;
  var keys={};
  ALL_ENTRIES.forEach(function(e){
    if(e.season===season && e.club===club && e.division===div && e.teamKey) keys[e.teamKey]=true;
  });
  var arr=Object.keys(keys);
  return arr.length===1 ? arr[0] : null;
}
// What the collapsed filter panel says it is showing. Only the season is
// always named; the rest appear when they are actually narrowing something, so
// the line stays short enough to read on a phone.
function updateBrowseSummary(){ updateFilterSummary(); }


function onBrowseRender(){
  updateBrowseSummary();
  const season=parseInt(document.getElementById('sel-season').value);
  const club=document.getElementById('sel-club-browse').value;
  const div=document.getElementById('sel-div-browse').value;
  const type=document.getElementById('sel-type').value;
  const minGP=parseInt(document.getElementById('sel-min-gp').value)||1;
  if(!season){document.getElementById('browse-content').innerHTML='<div class="empty"><div class="icon">🏒</div>Select a season above to begin.</div>';return;}
  // Build label
  let subLabel='';
  if(club)subLabel+=' · '+clubDisplayName(club);
  if(div)subLabel+=' · '+div;
  const content=document.getElementById('browse-content');
  let html='';
  // Narrowed to a single team? This is the stats view, not the team's page --
  // link out to that page rather than duplicate it here.
  const tkey=browseFilteredTeamKey(season,club,div);
  if(tkey){
    html+='<div class="band-note" style="margin:0 0 14px"><span class="team-link sched-teamlink" onclick="goToTeam(\''+escAttr(tkey)+'\')">Open team page →</span></div>';
  }
  // Helper to filter entries
  const baseFilter=e=>e.season===season&&(club?e.club===club:true)&&(div?e.division===div:true);
  if(type==='skater'||type==='all'){
    let sk=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='skater'&&(parseInt(e.GP)||0)>=minGP);
    browseSort={col:'PTS',dir:-1};
    sk.sort((a,b)=>entryPts(b)-entryPts(a));
    if(sk.length){
      html+='<div class="section-heading"><h2>'+escHtml(SEASON_LABELS[season]+(subLabel||' · All'))+'</h2><span class="badge">'+sk.length+' skaters</span></div>'+renderSkaterTable(sk,true,'browse-table');
    } else {
      html+='<div class="empty" style="padding:12px 0"><div class="icon">📭</div>No skater data found.</div>';
    }
  }
  if(type==='goalie'||type==='all'){
    let gl=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='goalie'&&(parseInt(e.GP)||0)>=minGP);
    browseGoalieSort={col:'GAA',dir:1};
    gl.sort((a,b)=>(parseFloat(a.GAA)||0)-(parseFloat(b.GAA)||0));
    if(gl.length){
      if(type==='all')html+='<div style="margin-top:24px"></div>';
      const heading=type==='goalie'?'<div class="section-heading"><h2>'+escHtml(SEASON_LABELS[season]+(subLabel||' · All'))+'</h2><span class="badge">'+gl.length+' goalies</span></div>':'<div class="section-heading"><h2>Goalies</h2><span class="badge">'+gl.length+'</span></div>';
      html+=heading+renderGoalieTable(gl,true,'browse-goalie-table');
    } else {
      html+='<div class="empty" style="padding:12px 0"><div class="icon">📭</div>No goalie data found.</div>';
    }
  }
  if(!html)html='<div class="empty"><div class="icon">📭</div>No data found.</div>';
  // Narrowed to one division, the player leaderboards are followed by the
  // division broken down by team: special teams, scoring balance, home ice and
  // the pairs who score together. A jump chip goes above the roster so the
  // breakdown below a long list is not missed; it is filled only when there is
  // actually a breakdown to jump to.
  if(div){
    html = '<div id="browse-jump"></div>' + html
      + '<div id="browse-division" style="margin-top:32px"></div>';
  }
  content.innerHTML=html;
  if(type==='skater'||type==='all'){
    const sk=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='skater'&&(parseInt(e.GP)||0)>=minGP);
    attachSortHandlers('browse-table',sk,true);
  }
  if(type==='goalie'||type==='all'){
    const gl=ALL_ENTRIES.filter(e=>baseFilter(e)&&e.type==='goalie'&&(parseInt(e.GP)||0)>=minGP);
    attachGoalieSortHandlers('browse-goalie-table',gl,true);
  }
  if(div) renderBrowseDivision(season, div, club);
}

// The division breakdown under the Stats leaderboards. Scoped to the same
// season, division and (if set) club as the tables above; ALL_ENTRIES is
// already narrowed to the League picker. A division name can recur across
// leagues, so if it spans more than one and no league is picked, ask for one
// rather than merge leagues that never play each other.
function renderBrowseDivision(season, div, club) {
  var host = document.getElementById('browse-division');
  var jump = document.getElementById('browse-jump');
  if (!host) return;
  var entries = ALL_ENTRIES.filter(function(e) {
    return e.season === season && e.division === div && (club ? e.club === club : true);
  });
  if (!entries.length) { host.innerHTML = ''; if (jump) jump.innerHTML = ''; return; }
  if (jump) jump.innerHTML = '<div class="dr-jump"><button onclick="jumpToDivisionBreakdown()">'
    + escHtml(div) + ' breakdown &darr;</button></div>';
  var leagues = {};
  entries.forEach(function(e) { if (e.leagueId != null) leagues[e.leagueId] = true; });
  var leagueIds = Object.keys(leagues);
  if (leagueIds.length > 1 && !FILTERS.league) {
    host.innerHTML = '<div class="panel dr-panel"><div class="dr-h">Division breakdown</div>'
      + '<p class="dr-lede">' + escHtml(div) + ' runs in ' + leagueIds.length
      + ' leagues this season. Pick a league above to break the division down by team.</p></div>';
    return;
  }
  var lg = APP.leagueById[entries[0].leagueId];
  var teamSet = {};
  entries.forEach(function(e) { teamSet[e.teamKey] = 1; });
  var teamCount = Object.keys(teamSet).length;
  host.innerHTML = '<div class="section-heading" style="margin-bottom:14px">'
    + '<h2>Division breakdown</h2><span class="badge">' + escHtml(div)
    + (lg ? ' · ' + escHtml(lg.name) : '') + ' · ' + teamCount + ' team' + (teamCount === 1 ? '' : 's')
    + '</span></div><div id="browse-division-panels"></div>';
  renderDivisionInto(document.getElementById('browse-division-panels'), entries, season);
}

function jumpToDivisionBreakdown() {
  var el = document.getElementById('browse-division');
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
// Shared first-6-column widths for skater/goalie browse tables so columns align.
const BROWSE_SHARED_COLS='<col style="width:3%"><col style="width:20%"><col style="width:4%"><col style="width:19%"><col style="width:9%"><col style="width:5%">';
// The abbreviated stat columns spelled out, shown on hovering the header.
var STAT_TIPS = {
  'GP': 'Games played', 'G': 'Goals', 'A': 'Assists',
  'PTS': 'Points (goals + assists)', 'PIM': 'Penalty minutes',
  'PPG': 'Power-play goals', 'SHG': 'Short-handed goals', 'Pts/GP': 'Points per game',
  'Shots': 'Shots faced', 'GA': 'Goals against', 'GAA': 'Goals-against average',
  'Save%': 'Save percentage', 'SO': 'Shutouts'
};
function statHdr(c, rightAlign) {
  var r = rightAlign ? ' style="text-align:right"' : '';
  var t = STAT_TIPS[c] ? ' title="' + escAttr(STAT_TIPS[c]) + '"' : '';
  return '<th data-col="' + c + '"' + r + t + '>' + c + '</th>';
}
function renderSkaterTable(entries,showTeamDiv,tableId){
  const cols=showTeamDiv?['Rk','Player','#','Team','Division','GP','G','A','PTS','PIM','PPG','SHG','Pts/GP']:['Rk','Player','#','GP','G','A','PTS','PIM','PPG','SHG','Pts/GP'];
  const makeRow=(e,i)=>{
    const td=(v,cls='')=>'<td'+(cls?' class="'+cls+'"':'')+'>'+v+'</td>';
    const pts=entryPts(e);
    const base=[td(i+1,'num'),td('<span class="player-link" onclick="goToPlayer('+e.playerId+')">'+escHtml(e.playerName)+byLabel(e.playerId)+'</span>'),td(e.jersey||'','jersey')];
    if(showTeamDiv)base.push(td('<span class="team-link" onclick="goToTeam(\''+escAttr(e.teamKey)+'\')">'+escHtml(e.team)+'</span>'),td('<span class="div-badge">'+escHtml(e.division||'')+'</span>'));
    base.push(td(e.GP||0,'num'),td(e.G||0,'num'),td(e.A||0,'num'),td(pts,'num pts'),td(e.PIM||0,'num'),td(e.PPG||0,'num'),td(e.SHG||0,'num'),td(entryPtsPerGame(e),'num'));
    return '<tr>'+base.join('')+'</tr>';
  };
  const hdrs=cols.map((c,i)=>statHdr(c, i>=(showTeamDiv?5:3))).join('');
  const cg=showTeamDiv?'<colgroup>'+BROWSE_SHARED_COLS+'<col style="width:6%"><col style="width:6%"><col style="width:7%"><col style="width:6%"><col style="width:5%"><col style="width:5%"><col style="width:8%"></colgroup>':'';
  const tableStyle=showTeamDiv?' style="table-layout:fixed;width:100%"':'';
  return '<div class="table-wrap"><table class="ranked" id="'+(tableId||'t')+'"'+tableStyle+'>'+cg+'<thead><tr>'+hdrs+'</tr></thead><tbody>'+entries.map(makeRow).join('')+'</tbody></table></div>';
}
function attachSortHandlers(tableId,entries,showTeamDiv){
  const table=document.getElementById(tableId);
  if(!table)return;
  table.querySelectorAll('th[data-col]').forEach(th=>{
    th.addEventListener('click',()=>{
      const col=th.dataset.col;
      if(browseSort.col===col)browseSort.dir*=-1; else{browseSort.col=col;browseSort.dir=-1;}
      entries.sort((a,b)=>{
        let va,vb;
        if(col==='Player'){va=a.playerName;vb=b.playerName;}
        else if(col==='Team'){va=a.team||'';vb=b.team||'';}
        else if(col==='Division'){va=a.division||'';vb=b.division||'';}

      });
